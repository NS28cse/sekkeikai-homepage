title: 設計会
description: 岡山県立大学の公認サークル「設計会」。ものの価値を大きく決めるのは、何を・誰のためにつくるかを決める「設計」の力です。学部の違う仲間と、その力を磨きます。経験は要りません。
# トップページは「なぜ今、設計が大事なのか」を長文で伝える。書き方の決まりはdocs/writing-guide.md。
#   - 章は「設計とは → なぜ価値を決めるのか → なぜ今か → 学べるのか → 何を学ぶか → 誰と → どこで」の順。
#     前の章が次の章の前提になるように並べている（順番を変えるときは、話がつながるかを確かめる）
#   - 章の見出し（title）は主張の形で。見出しだけ追っても話がつながるようにする
#   - eyebrowは読者が心の中で持っている問い。pointはその章の要点（先頭の一覧にも自動で出る）
#   - 主張には実際にあった例を添える。短い出典は段落のnote（本文の右）に、長い補足はaside（折りたたみ）に
#   - AIの話から始めない。AIは「つくる道具が手軽になった」理由の一つとして扱う
sections:
  - type: hero
    eyebrow: 岡山県立大学 公認サークル
    title: つくる前に、考え抜く。
    lead: ものの価値を大きく決めるのは、何を・誰のためにつくるかを決める「設計」の力です。設計会は、学部の違う仲間とその力を磨くサークルです。経験は要りません。
    ctaLabel: 設計会の考え方
    ctaHref: "#summary"
    cta2Label: 入部について
    cta2Href: "#join"

  - type: summary
    title: 設計会の考え方

  - type: chapter
    id: what
    eyebrow: そもそも、設計って何？
    title: 設計とは、何を・誰のためにつくるかを決めること
    point: 設計は、図面を描くことだけではありません。誰の、どんな困りごとを、どう解くのかを決めて、つくる人に伝わる形にまとめることです。
    blocks:
      - type: question
        text: 台所のピーラー（皮むき器）を新しく設計するなら、最初に何を決めますか？
        answer: 形や色より先に、誰が、どんな場面で使うのかです。手の力が弱い人が使うのか、毎日たくさんの野菜をむく料理人が使うのかで、よい形はまったく変わります。
      - type: example
        title: 実際にあった例：握りやすいピーラー
        text: 1990年に発売されたOXOの台所道具「Good Grips」は、関節炎で手が痛む人が、細い金属の柄のピーラーを使いにくそうにしている姿から生まれました。開発チームは関節炎の人や料理人に話を聞き、太くて滑りにくい柄を設計しました。手の弱い人のために考えた形は、誰にとっても握りやすい形になり、多くの人に選ばれる道具になりました。
        source: Cooper Hewitt, Smithsonian Design Museum の解説
      - type: p
        text: 同じピーラーでも、何を・誰のためにつくるかを決めたとたんに、形も材料も値段も決まり始めます。この「決める」部分が設計です。図面や仕様書は、決めたことを、つくる人に伝えるための手段です。
        note: OXO の開発の経緯は、Cooper Hewitt（スミソニアン・デザイン博物館）の解説による。
      - type: example
        title: 実際にあった例：シャンプーのきざみ
        text: シャンプーとリンスの容器は、形も大きさもよく似ています。花王には1990年、「目をつむっても区別したい」という声が13件届き、そのうち4件は目の不自由な人からでした。そこで、シャンプーの容器の横に、指でさわってわかるきざみを付けることにし、1991年に実用化しました。花王はこの工夫で特許を取らず、ほかの会社にも使ってもらえるよう業界に呼びかけました。
      - type: p
        text: 誰のためにつくるかをはっきり決めると、わずかな声から、多くの人に役立つ形が生まれます。シャンプーのきざみは、のちに日本産業規格（JIS S 0021、2000年）や国際規格（ISO 11156、2011年）で、さわってわかる工夫の例として取り上げられました。牛乳パックの開け口の反対側にある半円のくぼみも、同じ規格に挙がっている例です。
        note: きざみの経緯は花王の発表による。牛乳パックのくぼみは500ml以上の屋根型の紙パックに付けられるもので、付けるかどうかは任意（国民生活センター）。
      - type: figure
        name: design-scope
      - type: p
        text: 設計の対象は「もの」だけではありません。アプリも、イベントも、案内表示も、誰かのために形を決めるものは、どれも設計の対象です。
      - type: tags
        label: 設計できるものの例
        items:
          - ウェブアプリ
          - ゲーム
          - ロボット
          - 建築
          - 介護用品
          - 病院の案内表示
          - ポスター
          - 地域イベント
          - 町おこし
          - マニュアル

  - type: chapter
    id: upstream
    eyebrow: なぜ、つくる前なの？
    title: 直すなら、つくる前がいちばん安い
    point: 完成してから直すと、つくる前に直すよりはるかに大きな手間がかかります。つくる前に考える時間は、少ない手間で結果を大きく変えられる時間です。
    blocks:
      - type: question
        text: 家を建てたあとで「窓をもう一つ増やしたい」と言ったら、どうなるでしょう？
        answer: 壁を壊し、柱を確かめ、工事をやり直すことになります。図面の段階なら、線を一本書き足すだけで済みました。
      - type: p
        text: ものづくりは、どの分野でもこれと同じです。決めたことの上に次の作業が積み重なっていくので、土台の間違いほど、直すときに崩すものが多くなります。
      - type: example
        title: 実際にあった例：発売してから見つかった電池の問題
        text: 2016年に発売されたスマートフォンGalaxy Note7は、電池が発火する事故が相次ぎ、発売から約2か月で生産と販売を打ち切りました。メーカーの調査では、原因は電池の設計と製造にありました。約306万台が回収され、その費用は少なくとも53億ドルと報じられています。
        source: Samsung Newsroom（2017年1月23日）、AP通信の報道
      - type: example
        title: 実際にあった例：ぼやけて見えた宇宙望遠鏡
        text: 1990年に打ち上げられたハッブル宇宙望遠鏡は、最初に届いた画像がぼやけていました。光を集める鏡が、決められた形より約2.2µm平らに磨かれていたのです。原因は、鏡の形を確かめる検査の道具の中で、レンズの位置が1.3mmずれていたことでした。打ち上げたあとでは、鏡を磨き直すことはできません。1993年、宇宙飛行士が補正の装置を取り付けに行く修理ミッションが必要になりました。
      - type: p
        text: ハッブルの鏡の誤りは、地上でつくる段階に紛れ込んだものでしたが、見つかったのは宇宙に出てからでした。誤りは、紛れ込んだときから遠くで見つかるほど、直すのが大がかりになります。
        note: 'NASA, "The Hubble Space Telescope Optical Systems Failure Report"（通称 Allen Report）, 1990。'
      - type: p
        text: 大きな宇宙開発の記録をもとにした見積もりでも、最初の段階で紛れ込んだ誤りを使い始めてから直すと、その場で直す場合の数十倍から千倍以上の手間がかかりました。
        note: J. M. Stecklein ほか, "Error Cost Escalation Through the Project Life Cycle", NASA, 2004。宇宙機のような大規模なシステムでの見積もりで、倍率は分野や規模で大きく変わる。
      - type: figure
        name: cost-escalation
      - type: p
        text: ただし、つくる前の段階も、進め方を誤れば大きな損失になります。2012年1月、特許庁は、中心となる業務システムを新しくする開発を中断しました。何をつくるかを決める要件定義の段階から先に進めず、技術検証委員会が「終わりが見通せない」と報告したためです。それまでに使った約55億円が無駄になったと報じられました。決めるべきことを決めきる力も、設計の力の一つです。
        note: 特許庁の基幹システムの刷新。中断と金額は日経コンピュータの報道による。
      - type: p
        text: 逆に言えば、つくる前の時間は、少ない手間で仕上がりを大きく変えられる時間です。設計会が「つくる前」にこだわるのは、そこにいちばん大きなチャンスがあるからです。

  - type: chapter
    id: why-now
    eyebrow: なぜ今なの？
    title: 前よりも、つくる前に考えることが大事になった
    point: ものは複雑につながり、使う人は多様になり、環境への責任も問われるようになりました。つくる道具が手軽になった今、価値を分けるのは「何をつくるか」の判断です。
    blocks:
      - type: heading
        text: ものが、複雑につながった
      - type: p
        text: 2024年7月、セキュリティソフトの設定ファイルが一つ配られただけで、世界中の約850万台のWindowsのパソコンが起動しなくなり、空港や銀行、病院の仕事が止まりました。原因は、ソフトの中の二つの部分が、受け渡すデータの数について違う前提を置いていたことでした。一部だけを見て決めると、つながった全体のどこかで困る人が出ます。
        note: 'CrowdStrike, "Channel File 291 Incident: Root Cause Analysis", 2024年8月。片方は21項目、もう片方は20項目を前提にしていた。台数はMicrosoftの発表による。'
      - type: figure
        name: interface-mismatch
      - type: p
        text: 日本でも、同じことが起きています。2020年10月1日、東京証券取引所では、記憶装置が一台故障したのに、予備への自動の切り替えが働かず、株の売買が丸一日止まりました。切り替えの設定値と、マニュアルの記載に誤りがあったためです。一つが壊れても止まらないはずの仕組みが、決めごとの食い違いで働きませんでした。
        note: 日本取引所グループ（JPX）の調査報告書（2020年）による。
      - type: example
        title: 実際にあった例：届かなかった振り込み
        text: 2023年10月10日から11日にかけて、銀行どうしの振り込みをつなぐ全銀システムで障害が起き、約506万件の取引のうち約87万件が当日に処理されませんでした。銀行側の中継コンピューターを新しくしたとき、プログラムが使う作業用の領域が足りなくなったことが原因でした。数千通りのテストをしていても、この食い違いはすり抜けていました。
        source: 技術評論社 gihyo.jp の解説（2023年11月）、全国銀行資金決済ネットワークの発表
      - type: heading
        text: 使う人が、多様になった
      - type: p
        text: 2024年4月から、障害のある人に求められたときの「合理的配慮」が、日本のすべての事業者の義務になりました。前もって誰でも使えるように整えておく「環境の整備」も、努力義務として求められています。多様な人を考えた設計は、ほかの人の役にも立ちます。歩道の段差を切り下げたスロープは、車いすの人のためにつくられ、今ではベビーカーやスーツケースを引く人も使っています。耳の不自由な人のためにつくられたテレビの字幕も、使ったことがある人の8割は、聴覚に障害のない人でした。
        note: 改正障害者差別解消法（2024年4月施行）。字幕の数字は、英国の放送の監督機関Ofcomの2006年の報告による。
      - type: figure
        name: subtitle-users
      - type: example
        title: 実際にあった例：岡山で生まれた点字ブロック
        text: 点字ブロックは、岡山で生まれました。1967年3月18日、岡山市の原尾島交差点に、三宅精一さんが私費で230枚のブロックを敷きました。近くには岡山盲学校がありました。足の裏で凹凸を感じて道がわかるこの工夫は、のちに日本産業規格（2001年）や国際規格（ISO 23599、2012年）になり、今では駅や歩道でふつうに見かけるものになりました。
        source: 岡山県の資料「点字ブロック発祥の地」、nippon.com（3月18日の記事）
      - type: heading
        text: 環境への責任が、つくる前に問われるようになった
      - type: p
        text: EUでは2024年12月から、スマートフォンなどの充電口をUSB Type-Cにそろえることが義務になりました。2027年からは、機器に組み込まれた小型の電池を、使う人が自分で交換できる設計も求められます。製品が環境に与える影響の多くは、設計の段階で決まると考えられているからです。
        note: 指令 (EU) 2022/2380、規則 (EU) 2023/1542 第11条（例外あり）。欧州委員会は、製品の環境への影響の最大80%が設計の段階で決まると推定している。
      - type: p
        text: 日本でも、2022年4月にプラスチック資源循環促進法が始まりました。一つの素材だけでできている、分けて捨てやすいといった、国の「設計指針」に合う製品を、国が認定する仕組みです。2026年2月には、初めての認定がペットボトルに出ました。
        note: プラスチックに係る資源循環の促進等に関する法律（2022年4月施行）。認定は環境省・農林水産省の発表による。
      - type: heading
        text: つくる道具が、手軽になった
      - type: p
        text: AIや3Dプリンターのおかげで、アプリも部品も、つくる手間はどんどん小さくなっています。ソフトウェア開発では、AIにいきなりプログラムを書かせるのではなく、まず何をつくるかを仕様にまとめてから渡す「仕様駆動開発」が広がり始めました。
        note: たとえばGitHubは2025年9月、仕様から計画、作業へと順に進めてAIに実装させる道具「Spec Kit」を公開した。
      - type: example
        title: グループ課題で起きること
        text: 「いい感じのスライドをつくろう」とだけ決めて分担すると、締め切りの前日に、色も主張もばらばらの資料が集まります。手を動かす前に「誰に、何を一つ伝えるか」を10分話していれば、作業はむしろ早く終わったはずです。AIに頼むときも、同じことが起きます。
      - type: p
        text: どれも、つくり始めてからでは手遅れになる問題です。だから今、つくる前に考え抜く力が求められています。

  - type: chapter
    id: logic
    eyebrow: センスがないと無理？
    title: よい設計は、センスだけでなく論理で語れる
    point: 押しやすさも、丈夫さも、好みではなく式で予測できます。理由を説明できるから、設計は学んで身につけられる技術です。
    blocks:
      - type: question
        text: スマートフォンで、画面のすみの小さな「×」が押しにくいと感じたことはありませんか？
        answer: それは指が不器用だからではありません。押しやすさは、指からボタンまでの距離と、ボタンの大きさで決まり、その関係は式で表せます。
      - type: p
        text: 心理学者ポール・フィッツは1954年、目標に手を伸ばして触れるまでの時間が、距離が遠いほど、目標が小さいほど長くなることを示し、その関係を式にしました。「フィッツの法則」と呼ばれ、今ではボタンの大きさや置き場所を決める根拠として使われています。
        note: P. M. Fitts, Journal of Experimental Psychology, 47(6), 1954。画面の操作への当てはめは I. S. MacKenzie, 1992 など。
      - type: figure
        name: fitts-law
      - type: p
        text: 図のAとBでは、難しさに約2倍の差があります。「Bのほうが押しやすそう」という感覚に、数字で理由を付けられるのです。ものの丈夫さも同じです。本棚の棚板のたわみは、板の厚さの3乗に反比例します。厚さを18mmから12mmにすると、たわみは約3.4倍になります。
        note: 両端を支えた板に、均等に重さがかかるとした場合。計算は[[modeling|モデルで考える]]のページで試せる。
      - type: p
        text: 「なんとなく使いやすい」「なぜか壊れる」の裏には、説明できる理由があります。問題の見つけ方、要件（設計が満たすべき条件）の書き方、案の広げ方と比べ方。設計には、こうした**考え方の道具**がそろっていて、使い方を学べば、誰でも設計の質を上げられます。
      - type: compare
        fromLabel: 思いつきで決めると
        toLabel: 考え抜いて決めると
        rows:
          - from: 機能を全部入れたアプリ
            to: よく使う三つがすぐ押せるアプリ
          - from: 座れるだけの車いす
            to: 押す人も楽な車いす
          - from: 情報を詰め込んだポスター
            to: 一目で伝わるポスター
      - type: link
        label: 設計の進め方を、五つの工程で読む
        href: /design/process/

  - type: chapter
    id: map
    eyebrow: 何を学ぶの？
    title: 設計は、一つの技術ではない
    point: 一枚の案内表示にも、人を観察する目、数を数える目、図にして試す目が要ります。設計に必要な知識は、一つの学部に収まりません。
    blocks:
      - type: example
        title: 病院の案内表示を設計するなら
        text: 迷っている人を観察し、話を聞くのは「[[human-interface|人から考える]]」視点。どの分かれ道で何人が迷っているかを数えるのは「[[data-analysis|データで考える]]」視点。館内を単純な図にして、案内の置き場所を試すのは「[[modeling|モデルで考える]]」視点。一枚の案内表示にも、これだけの見方が重なっています。
      - type: p
        text: こうした見方を、設計では「視点」と呼びます。設計は、問題を見つけ、要件を定め、案を広げ、比べて選び、形を詰める、という[[process|五つの工程]]で進み、どの工程でも、いくつかの視点を同時に使います。
      - type: map
        variant: compact

  - type: chapter
    id: together
    eyebrow: 一人じゃだめなの？
    title: だから、一人では設計できない
    point: これだけの知識と視点を、一人で備えることはできません。違う専門を持つ人が集まると、一人では届かない答えにたどり着けます。
    blocks:
      - type: question
        text: 病院の案内表示を、情報工学の学生だけで設計したら、何を見落としそうでしょう？
        answer: たとえば、文字の大きさや色の見え方（デザイン）や、患者さんや付き添いの人の動き方（保健福祉）。逆にデザインの学生だけなら、表示を切り替える仕組みやデータの扱いで困るかもしれません。
      - type: p
        text: 岡山県立大学には、保健福祉学部（看護・栄養・現代福祉・子ども）、情報工学部（情報通信工学・情報システム工学・人間情報工学）、デザイン学部（造形デザイン・ビジュアルデザイン・工芸工業デザイン・建築）があります。専門の違う人が見方を持ち寄れば、一人では気づけない見落としを、互いに見つけ合えます。
      - type: table
        caption: 病院の案内表示で、学部ごとに気づきやすいこと
        head:
          - 学部
          - 気づきやすいこと
        rows:
          - - デザイン学部
            - 文字の大きさ、色の見え方、遠くからの読みやすさ
          - - 保健福祉学部
            - 患者さんや付き添いの人の動き、急いでいる人や車いすの人の目の高さ
          - - 情報工学部
            - 表示を切り替える仕組み、混み具合などのデータの扱い
      - type: example
        title: 実際にあった例：飛行機の技術で走った新幹線
        text: 1964年に走り始めた東海道新幹線の0系は、空気の抵抗を減らす丸い先頭の形をしていました。この形づくりなどを担ったのは、戦前に航空機を設計していた三木忠直らです。戦後、国鉄の鉄道技術研究所に移り、飛行機で空気の流れを扱ってきた技術を鉄道に持ち込みました。分野をまたいで人が動くと、一つの分野だけでは出てこない答えが生まれます。
        source: 東洋経済オンラインの解説記事（三木忠直と0系新幹線）
      - type: p
        text: 研究の世界でも、一人より、チームでした仕事のほうが大きな影響を残すようになっています。
        note: S. Wuchty, B. F. Jones, B. Uzzi, "The Increasing Dominance of Teams in Production of Knowledge", Science, 316, 2007。約1,990万本の論文と210万件の特許を調べ、チームの研究は一人の研究より多く引用され、その差が年々広がっていることを示した。

      - type: p
        text: 学内にも、学部をまたいで考える授業があります。設計会は、そうした授業の外でも、違う専門の仲間と考えを持ち寄れる場所です。
      - type: courses
        items:
          - name: チームガバナビリティ演習
            dept: 保健福祉学部（看護・栄養・現代福祉）
            relation: 学科をまたいだグループで、多職種の連携を臨床の場面で学ぶ
            path: 01/01_10000101
          - name: プロダクトデザイン演習Ⅰ
            dept: 工芸工業デザイン学科
            relation: 子ども学科の協力で幼児を観察してアイデアにし、遊んでもらって確かめる
            path: 0336/0336_36003501
          - name: 介護施設デザイン演習
            dept: 現代福祉学科
            relation: 施設を見学して課題を見つけ、グループで解決策を提案する
            path: 0116/0116_16204401
          - name: 技術者と社会
            dept: 情報工学部
            relation: 企業の人の講義とグループワークで、自ら課題を見つける問題意識を養う
            path: 0222/0222_22144501

  - type: chapter
    id: place
    eyebrow: 設計会では何をするの？
    title: 設計会は、考えをぶつけ合う場所
    point: 好きなことを話し、違う考えとぶつかり、それを設計に落とし込む。そのための三つの場をつくっています。
    blocks:
      - type: cards
        items:
          - title: 発信の場
            body: 好きなこと、つくりたいものをプレゼンで話し、仲間から意見をもらう。設計のテーマの種は、ここから生まれます。
          - title: 対話の場
            body: 学部も価値観も違う人が意見をぶつけ合い、一人では出てこない考えにたどり着く。
          - title: 設計の場
            body: 一つのテーマを、問題を見つけるところから仕様書の完成まで、チームで設計しきる。
            note: 仕上げた仕様書は、そのままポートフォリオになる
      - type: p
        text: 「設計の場」では、テーマを五つの工程で最後までたどります。どんなテーマで、どんな成果物ができるのかを、架空の例で紹介しています。
      - type: link
        label: 架空の例：オープンキャンパスの体験コーナーを設計する
        href: /design/case-open-campus/
      - type: link
        label: 架空の例：飲み物を運ぶロボットを設計する
        href: /design/case-delivery-robot/

  - type: join
    eyebrow: 入部する
    title: 一緒に、考え抜こう。
    body: 学部・学年・経験は問いません。プログラムも絵も、できなくて大丈夫。必要な考え方は、活動の中で一つずつ身につきます。
    traitsTitle: 設計会で身につく力
    traits:
      - title: 根拠で決める力
        body: 好みではなく、理由で案を選べるようになる
      - title: 違う専門と組む力
        body: 学部の違う仲間と、一つの答えをつくれる
      - title: 形にして伝える力
        body: 考えを図と仕様書で、人に伝えられる
