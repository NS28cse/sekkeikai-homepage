title: 設計会
description: 岡山県立大学の設計サークル「設計会」。学んだ知識を「よく考えられた設計」に変えるために、企画と設計に集中して活動しています。
sections:
  - type: hero
    eyebrow: Okayama Prefectural University / Design Circle
    title: よく考えられた設計を。
    lead: 学んだ知識は、使ってはじめて価値になる。設計会は「企画」と「設計」に集中し、目的を現実にする力を身につけるサークルです。
    ctaLabel: 入部する
    ctaHref: "#join"
  - type: essay
    tone: light
    eyebrow: 01 / Essay
    title: 設計論 ― つくる前に、考え抜く
    lead: ものの価値の多くは、つくり始める前に決まっています。設計とは何をすることなのか、なぜそれほど大切なのか。設計学の先人たちの議論をたどりながら、設計会がこの営みに没頭する理由を書きました。
    chapters:
      - heading: 設計とは、まだ無いものについて考えること
        blocks:
          - type: illustration
            id: ES-01
            ratio: "21:9"
            caption: ひとつの設計を、何人もの視点で囲む。
            alt: 大きな机を数人が囲み、スケッチ、付箋、図面、ノートパソコンを広げて議論している様子を真上から見た絵
          - type: p
            text: |-
              机の上のマグカップ、教室の椅子、毎日開くアプリ。私たちの身のまわりにある人工物は、どれも誰かが、つくる前に考えたものです。どんな大きさにするか。何でつくるか。誰が、どんな場面で、どう使うのか。その考えが形になって、いま目の前にあります。
          - type: p
            text: |-
              経済学者であり、認知科学の開拓者でもあったハーバート・サイモンは、いまの状態を、より好ましい状態に変えようとして行為の道筋を考える人は、だれもが設計をしているのだと述べました。自然科学が「世界はどうなっているか」を問うのに対して、設計は「世界はどうあるべきか」を問います。サイモンはこの営みを「人工物の科学」と呼び、工学だけでなく、医療や経営、教育にも共通する知のかたちだと考えました。
            note: |-
              Herbert A. Simon, The Sciences of the Artificial, MIT Press, 1969（第3版 1996）。邦訳『システムの科学』。
          - type: p
            text: |-
              設計会は、この「つくる前に考える」段階にこそ、ものの価値を大きく左右する力があり、価値を生み出すいちばん大きな機会があると考えています。以下では、設計学の議論をたどりながら、その理由を順に書いていきます。
      - heading: 設計は、要求を形へ写すこと
        blocks:
          - type: p
            text: |-
              設計とは、正確には何をすることなのでしょうか。のちに東京大学総長を務めた吉川弘之は、1979年の論文「一般設計学序説」で、設計を数学の言葉で捉えようとしました。人が求める「はたらき」で書かれた世界（機能空間）と、ものが持つ「性質」で書かれた世界（属性空間）を考え、設計とは、前者で書かれた要求を満たす実体を、後者の中に見つけ出すこと、つまり一方から他方への写像だと定式化したのです。
            note: |-
              吉川弘之「一般設計学序説」『精密機械』45巻536号, pp.906–912, 1979年。英語圏では General Design Theory（GDT）として知られる。
          - type: p
            text: |-
              たとえば「お湯の量と温度を好きなように調節したい」という要求は、まだ「はたらき」の言葉です。それを、ハンドルが二つある蛇口にするのか、一本のレバーを上下左右に動かす混合水栓にするのかを決めて、はじめて「もの」の言葉になります。
          - type: p
            text: |-
              マサチューセッツ工科大学のナム・P・スーは、この写像を実践的な手順にまとめました。スーの公理的設計では、使い手の要求、機能要求、設計パラメータ、つくり方という四つの領域を行き来しながら設計を進めます。そして第一の公理として「機能要求は互いに独立に保て」を置きました。二つのハンドルの蛇口は、どちらを回しても量と温度が同時に変わってしまいます。シングルレバーなら、上下で量、左右で温度と、ひとつの操作がひとつの機能に対応します。設計の良し悪しを、好みではなく構造の問題として議論できるのです。
            note: |-
              Nam P. Suh, The Principles of Design, Oxford University Press, 1990。蛇口はスーが公理的設計の説明によく用いた例。
          - type: figure
            name: design-mapping
          - type: p
            text: |-
              この写像の出発点、つまり「何が求められているのか」を正しく捉える作業を、[[requirements|要求定義]]と呼びます。出発点がずれていれば、どれほど見事な写像も、間違った場所にたどり着きます。
      - heading: 価値の多くは、上流で決まる
        blocks:
          - type: p
            text: |-
              設計が大切だと言われる理由のひとつは、間違いを直すコストが、工程が進むほど急激に大きくなることです。NASAジョンソン宇宙センターの研究者たちは2004年、宇宙機のような大規模なシステムを想定して、要求の段階で紛れ込んだ誤りを後の工程で直すコストを見積もりました。要求の段階で直すコストを1とすると、設計の段階では3〜8倍、製造の段階では7〜16倍、統合と試験の段階では21〜78倍、運用に入ってからでは29倍から1500倍を超えることもある、という結果です。
            note: |-
              J. M. Stecklein ほか, "Error Cost Escalation Through the Project Life Cycle", NASA Johnson Space Center, 2004（NASA技術報告サーバ NTRS 20100036670）。
          - type: figure
            name: cost-escalation
          - type: p
            text: |-
              製造業では「製品のコストの70%は設計で決まる」ともよく言われます。ただし、この数字の出どころをたどった研究によれば、もとは自動車会社の社内で行われた非公式な調査だったとされ、数値そのものを鵜呑みにはできません。それでも、つくる前の判断がその後の選択肢を大きく縛るという方向性は、多くの研究と実務の経験が一致して示しています。
            note: |-
              K. T. Ulrich & S. A. Pearson, "Does Product Design Really Determine 80% of Manufacturing Cost?", MIT Sloan School Working Paper, 1993。J. A. Barton ほか, "Design determines 70% of cost? A review of implications for design evaluation", Journal of Engineering Design, 12(1), 2001。
          - type: p
            text: |-
              『人月の神話』で知られるフレデリック・ブルックスは、ソフトウェアをつくるうえでいちばん難しいのは、何をつくるかを正確に決めることだと書きました。つくる前の時間は、作業に入るまでの単なる準備ではありません。のちの何十倍もの手戻りを防ぎ、製品の価値を大きく左右する、もっとも密度の高い時間です。
            note: |-
              Frederick P. Brooks Jr., "No Silver Bullet: Essence and Accidents of Software Engineering", 1986（IEEE Computer 誌 1987年4月号に再掲）。
      - heading: 設計の問題は、解きながら見えてくる
        blocks:
          - type: p
            text: |-
              とはいえ、上流ですべてを決めきれるわけではありません。1973年、ホルスト・リッテルとメルヴィン・ウェバーは、社会の計画や設計が扱う問題の多くは「厄介な問題（wicked problem）」だと指摘しました。問題をどう定義するかに、すでに解き方が含まれてしまう。正解も、終わりもはっきりしない。数学の問題のように、条件が最初からすべて与えられているわけではないのです。
            note: |-
              H. W. J. Rittel & M. M. Webber, "Dilemmas in a General Theory of Planning", Policy Sciences, 4(2), 1973。
          - type: p
            text: |-
              マサチューセッツ工科大学で都市計画を教えたドナルド・ショーンは、建築家をはじめとする専門家の仕事を観察し、優れた設計者は案を描いては状況からの「応答」を受け取り、問題の捉え方そのものを組み替えていくことを見いだしました。ショーンはこれを「状況との対話」と呼び、行為の中で省察すること（reflection-in-action）こそが専門家の知だと論じました。
            note: |-
              Donald A. Schön, The Reflective Practitioner, Basic Books, 1983。邦訳『省察的実践とは何か』鳳書房, 2007。
          - type: p
            text: |-
              だからこそ設計には、考えを広げる時間と、絞り込む時間の両方が要ります。英国のデザイン・カウンシルが2005年に示した「ダブルダイヤモンド」は、問題を見つける段階と解を見つける段階のそれぞれで、発散と収束を繰り返す姿を図にしたものです。
            note: |-
              Design Council (UK), "The Double Diamond", 2005。2019年に Framework for Innovation として改訂された。
          - type: figure
            name: double-diamond
          - type: p
            text: |-
              発散のときに必要なのは、一人の頭の中だけでは出てこない視点です。経験や知識の違う人が案を持ち寄ることで、問題の捉え方そのものが変わることがあります。設計会が「複数人で考える場」を何より大切にしているのは、このためです。案を生み出し、整理するための技法は、[[ideation|発想]]のページで紹介しています。
      - heading: まだ無いものを、考えられる形にする
        blocks:
          - type: p
            text: |-
              設計の対象は、設計しているあいだ、まだこの世に存在しません。存在しないものについて検討し、議論し、確かめるために、設計者は代わりのものをつくります。紙の上のスケッチ、寸法の入った図面、手のひらに載る模型、数式、そしてコンピュータの中のシミュレーション。これらはすべて、対象のある側面だけを取り出して扱えるようにした[[modeling|モデル]]です。
          - type: p
            text: |-
              ライト兄弟は1901年、自作の小さな風洞で200種類ほどの翼の模型を試し、揚力の計算に広く使われていた係数の値に誤りがあることを突き止めました。本物の飛行機をつくって墜落させるより、模型で間違える方が、はるかに安く、安全で、速いからです。
            note: |-
              ライト兄弟は1901年秋に自作の風洞で翼型の試験を行い、揚力の計算に使われていた「スミートン係数」の値が大きすぎることを確かめたとされる。
          - type: p
            text: |-
              統計学者ジョージ・ボックスの「すべてのモデルは間違っている」という言葉はよく知られています。モデルは必ず何かを捨てています。何を残し、何を捨てるかを決めることこそが、モデル化という設計行為の核心です。そして、モデルどうしの食い違いは、ときに致命的になります。1999年、NASAの火星探査機マーズ・クライメイト・オービターは、地上のあるソフトウェアがヤード・ポンド法の単位で出力した値を、別のソフトウェアがメートル法の値として扱ったために軌道を誤り、失われました。
            note: |-
              G. E. P. Box, "Science and Statistics", Journal of the American Statistical Association, 71, 1976。マーズ・クライメイト・オービターについては、NASAの事故調査委員会の報告書（1999年）による。
      - heading: 人が使うなら、人も設計の一部である
        blocks:
          - type: p
            text: |-
              第二次世界大戦中、アメリカ軍の爆撃機B-17などでは、着陸したあとにフラップを上げるつもりで車輪を格納してしまう事故が繰り返されていました。原因は「操縦士の不注意」とされていましたが、心理学者のアルフォンス・チャパニスらが調べると、フラップと着陸装置の操作レバーがよく似た形で、すぐ隣に並んでいたことがわかりました。チャパニスがそれぞれのつまみに車輪とくさびの形を付けると、手で触れただけで区別できるようになり、取り違えは大きく減ったといいます。
            note: |-
              P. M. Fitts & R. E. Jones による操縦ミスの分析（1947年）と、A. Chapanis の回想による。逸話の細部は資料によって異なる。
          - type: illustration
            id: E4-02
            ratio: "16:9"
            caption: よく似た形のレバー（左）と、触っただけで区別できるつまみ（右）。
            alt: 左側によく似た形の二本のレバーが並ぶ操縦席の一部、右側に先端が車輪の形とくさびの形になった二本のレバーを描いた比較の絵
          - type: p
            text: |-
              誤りの原因が人ではなく設計にあると見抜いたこの出来事は、人間工学（ヒューマンファクター）の出発点のひとつとして語り継がれています。ドナルド・ノーマンは著書『誰のためのデザイン？』で、人が使い方を誤るとき、問われるべきは多くの場合、その人ではなく設計だと説きました。
            note: |-
              Donald A. Norman, The Design of Everyday Things, Revised and Expanded Edition, Basic Books, 2013（初版は1988年）。邦訳『誰のためのデザイン？ 増補・改訂版』新曜社, 2015。
          - type: p
            text: |-
              製品が人間を相手にする限り、人がどう見て、どう考え、どう手を動かすかは、設計の外にある条件ではなく、設計そのものの一部です。国際規格 ISO 9241-210 は、利用者を理解し、要求を明らかにし、解決案をつくり、評価するという人間中心設計の流れを定めています。人と人工物の境界をどう設計するか。それが[[human-interface|ヒューマンインターフェース]]の問いです。
            note: |-
              ISO 9241-210:2019, Ergonomics of human-system interaction — Part 210: Human-centred design for interactive systems。
      - heading: 過去のデータで、未来をよりよく設計する
        blocks:
          - type: p
            text: |-
              よい設計は、思いつきではなく根拠から生まれます。フローレンス・ナイチンゲールは、クリミア戦争の軍病院での経験をもとに、帰国後、統計学者ウィリアム・ファーらの協力を得て、兵士の死因の多くが戦闘の傷ではなく、不衛生な環境による感染症であることを統計で示しました。扇形を組み合わせた独自のグラフで示された事実は、病院の設計と衛生の制度を見直すきっかけになりました。
            note: |-
              ナイチンゲールの「鶏頭図」（polar area diagram）は、1858年にまとめられた英国陸軍の衛生に関する報告書などに掲載された。
          - type: p
            text: |-
              統計学者ロナルド・フィッシャーが1935年に著した本の題名は、『実験計画法（The Design of Experiments）』でした。何をどう比べれば確かな結論が得られるか、それ自体が設計の対象なのです。この考え方は、日本で田口玄一が発展させた品質工学にも受け継がれ、少ない実験で、ばらつきに強い製品を設計する方法として世界の製造業に広まりました。
            note: |-
              R. A. Fisher, The Design of Experiments, Oliver and Boyd, 1935。品質工学（タグチメソッド）は、田口玄一が1950年代から体系化した。
          - type: p
            text: |-
              いまでは、使われている製品から得られるデータが、次の設計の材料になります。どの機能がどれだけ使われ、どこで人がつまずくのか。数字を集め、目に見える形にし、仮説を確かめて、設計に返す。この循環を回す力が[[data-analysis|データ分析]]です。設計会では、ブラウザ上で複数人が同時に編集できるデータ分析の環境 Deepnote を使い、同じ数字を前にして議論しています。
      - heading: 選ぶことは、捨てることでもある
        blocks:
          - type: p
            text: |-
              古代ローマの建築家ウィトルウィウスは、建築は「強・用・美」、つまり丈夫さと使いやすさと美しさを備えるべきだと書きました。二千年たったいまも、設計の悩みは変わりません。軽くすれば弱くなり、丈夫にすれば高くなる。複数の目的は、たいていどこかでぶつかります。
            note: |-
              ウィトルウィウス『建築について（建築十書）』紀元前1世紀。firmitas（強）・utilitas（用）・venustas（美）。
          - type: p
            text: |-
              ほかの目的を犠牲にせずには、どの目的ももう改善できない案。それを経済学者パレートの名にちなんで「パレート最適」と呼びます。パレート最適な案はたいてい一つではありません。設計者の仕事は、その中から目的に照らして一つを選び、選ばなかった理由まで説明できるようにすることです。トーマス・サーティが考案した階層分析法（AHP）や、スチュアート・ピューの概念選定法のように、選択の根拠を見える形にする技法が数多く考えられてきました。
            note: |-
              T. L. Saaty, The Analytic Hierarchy Process, McGraw-Hill, 1980。S. Pugh, Total Design, Addison-Wesley, 1991。
          - type: figure
            name: pareto-front
          - type: p
            text: |-
              設計会の活動の最後には、完成した設計解を、外部の方を含む「投資家」に向けて発表する大プレゼンがあります。なぜこの案なのかを、データと論理で語れること。それは設計の最後の、そしてもっとも責任の重い工程です。詳しくは[[decision|評価と意思決定]]のページへ。
      - heading: 設計は、総合である
        blocks:
          - type: p
            text: |-
              分析（analysis）がものごとを要素に分けて理解する営みだとすれば、設計は、要素を組み合わせて新しい全体をつくる総合（synthesis）の営みです。ここまで見てきたように、ひとつの製品の設計には、[[requirements|要求を見極める力]]、[[ideation|案を広げる力]]、[[modeling|対象をモデルにする力]]、[[human-interface|人を理解する力]]、[[data-analysis|データから学ぶ力]]、そして[[decision|選び取る力]]が、同時に求められます。これらは順番に片づけていくものではなく、互いに影響しあいながら、何度も行き来するものです。
          - type: p
            text: |-
              これだけの知識と視点を、一人で備えることはできません。だから設計は、本来、人が集まってするものです。専門の違う人が、それぞれの見方を持ち寄り、言葉と図を使って、ひとつの案を磨いていく。
          - type: illustration
            id: ES-02
            ratio: "21:9"
            caption: 一枚の設計図の上で、違う手が重なる。
            alt: 一枚の大きな設計図の上に、定規を持つ手、鉛筆を持つ手、付箋を貼る手、タブレットを指す手が集まっている絵
          - type: p
            text: |-
              設計会は、そのための場をつくるサークルです。学んだ知識を、使える知恵に変える。つくる前の時間に、とことん没頭する。まだ無いものについて、仲間と一緒に考え抜く。**設計は、価値を生み出すいちばん大きな機会だ**と、私たちは考えています。
  - type: elements
    tone: light
    eyebrow: 02 / Elements
    title: 設計を形づくる6つの要素
    body: 設計論の中で触れた6つの要素には、それぞれ詳しい解説のページがあります。設計とどう関係するのか、実際にどう使うのか、どんな歴史をたどってきたのか、そして設計会の活動でどう生かしているのかを書いています。
  - type: statement
    tone: light
    eyebrow: 03 / Why
    title: 学習のその先へ
    body: 授業とテストで知識は身につく。でも、知識だけで誰かを幸せにしたり、価値を生み出したりはできない。必要なのは応用――それも、思いつきではなく「よく考えられた設計」に基づく応用です。どんな製品も、技術と思想を詰め込む「設計」で決まります。
    left:
      label: 単純な思いつき
      items:
        - とりあえず動くゲーム
        - へんてこな時計
        - 見た目だけの建築
    right:
      label: よく考えられた設計
      items:
        - 快適で面白いゲーム
        - 実用的な時計
        - 機能的な建築
  - type: flow
    tone: dark
    eyebrow: 04 / Scope
    title: 扱うのは、実装の手前まで
    body: 実装には大きな資本や人手が要ります。でも設計なら、学生でも実務と同じ水準で取り組める。設計会は企画と設計にだけ集中し、仕様書と設計解を成果物にします。
    steps:
      - 企画
      - 設計
      - 実装
      - テスト
      - 保守・運用
    focusCount: 2
    focusLabel: 設計会の範囲
  - type: steps
    tone: light
    eyebrow: 05 / Activities
    title: 活動の流れ
    items:
      - label: 第0段階
        title: なんでもプレゼン
        body: 好きなこと、学んだことを気軽に発表する勉強会。目的はここから生まれます。
        role: none
      - label: 第1段階
        title: 企画
        body: 実現したいことを持つ人が「発案者」となり、プロジェクトを立ち上げます。対象は問いません。
        role: proposer
      - label: 第2段階
        title: 小プレゼン
        body: 簡易な仕様書をもとに発表し、一緒に考える「設計仲間」を集めます。
        role: partner
      - label: 第3段階
        title: 設計
        body: 発案者と設計仲間のチームで、設計手法を使いながら設計解をつくります。
        role: partner
      - label: 第4段階
        title: 大プレゼン
        body: 完成した設計解を、外部の方を含む「投資家」に発表して評価してもらいます。
        role: investor
  - type: tags
    tone: light
    eyebrow: 06 / Targets
    title: 設計の対象は「もの」だけではない
    body: 価値あるものは、すべて設計の対象です。
    tags:
      - ロボット
      - 建築
      - Webアプリ
      - イベント企画
      - 町おこし
      - 小説
      - 音楽
      - 絵画
      - 競技
      - 自由研究
      - マニュアル
  - type: cards
    tone: light
    eyebrow: 07 / Methods
    title: テーマの3分類
    items:
      - title: イノベーション
        body: まだ誰も気づいていない価値を見つける段階。
        note: ブレインストーミング / KJ法 / ペルソナ / デザイン思考 / CJM
      - title: 問題解決
        body: 目的と要件を整理し、最適な解を論理的に選ぶ段階。
        note: QFD / AHP / ISM法 / IDEF0
      - title: 設計下流
        body: 形や数値を詰め、性能を最大化する段階。
        note: CAE / タグチメソッド
  - type: projects
    tone: light
    title: プロジェクト
    body: 部員の発案や、先輩が用意した課題、自治体からの依頼がテーマになります。
  - type: cards
    tone: dark
    eyebrow: 08 / Places
    title: 設計会がつくる3つの場
    items:
      - title: 発信の場
        body: 好きなこと、やりたいことをプレゼンで自由に発信でき、それを受け入れる人が集まる場。
      - title: 対話の場
        body: 多様な価値観や知見をもつ人が意見をぶつけ合い、考えを深められる場。
      - title: 設計の場
        body: 設計の知見を持ち寄り、実際に応用できる場。
  - type: info
    tone: light
