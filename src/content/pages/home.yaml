title: 設計会
description: 岡山県立大学の設計サークル「設計会」。AIやツールで「つくる」が簡単になった今、何をつくるかを決める「設計」の力を、学部の違う仲間と磨きます。経験は要りません。
# トップページは「なぜ今、設計が大事なのか」を長文で伝える。書き方の決まりは docs/writing-guide.md。
#   - 章の見出し（title）は主張の形で。見出しだけ追っても話がつながるようにする
#   - eyebrow は読者が心の中で持っている問い。point はその章の要点（まとめにも自動で出る）
#   - 身近な例（example）と問いかけ（question）で始め、抽象的な話はその後に。例は学生生活の場面から選ぶ
#   - 数字の出どころなど、読み飛ばしてよいことは補足（aside）に入れる
sections:
  - type: hero
    eyebrow: 岡山県立大学 設計サークル
    title: つくる前に、考え抜く。
    lead: AIに頼めば、アプリも画像も数分でできる時代。差がつくのは、何を・誰のためにつくるかを決める「設計」の力です。設計会は、学部の違う仲間とその力を磨くサークルです。経験は要りません。
    ctaLabel: 3分で読む
    ctaHref: "#summary"
    cta2Label: 入部について
    cta2Href: "#join"

  - type: summary
    title: 3分で読むなら、ここだけ
    lead: 各章の見出しと要点です。気になった章から読んでください。

  - type: chapter
    id: why-now
    eyebrow: なぜ今、設計なの？
    title: 「つくる」より「決める」が難しい時代
    point: AIに頼めば、動くものは数分で出てきます。差がつくのは、何を・誰のために・なぜつくるかを決める力。それが、これからあなたが担う仕事です。
    blocks:
      - type: question
        text: 「便利な時間割アプリをつくって」とAIに頼んだら、どんなアプリが返ってくるでしょう？
        answer: それらしいアプリは、すぐに返ってきます。けれど「便利」が誰にとって、どんな場面での便利なのかを決めていなければ、出てくるのは「誰のためでもないアプリ」です。
        open: true
      - type: p
        text: 少し前まで、アプリを一つつくるには、プログラムを何千行も書く必要がありました。いまはAIに頼めば、数分で動くものが出てきます。3Dプリンタがあれば、部品も一晩で手に入ります。
      - type: p
        text: つくる手間が小さくなるほど、差がつくのは「何を、なぜ、どうつくるか」を決める部分です。指示があいまいなら、AIはあいまいなものを、とても正確につくります。
      - type: example
        title: グループ課題で起きること
        text: 「いい感じのスライドを作ろう」とだけ決めて分担すると、締め切りの前日に、色も主張もばらばらの資料が集まります。手を動かす前に「誰に、何を一つ伝えるか」を10分話していれば、作業はむしろ早く終わったはずです。AIに頼むときも、同じことが起きます。
      - type: heading
        text: 理由は、AIだけではない
      - type: list
        items:
          - "**ものが複雑につながった。** スマートフォンも車も家電も、ソフトウェアとネットワークでつながっています。一部だけを見て決めると、全体のどこかで困る人が出ます。"
          - "**使う人が多様になった。** 高齢の人、目や耳が不自由な人、日本語が母語でない人。2024年からは、日本のすべての事業者に、障害のある人への「合理的配慮」が義務づけられました。"
          - "**環境への責任が、つくる前に問われるようになった。** 製品が環境に与える影響の大部分は、設計の段階で決まると言われます。EUでは2024年、設計の段階から環境への配慮を求める新しい規則が動き出しました。"
      - type: p
        text: どれも、つくり始めてからでは手遅れになる問題です。だから今、つくる前に考え抜く力が求められています。
      - type: aside
        title: 仕事の現場で起きていることと、新しい規則
        body:
          - ソフトウェア開発の現場では、AIにいきなりプログラムを書かせるのではなく、まず「何をつくるか」を仕様書にまとめてからAIに渡す進め方が広がり始めています。「仕様駆動開発」と呼ばれ、2025年ごろから、そのための道具が次々に公開されています。人の仕事の中心が「書くこと」から「決めること」へ移りつつあるのです。
          - 「製品の環境への影響のおよそ8割は設計の段階で決まる」という見積もりは、欧州でよく引用されます。EUの「持続可能な製品のためのエコデザイン規則（ESPR）」は、2024年7月に発効しました。
          - 日本の改正障害者差別解消法は2024年4月に施行され、事業者による合理的配慮の提供が義務になりました。

  - type: chapter
    id: upstream
    eyebrow: いつ決まるの？
    title: 直すなら、つくる前がいちばん安い
    point: 完成してから直すと、つくる前に直すより何十倍も手間がかかります。つくる前に考える時間は、少ない手間で結果を大きく変えられる時間です。
    blocks:
      - type: question
        text: 家を建てたあとで「窓をもう一つ増やしたい」と言ったら、どうなるでしょう？
        answer: 壁を壊し、柱を確かめ、工事をやり直すことになります。図面の段階なら、線を一本書き足すだけで済みました。
      - type: p
        text: ものづくりは、どの分野でもこれと同じです。決めたことの上に次の作業が積み重なっていくので、土台の間違いほど、直すときに崩すものが多くなります。
      - type: p
        text: 大きな宇宙開発の記録をもとにした見積もりでは、最初の段階で紛れ込んだ誤りを、完成して使い始めてから直そうとすると、その場で直す場合の数十倍、ときには千倍以上の手間がかかります。
      - type: figure
        name: cost-escalation
      - type: p
        text: 逆に言えば、つくる前の時間は、少ない手間で出来を大きく変えられる時間です。設計会が「つくる前」にこだわるのは、そこにいちばん大きなチャンスがあるからです。
      - type: aside
        title: 数字の出どころ
        body:
          - 図の数字は、NASAジョンソン宇宙センターが2004年にまとめた見積もりです（宇宙機のような大規模なシステムを想定したもの）。
          - 製造業でよく言われる「コストの7割は設計で決まる」という数字は、もとは社内の非公式な調査だったと指摘されていて、正確な値ではありません。ただ、つくる前の判断がその後を大きく縛るという方向は、多くの研究が一致して示しています。

  - type: chapter
    id: logic
    eyebrow: センスがないと無理？
    title: よい設計は、センスだけでなく論理で語れる
    point: 設計の良し悪しは、好みだけでなく構造で説明できます。だから設計は、才能だけに頼らず、学んで身につけられる技術です。
    blocks:
      - type: question
        text: 洗面所の蛇口を思い出してください。ハンドルが二つの蛇口と、レバーが一本の蛇口。どちらが使いやすいでしょう？ 理由を説明できますか？
        answer: レバー一本の方が、迷いにくいはずです。理由は「操作と機能が一対一に対応しているから」です。上下で量、左右で温度。二つのハンドルは、どちらを回しても量と温度が同時に変わってしまいます。
      - type: p
        text: 「なんとなく使いやすい」の裏には、ちゃんとした理由があります。下の表は、蛇口の「操作」と「機能」の関係を書き出したものです。印が斜めに並ぶほど、迷わず使えます。
      - type: figure
        name: faucet
      - type: p
        text: 問題の見つけ方、要件の書き方、案の広げ方と比べ方。設計には、こうした**考え方の道具**がそろっています。道具の使い方を学べば、誰でも設計の質を上げられます。同じ材料、同じ技術でも、何をどう決めたかで、できあがるものはまったく変わります。
      - type: compare
        fromLabel: 思いつきで決めると
        toLabel: 考え抜いて決めると
        rows:
          - from: 機能を全部入れたアプリ
            to: よく使う3つがすぐ押せるアプリ
          - from: 座れるだけの車いす
            to: 押す人も楽な車いす
          - from: 情報を詰め込んだポスター
            to: 一目で伝わるポスター
      - type: link
        label: 設計の進め方を詳しく読む
        href: /design/process/

  - type: chapter
    id: map
    eyebrow: 何を学ぶの？
    title: 設計は、ひとつの技術ではない
    point: 一枚の案内表示にも、人を観察する目、数を数える目、図にして試す目が要ります。設計に必要な知識は、一つの学部に収まりません。
    blocks:
      - type: example
        title: 病院の案内表示を設計するなら
        text: 迷っている人を観察し、話を聞くのは「[[human-interface|人から考える]]」視点。どの分かれ道で何人が迷っているかを数えるのは「[[data-analysis|データで考える]]」視点。館内を単純な図にして、案内の置き場所を試すのは「[[modeling|モデルで考える]]」視点。一枚の案内表示にも、これだけの見方が重なっています。
      - type: p
        text: こうした見方を、設計では「視点」と呼びます。設計は、問題を見つけ、要件を定め、案を広げ、比べて選び、形を詰める、という[[process|5つの工程]]で進み、どの工程でも、いくつかの視点を同時に使います。
      - type: map
        variant: compact
      - type: link
        label: 工程と視点を、図と一緒に詳しく読む
        href: /design/

  - type: chapter
    id: together
    eyebrow: 一人じゃだめなの？
    title: だから、一人では設計できない
    point: これだけの知識と視点を、一人で備えることはできません。違う専門を持つ人が集まると、一人では届かない答えにたどり着けます。
    blocks:
      - type: question
        text: 病院の案内表示を、情報工学の学生だけで設計したら、何を見落としそうでしょう？
        answer: たとえば、文字の大きさや色の見え方（デザイン）や、患者さんや付き添いの人の動き方（保健福祉）。逆にデザインの学生だけなら、表示を切り替えるしくみやデータの扱いで困るかもしれません。
      - type: p
        text: 岡山県立大学には、情報工学、デザイン、保健福祉の学部があります。専門の違う人が見方を持ち寄れば、一人では気づけない見落としを、互いに見つけ合えます。
      - type: p
        text: そして、設計の対象は「もの」だけではありません。サービスも、イベントも、説明書も、誰かのために形を決めるものは、どれも設計の対象です。あなたの専門や趣味が、そのまま設計のテーマになります。
      - type: tags
        label: 設計できるものの例
        items:
          - Webアプリ
          - ゲーム
          - ロボット
          - 建築
          - 介護用品
          - 病院の案内表示
          - ポスター
          - 地域イベント
          - 町おこし
          - マニュアル
      - type: illustration
        id: HM-02
        ratio: "21:9"
        caption: 一枚の設計図の上で、違う手が重なる。
        alt: 一枚の大きな設計図の上に、定規を持つ手、鉛筆を持つ手、付箋を貼る手、タブレットを指す手が集まっている絵

  - type: chapter
    id: place
    eyebrow: 設計会では何をするの？
    title: 設計会は、考えをぶつけ合う場所
    point: 好きなことを話し、違う考えとぶつかり、それを設計に落とし込む。そのための三つの場をつくっています。
    blocks:
      - type: cards
        items:
          - title: 発信の場
            body: 好きなこと、作りたいものをプレゼンで話し、仲間から意見をもらう。設計のテーマの種は、ここから生まれます。
          - title: 対話の場
            body: 学部も価値観も違う人が意見をぶつけ合い、一人では出てこない考えにたどり着く。
          - title: 設計の場
            body: 一つのテーマを、問題を見つけるところから仕様書の完成まで、チームで設計しきる。
            note: 仕上げた仕様書は、そのままポートフォリオになる
      - type: p
        text: データは Deepnote で共有し、同じグラフを見ながら決めます。AIが隣で手を動かしてくれる時代に、人に残る仕事は「何を、誰のために、なぜつくるか」を決めることです。この力は、授業の課題でも、卒業研究でも、就職した先でも、そのまま使えます。設計会は、その練習を、違う学部の仲間と一緒にできる場所です。
      - type: illustration
        id: HM-01
        ratio: "21:9"
        caption: ひとつの設計を、何人もの視点で囲む。
        alt: 大きな机を数人が囲み、仕様書、図面、付箋、グラフの映ったノートパソコンを広げて議論している様子を真上から見た絵

  - type: join
    eyebrow: 入部する
    title: 一緒に、考え抜こう。
    body: 学部・学年・経験は問いません。プログラムも絵も、できなくて大丈夫。必要な考え方は、活動の中で一つずつ身につきます。
    traitsTitle: 設計会で身につく力
    traits:
      - title: 根拠で決める力
        body: 好みではなく、理由で案を選べるようになる
      - title: 違う専門と組む力
        body: 学部の違う仲間と、一つの答えをつくれる
      - title: 形にして伝える力
        body: 考えを図と仕様書で、人に伝えられる
    formUrl: ""
    buttonLabel: 入部フォームへ

  - type: news
    title: お知らせ
    limit: 3

  - type: info
    title: 団体概要
    items:
      - label: 団体名
        value: 設計会
      - label: 所属
        value: 岡山県立大学
