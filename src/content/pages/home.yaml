title: 設計会
description: 岡山県立大学の設計サークル「設計会」。ものづくりのいちばん上流にある「設計」に没頭し、学部の違う仲間と考え抜いて、学んだ知識を価値に変えます。
# トップページは、見出し（title）だけを上から読んでも話がつながるように書く。
#   つくる前に、考え抜く。→ 知識は、使ってはじめて価値になる → 価値の大部分は、つくる前に決まる
#   → よい設計は、論理で語れる → 設計は、ひとつの技術ではない → だから、一人では設計できない
#   → 設計会は、考え抜くための場所 → 一緒に、考え抜こう。
sections:
  - type: hero
    eyebrow: Okayama Prefectural University / Design Circle
    title: つくる前に、考え抜く。
    lead: 設計会は、ものづくりのいちばん上流にある「設計」に没頭するサークルです。学部も学年も違う仲間と考え抜き、学んだ知識を、誰かの役に立つ価値へ変えていきます。
    ctaLabel: 設計会を知る
    ctaHref: "#why"

  - type: statement
    tone: light
    eyebrow: Why
    title: 知識は、使ってはじめて価値になる
    lead: 授業とテストで、知識は身につく。けれど、知識だけで誰かを幸せにすることはできない。
    body:
      - 価値を生むのは、知識の**応用**です。それも、思いつきの応用ではありません。目的を見定め、案を比べ、根拠をもって選び抜いた「よく考えられた設計」にもとづく応用です。
      - 同じ材料、同じ技術を使っても、設計が違えば、できあがるものの価値はまったく変わります。
    compare:
      fromLabel: 単純な思いつき
      toLabel: よく考えられた設計
      rows:
        - from: とりあえず動くゲーム
          to: 快適で面白いゲーム
        - from: へんてこな時計
          to: 実用的な時計
        - from: 見た目だけの建築
          to: 機能的な建築

  - type: figure
    tone: dark
    eyebrow: Insight
    title: 価値の大部分は、つくる前に決まる
    lead: 間違いは、見つけるのが遅いほど高くつく。
    body:
      - 設計の段階なら紙の上で直せる誤りも、完成してから気づけば作り直しです。大規模な開発の調査では、要求の誤りを直すコストは、工程が進むほど何十倍、ときには千倍以上にふくらみます。
      - 裏を返せば、つくる前の時間こそが、ものの価値をいちばん大きく動かせる時間だということ。設計会が「設計」に集中する理由は、ここにあります。
    figure: cost-escalation

  - type: figure
    tone: light
    eyebrow: Logic
    title: よい設計は、論理で語れる
    lead: 設計は、センスだけの世界ではない。
    body:
      - たとえば「お湯の量と温度を好きに調節したい」という同じ要求に、二つの蛇口があります。二つのハンドルの蛇口は、どちらを回しても量と温度が同時に変わってしまう。一本のレバーなら、上下で量、左右で温度と、操作と機能が一対一に対応しています。
      - どちらが優れているかを、好みではなく構造で説明できる。設計にはこうした考え方の道具がたくさんあり、それは学んで身につけられる技術です。
    figure: faucet
    illustration:
      id: HM-03
      ratio: "21:9"
      caption: 同じ要求に、二つの答え。
      alt: 左に湯と水の二つのハンドルが付いた蛇口、右に一本のレバーを上下左右に動かす蛇口を並べ、それぞれのハンドルの動きを矢印で示した線画
    link:
      label: 設計のプロセスを読む
      href: /design/process/

  - type: map
    tone: light
    eyebrow: Map
    title: 設計は、ひとつの技術ではない
    lead: 工程を進めながら、どの工程でも、いくつもの視点で考える。
    body:
      - 設計は、問題を見つけ、要件を定め、案を広げ、比べて選び、形を詰める、という[[process|工程]]で進みます。そしてどの工程でも、対象を[[modeling|モデルにして考える力]]、[[human-interface|使う人の立場から考える力]]、[[data-analysis|データで確かめる力]]が同時に求められます。
      - 下の地図は、その組み合わせの一例です。見出しから、それぞれの解説へ進めます。
    steps:
      - title: 問題を見つける
        sub: 問題発見
      - title: 要件を定める
        sub: 要件定義
      - title: 案を広げる
        sub: 構想設計
      - title: 比べて選ぶ
        sub: 評価・選定
      - title: 形を詰める
        sub: 詳細設計
    lenses:
      - design: modeling
        cells:
          - いまの仕組みの流れを図にする
          - 機能のつながりを図にする
          - スケッチと簡単な模型
          - 計算やシミュレーションで比べる
          - CADと構造の計算（CAE）
      - design: human-interface
        cells:
          - 使う人を観察し、話を聞く
          - ペルソナと利用状況を定める
          - 紙の試作で操作を試す
          - 利用者に試してもらう
          - 画面と操作の流れを詰める
      - design: data-analysis
        cells:
          - いまあるデータを眺める
          - アンケートで要求の重みを測る
          - 似た事例の数字を調べる
          - 評価の重みを計算する（AHP）
          - 実験計画で条件を絞る

  - type: tags
    tone: light
    eyebrow: Together
    title: だから、一人では設計できない
    lead: 違う専門は、そのまま設計の武器になる。
    body:
      - これだけの知識と視点を、一人で備えることはできません。情報、デザイン、保健福祉。専門の違う人がそれぞれの見方を持ち寄ることで、一人では届かない案にたどり着けます。
      - そして、設計の対象は「もの」だけではありません。価値あるものは、すべて設計できます。あなたの専門や趣味が、そのまま設計のテーマになります。
    tags:
      - ロボット
      - 建築
      - Webアプリ
      - イベント企画
      - 町おこし
      - 小説
      - 音楽
      - 絵画
      - 競技
      - 自由研究
      - マニュアル
    illustration:
      id: HM-02
      ratio: "21:9"
      caption: 一枚の設計図の上で、違う手が重なる。
      alt: 一枚の大きな設計図の上に、定規を持つ手、鉛筆を持つ手、付箋を貼る手、タブレットを指す手が集まっている絵

  - type: cards
    tone: light
    eyebrow: Place
    title: 設計会は、考え抜くための場所
    lead: 発信し、対話し、設計する。そのための三つの場をつくっています。
    body:
      - 好きなことを話し、違う考えとぶつかり、それを設計に落とし込む。設計会は、設計に没頭し、アイデアを持ち寄るための場所です。データの分析には、ブラウザで何人でも同時に編集できる Deepnote を使い、同じ数字を見ながら議論しています。
    items:
      - title: 発信の場
        body: 好きなこと、やりたいことをプレゼンで自由に発信でき、それを受け止める人が集まる場。
      - title: 対話の場
        body: 多様な価値観や知見をもつ人が意見をぶつけ合い、考えを深められる場。
      - title: 設計の場
        body: 設計の知見を持ち寄り、実際に応用できる場。
    illustration:
      id: HM-01
      ratio: "21:9"
      caption: ひとつの設計を、何人もの視点で囲む。
      alt: 大きな机を数人が囲み、スケッチ、付箋、図面、ノートパソコンを広げて議論している様子を真上から見た絵

  - type: join
    eyebrow: Join us
    title: 一緒に、考え抜こう。
    body: 学部・学年は問いません。設計の経験も要りません。次の三つを持っている人、そしてこれから身につけたい人を歓迎します。
    traits:
      - title: 主体性
        body: 自分の視点で、意見を持てる
      - title: 柔軟性
        body: 違う考えを、まず受け止められる
      - title: 行動力
        body: 必要なことを、迷わず実行できる
    closing: 考え抜いた仕様書や設計解は、そのままあなたのポートフォリオになります。
    formUrl: ""
    buttonLabel: 入部フォームへ

  - type: news
    title: お知らせ
    limit: 3

  - type: info
    title: 団体概要
    items:
      - label: 団体名
        value: 設計会
      - label: 所属
        value: 岡山県立大学
      - label: 代表
        value: 長岡 祥太郎
