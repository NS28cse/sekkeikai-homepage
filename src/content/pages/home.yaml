  - type: join
    title: 一緒に設計しませんか
    body: 学部・学年は問いません。自分の視点で意見を持つ主体性、多様な考えを認める柔軟性、必要な行動を迷わず実行する行動力――を持っている人、これから身につけたい人を歓迎します。成果物の仕様書や設計解は、そのままポートフォリオになります。
