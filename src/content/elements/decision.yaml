title: 評価と意思決定
en: Decision Making
order: 6
question: 選んだ理由を、説明できるか
summary: 複数の目的がぶつかる中で案を比べ、選び、その根拠を示す。トレードオフ、パレート最適、AHP、ピューの概念選定法。
lead: 設計の最後には、必ず「選ぶ」瞬間があります。軽さと強さ、価格と性能、美しさとつくりやすさ。複数の目的がぶつかりあう中で案を比べ、一つを選び、その理由をほかの人に説明できるようにすること。それが評価と意思決定の技術です。
hero:
  id: E6-01
  caption: 案を、物差しで量る。
  alt: 大きな天秤の両側に、形の違う椅子の模型が載り、天秤の柱に「価格」「重さ」「美しさ」と書かれた目盛り板が掛かっている絵
chapters:
  - kind: concept
    heading: トレードオフとパレート最適
    blocks:
      - type: p
        text: |-
          設計の目的は、たいてい一つではありません。そして複数の目的は、しばしば互いにぶつかります。自転車を軽くしようとすれば高価な素材が要り、安くしようとすれば重くなる。一方を良くすると他方が悪くなるこの関係を、**トレードオフ**と呼びます。
      - type: p
        text: |-
          ある案に対して、すべての目的で同じかそれ以上に良く、少なくとも一つの目的ではっきり上回る案がほかに存在しないとき、その案を「**パレート最適**」と呼びます。経済学者ヴィルフレド・パレートにちなんだ名前です。下の図では、価格と重さをどちらも小さくしたいときに、ほかの案に完全に負けている案（灰色）と、どれも一長一短のパレート最適な案（青）を区別しています。
      - type: figure
        name: pareto-front
      - type: p
        text: |-
          パレート最適な案のどれを選ぶかは、計算だけでは決まりません。価格と重さのどちらを、どれだけ重視するかという、価値の判断が必要だからです。評価と意思決定の技法は、この価値の判断を、隠れた好みのままにせず、議論できる形にするためのものです。
  - kind: relation
    heading: 選択は、その後の選択肢を狭める
    blocks:
      - type: p
        text: |-
          設計の過程では、大小さまざまな選択が繰り返されます。どの問題を解くか、どの方式を採るか、どの素材を使うか。どの選択も、その後の選択肢を狭めます。トップページの設計論で見たように、上流での選択ほど後から変えるのが難しく、影響が大きくなります。
      - type: p
        text: |-
          選択の根拠が記録されていなければ、条件が変わったときに見直すことができず、同じ議論が何度も繰り返されます。逆に、何を基準に、どう比べて選んだのかが残っていれば、チームの誰もが判断を検証し、改善できます。意思決定の質は、結果の良し悪しだけでなく、その過程を説明できるかどうかでも決まるのです。
      - type: p
        text: |-
          人の判断には、最初に見た数字に引きずられる（アンカリング）、思い出しやすい例をよくあることだと思い込む、といった偏りがあることが、心理学の研究で知られています。評価の技法は、こうした偏りから判断を守る役割も果たします。
        note: |-
          A. Tversky & D. Kahneman, "Judgment under Uncertainty: Heuristics and Biases", Science, 185(4157), 1974。
  - kind: method
    heading: 根拠を見える形にする技法
    blocks:
      - type: p
        text: |-
          設計会でよく使う評価の方法を紹介します。
      - type: steps
        items:
          - title: 評価基準を決める
            body: '[[requirements]]に立ち返り、案を比べる物差しを決めます。基準は、案を見る前に決めるのが原則です。案を見てから決めると、好きな案に有利な基準を選びがちだからです。'
          - title: ピューの概念選定法
            body: 基準となる案を一つ決め、ほかの案を基準ごとに「良い（＋）」「同じ（S）」「悪い（－）」で比べます。単純ですが、長所と短所を一覧でき、良いところを組み合わせた新しい案を考えるきっかけになります。
          - title: 階層分析法（AHP）
            body: 基準どうしを二つずつ比べて「どちらがどれくらい大事か」を答え、その結果から各基準の重みを計算します。判断の食い違いの度合い（整合度）も数値で確かめられます。
          - title: 重み付きの評価
            body: 各案を基準ごとに採点し、重みを掛けて合計します。点数の差が小さいときは、重みを少し変えても順位が入れ替わらないか（感度分析）を確かめます。
          - title: 記録する
            body: 選んだ案だけでなく、選ばなかった案とその理由も残します。
      - type: figure
        name: ahp-example
      - type: p
        text: |-
          上の例では、サークルで3Dプリンタを選ぶ場面を想定し、四つの基準の重みをAHPで計算しています。表の値は「行の基準が、列の基準に比べてどれだけ大事か」を1〜9の尺度で表したもので、重みは、この表（行列）の主固有ベクトルから求めます。整合度（CR）が0.1を下回っていれば、判断に大きな矛盾はないとみなすのが一般的です。
        note: |-
          T. L. Saaty, "A scaling method for priorities in hierarchical structures", Journal of Mathematical Psychology, 15(3), 1977。
      - type: p
        text: |-
          数値で評価する目的は、判断を計算に任せることではありません。数字にすることで、どこで意見が分かれているのかが見え、議論が具体的になることにこそ価値があります。
  - kind: history
    heading: 「よい選択」を考えてきた歴史
    blocks:
      - type: timeline
        items:
          - year: 紀元前1世紀
            title: 強・用・美
            body: ウィトルウィウスが、建築が備えるべき三つの条件として、丈夫さ、使いやすさ、美しさを挙げる。
          - year: 1890年代〜1900年代
            title: パレート最適
            body: ヴィルフレド・パレートが、誰かを不利にせずには誰も有利にできない状態について論じる。
          - year: "1944"
            title: ゲーム理論
            body: フォン・ノイマンとモルゲンシュテルンが、不確かな状況での合理的な選択を数学で論じる（期待効用の公理は1947年の第2版で示された）。
          - year: "1947"
            title: 線形計画法
            body: ジョージ・ダンツィグがシンプレックス法を考案し、制約のもとで最良の答えを計算で求める時代が始まる。
          - year: "1974"
            title: 判断の偏り
            body: トヴェルスキーとカーネマンが、人の直感的な判断に一定の偏りがあることを示す。
          - year: 1977〜1980
            title: 階層分析法（AHP）
            body: トーマス・サーティが、一対比較から重みを求める方法を発表する。
          - year: "1981"
            title: ピューの概念選定法
            body: スチュアート・ピューが、案を基準ごとに比べて選ぶ方法を発表する。
          - year: "1995"
            title: セットベース設計
            body: トヨタの開発を調べた研究から、複数の案を並行して検討し、根拠をもって絞り込む進め方が注目される。
          - year: "2002"
            title: 多目的最適化の普及
            body: 遺伝的アルゴリズム NSGA-II が発表され、パレート最適な案の集まりをコンピュータで探すことが広まる。
  - kind: now
    heading: 候補が増えるほど、価値が問われる
    blocks:
      - type: p
        text: |-
          コンピュータの計算能力が上がり、設計の候補を何千、何万と自動で生み出して評価することもできるようになりました。ジェネレーティブデザインと呼ばれる方法では、設計者が目的と制約を与えると、コンピュータが多くの形を提案し、パレート最適な案の集まりを示します。
      - type: p
        text: |-
          それでも、最後に何を選ぶかを決めるのは人間です。候補が増えるほど、何を目的とし、何を大切にするのかという価値の判断が、設計者に重く問われるようになっています。製品が環境や社会に与える影響まで含めて評価することも、いまの設計では欠かせません。
  - kind: activity
    heading: 大プレゼンで、投資家に問われる
    blocks:
      - type: p
        text: |-
          設計会のプロジェクトの最後の段階は、外部の方を含む「投資家」に向けた大プレゼンです。投資家は、設計解がどれほど優れているかだけでなく、なぜその案を選んだのか、ほかにどんな案を検討し、なぜ選ばなかったのかを問います。
      - type: illustration
        id: E6-02
        ratio: "16:9"
        caption: 設計解を発表し、問いを受ける大プレゼン。
        alt: 発表者が設計図と比較表を映したスクリーンの前に立ち、手前の机に並んだ数人の評価者が評価用紙を手に質問している様子の絵
      - type: p
        text: |-
          そのため設計段階では、評価基準をチームで合意し、ピューの概念選定法やAHPで案を比べ、その過程を記録します。選んだ理由をデータと論理で語れること。それは、設計者が自分の設計に責任を持つということでもあります。
references:
  - text: T. L. Saaty, The Analytic Hierarchy Process, McGraw-Hill, 1980.
  - text: T. L. Saaty, "A scaling method for priorities in hierarchical structures", Journal of Mathematical Psychology, 15(3), pp.234–281, 1977.
    url: https://doi.org/10.1016/0022-2496(77)90033-5
  - text: S. Pugh, Total Design ― Integrated Methods for Successful Product Engineering, Addison-Wesley, 1991.
  - text: A. Tversky & D. Kahneman, "Judgment under Uncertainty — Heuristics and Biases", Science, 185(4157), pp.1124–1131, 1974.
    url: https://doi.org/10.1126/science.185.4157.1124
  - text: K. Deb ほか, "A fast and elitist multiobjective genetic algorithm — NSGA-II", IEEE Transactions on Evolutionary Computation, 6(2), 2002.
    url: https://doi.org/10.1109/4235.996017
  - text: J. von Neumann & O. Morgenstern, Theory of Games and Economic Behavior, Princeton University Press, 1944.
  - text: ウィトルウィウス『ウィトルーウィウス建築書』森田慶一訳, 東海大学出版会, 1979年.
