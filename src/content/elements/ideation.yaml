  - text: 川喜田二郎『発想法 ― 創造性開発のために』中公新書, 1967年.
  - text: C. Alexander, Notes on the Synthesis of Form, Harvard University Press, 1964.
  - text: P. G. Rowe, Design Thinking, MIT Press, 1987.
  - text: Design Council (UK), "The Double Diamond".
    url: https://www.designcouncil.org.uk/our-resources/the-double-diamond/
  - text: A. Ward, J. K. Liker, J. J. Cristiano, D. K. Sobek II, "The Second Toyota Paradox", Sloan Management Review, 36(3), 1995.
  - text: M. Diehl & W. Stroebe, "Productivity Loss in Brainstorming Groups", Journal of Personality and Social Psychology, 53(3), pp.497–509, 1987.
    url: https://doi.org/10.1037/0022-3514.53.3.497
