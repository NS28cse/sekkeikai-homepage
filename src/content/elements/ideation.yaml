title: 発想
en: Ideation
order: 2
question: 一人では届かない案に、どう届くか
summary: 問題の捉え方を広げ、多くの案を生み、整理して絞り込む。ブレインストーミングや KJ 法など、複数人で考えるための技法。
lead: 設計の問題には、最初から決まった答えがありません。どれだけ多くの、どれだけ違った案を検討できたかが、最終的な設計の質を左右します。発想は才能やひらめきだけの問題ではなく、方法によって鍛えられる技術です。
hero:
  id: E2-01
  caption: 壁一面のカードから、まだ名前のない構造を探す。
  alt: 壁に貼られたたくさんのカードを数人が囲み、似たカードを寄せて線で囲み、小さな札で名前を付けている様子の絵
chapters:
  - kind: concept
    heading: 発散と収束を、分けて考える
    blocks:
      - type: p
        text: |-
          発想の技法の多くは、「発散」と「収束」という二つの頭の使い方を分けることを基本にしています。発散は、評価をあとまわしにして、できるだけ多くの、できるだけ違った案を出すこと。収束は、出てきた案を整理し、比べ、選ぶことです。二つを同時にやろうとすると、出かかった案を自分で打ち消してしまいます。
      - type: p
        text: |-
          心理学者J・P・ギルフォードは、1950年の米国心理学会の会長講演で創造性を研究することの大切さを訴え、のちに、ひとつの問いから多様な答えを生む「拡散的思考」と、ひとつの正解に向かう「収束的思考」を区別しました。設計の現場では、この二つを意識して切り替えることが求められます。
        note: |-
          J. P. Guilford, "Creativity", American Psychologist, 5(9), 1950。拡散的思考と収束的思考の区別は、その後の「知性の構造」モデルの中で示された。
      - type: figure
        name: double-diamond
      - type: p
        text: |-
          ダブルダイヤモンドの図が示すように、発散と収束は二度訪れます。一度目は「どの問題を解くべきか」を見つけるため、二度目は「どう解くか」を見つけるためです。いきなり解決策を考え始めると、そもそも解くべきでない問題を、見事に解いてしまうことがあります。
  - kind: relation
    heading: 案の幅が、設計の天井を決める
    blocks:
      - type: p
        text: |-
          設計の初めに考える案の幅が狭いと、その後どれだけ丁寧に設計しても、最初の案の延長線上の改善しかできません。トヨタの製品開発を調べた研究者たちは、複数の設計案を並行して検討し、根拠をもって少しずつ絞り込んでいく進め方（セットベース・コンカレント・エンジニアリング）が、結果として開発を速く、確かなものにしていると報告しました。
        note: |-
          A. Ward, J. K. Liker, J. J. Cristiano, D. K. Sobek II, "The Second Toyota Paradox: How Delaying Decisions Can Make Better Cars Faster", Sloan Management Review, 36(3), 1995。
      - type: p
        text: |-
          発想は、[[requirements]]とも切り離せません。使い手の困りごとを別の角度から捉え直すことで、思いもよらない解が見えることがあります。また、案を多く出すほど、それらを公平に比べる[[decision]]の技法が大切になります。
      - type: p
        text: |-
          そして、発想の幅を広げるもっとも確かな方法は、自分と違う人と一緒に考えることです。専門、学年、経験の違う人が集まれば、同じ問題がまったく違って見えます。
  - kind: method
    heading: 複数人で考えるための技法
    blocks:
      - type: p
        text: |-
          ここでは、設計会で使う代表的な技法を紹介します。どれも特別な道具は要らず、紙とペンがあれば今日から試せます。
      - type: steps
        items:
          - title: ブレインストーミング
            body: 広告会社の経営者アレックス・オズボーンが考案。批判しない、自由奔放を歓迎する、質より量、他人の案に便乗する、の四つの規則で、短い時間に多くの案を出します。
          - title: KJ法
            body: 文化人類学者の川喜田二郎が、野外調査で集めた膨大な記録をまとめるために考案。一つの事実を一枚のカードに書き、似たものを集めて名前を付け、関係を図にし、文章にまとめます。
          - title: ペルソナ
            body: 架空の、しかし具体的な一人の利用者像をつくり、その人の目線で考えます。「みんな」のための設計は、結局だれのためにもならないことが多いからです。
          - title: SCAMPER
            body: 置き換える、組み合わせる、応用する、修正する、他の使い道を考える、取り除く、逆にする。七つの問いを順に当てて、いまある案を変形させます。
          - title: スケッチと試作
            body: 頭の中の案を、紙や段ボールで手早く形にします。形にすると、言葉だけでは気づかなかった問題や可能性が見えてきます。
      - type: figure
        name: kj-method
      - type: p
        text: |-
          これらの技法に共通するのは、考えを頭の中から外に出し、ほかの人と共有できる形にすることです。付箋、カード、ホワイトボード、スケッチは、チームで考えるための道具なのです。
      - type: p
        text: |-
          一方で、ブレインストーミングには限界も指摘されています。グループで同時に話すと、他人の発言を待つあいだに自分の案を忘れたり、評価を気にして発言を控えたりするため、同じ人数がそれぞれ一人で考えた案を合わせた方が、数が多くなるという実験結果があります。そのため、まず各自が黙って書き出し、それから共有する進め方（ブレインライティングなど）も広く使われています。
        note: |-
          M. Diehl & W. Stroebe, "Productivity Loss in Brainstorming Groups: Toward the Solution of a Riddle", Journal of Personality and Social Psychology, 53(3), 1987。
  - kind: history
    heading: 発想を「方法」にした人たち
    blocks:
      - type: timeline
        items:
          - year: 1939ごろ
            title: ブレインストーミングの誕生
            body: 米国の広告会社でアレックス・オズボーンが会議の方法として始める。1953年の著書『Applied Imagination』で広く紹介される。
          - year: "1950"
            title: 創造性研究の始まり
            body: ギルフォードが米国心理学会の会長講演で、創造性を科学的に研究する必要を訴える。
          - year: "1964"
            title: 『形の合成に関するノート』
            body: 建築家クリストファー・アレグザンダーが、設計の問題を要素に分けて形を導く方法を論じる。のちの『パタン・ランゲージ』（1977年）につながる。
          - year: "1967"
            title: KJ法
            body: 川喜田二郎が『発想法』（中公新書）を出版し、KJ法を広く紹介する。
          - year: "1971"
            title: SCAMPER
            body: ボブ・エバールが、オズボーンの発想のチェックリストを覚えやすい七つの問いにまとめる。
          - year: "1987"
            title: 『デザイン思考』
            body: ピーター・ロウが、建築や都市計画の設計者が考える過程を分析した著書『Design Thinking』を出版する。
          - year: "1991"
            title: IDEO の設立
            body: 人間中心の発想を、実務の方法として広めることになるデザイン会社が誕生する。
          - year: "2005"
            title: ダブルダイヤモンド
            body: 英国デザイン・カウンシルが設計の進め方を発散と収束の図で示す。同じころ、スタンフォード大学に d.school が開設され、デザイン思考の教育が広がる。
  - kind: now
    heading: 形だけの発想法を超えて
    blocks:
      - type: p
        text: |-
          2000年代以降、「デザイン思考」は製品開発だけでなく、企業の経営や行政サービス、教育にまで広がりました。共感、問題の定義、発想、試作、テストという流れは、多くの組織で共通の言葉になっています。
      - type: p
        text: |-
          同時に、手順をなぞるだけの形式的な「デザイン思考」への批判もあります。付箋をたくさん貼ることが目的になってしまっては意味がありません。大切なのは技法そのものではなく、問題の捉え方を問い直し、多様な案を本気で検討する姿勢です。
      - type: p
        text: |-
          オンラインのホワイトボードや生成AIは、発散の段階を大きく助けてくれます。大量の案を短い時間で出したり、別の分野の事例を探したりするのは得意です。しかし、どの案に可能性があるかを見極め、使い手の現実と照らし合わせるのは、やはり人間の役割です。AIが出す「もっともらしい平均的な案」から抜け出すためにも、人と人との対話はますます価値を持つようになっています。
  - kind: activity
    heading: 「なんでもプレゼン」から始まる
    blocks:
      - type: p
        text: |-
          設計会の活動は、第0段階の「なんでもプレゼン」から始まります。好きなこと、学んだことを気軽に発表しあう勉強会は、一見すると設計と関係がないように見えるかもしれません。けれども、ほかの人の関心や知識に触れることは、発想の引き出しを増やす何よりの方法です。新しいプロジェクトの種も、ここから生まれます。
      - type: illustration
        id: E2-02
        ratio: "16:9"
        caption: 発表は一方通行ではなく、問いを交わす場。
        alt: 小さな教室で一人がスライドを指して発表し、聞き手の数人が手を挙げたりメモを取ったりしている様子の絵
      - type: p
        text: |-
          プロジェクトの設計段階では、発案者と設計仲間が集まり、ブレインストーミングやKJ法で問題を掘り下げます。学部や学年が違えば、同じ問題でも見え方が違います。その違いこそが、設計会が「複数人で考える場」を大切にする理由です。
references:
  - text: A. F. Osborn, Applied Imagination, Charles Scribner's Sons, 1953.
  - text: J. P. Guilford, "Creativity", American Psychologist, 5(9), pp.444–454, 1950.
