title: 要求定義
en: Requirements
order: 1
question: 何を、なぜつくるのか
summary: 設計の出発点。使い手や依頼者の願いを聞き取り、確かめられる言葉と数値に書き直して「何をつくるべきか」を決める。
lead: 設計がたどり着く場所は、出発点で決まります。要求定義とは、人の願いや困りごとを聞き取り、それを「確かめられる約束」に書き直す作業です。曖昧な願いのままでは、設計の良し悪しを判断することすらできません。
hero:
  id: E1-01
  caption: 願いは、人から人へ伝わるうちに少しずつ形を変える。
  alt: 依頼者の吹き出しの中の「ほしいもの」が、聞き手、設計者、製作者へと伝わるたびに少しずつ違う形に変わっていく様子を一枚に描いた絵
chapters:
  - kind: concept
    heading: 願いは、そのままでは仕様にならない
    blocks:
      - type: p
        text: |-
          「使いやすいアプリがほしい」「丈夫な椅子がほしい」。依頼者の言葉は、たいてい曖昧です。「使いやすい」とは、誰にとって、どんな場面で、どの程度のことなのか。それが決まらない限り、設計者は何を目指せばよいのかわからず、完成したものが良いのか悪いのかも判定できません。
      - type: p
        text: |-
          要求定義では、こうした願いを段階的に具体化します。まず「なぜそれが必要なのか」という目的を確かめ、次に「何ができればよいか」という要求を挙げ、最後に「どの程度できればよいか」を数値や条件で表した仕様に落とし込みます。システムとソフトウェアの国際規格 ISO/IEC/IEEE 29148 は、よい要求の条件として、必要であること、曖昧でないこと、検証できること、実現できることなどを挙げています。
        note: |-
          ISO/IEC/IEEE 29148:2018, Systems and software engineering — Life cycle processes — Requirements engineering。
      - type: p
        text: |-
          要求には、**機能要求**（何をするか）と**非機能要求**（どれくらいうまくやるか。速さ、安全性、使いやすさ、直しやすさなど）があります。さらに、予算や法律、使える技術といった、守らなければならない**制約**もあります。
      - type: figure
        name: requirements-layers
  - kind: relation
    heading: 正しいものを、正しくつくる
    blocks:
      - type: p
        text: |-
          ソフトウェア工学の先駆者バリー・ベームは、検証（verification）と妥当性確認（validation）の違いを、「製品を正しくつくっているか」と「正しい製品をつくっているか」という二つの問いで説明しました。どれほど精密に設計し、完璧に製造しても、要求そのものが間違っていれば、できあがるのは「正しくつくられた、間違った製品」です。
        note: |-
          B. W. Boehm, "Verifying and Validating Software Requirements and Design Specifications", IEEE Software, 1(1), 1984。
      - type: p
        text: |-
          要求は、設計を評価する物差しそのものでもあります。設計の途中で案を比べるとき、最後に試験をするとき、基準になるのは要求です。下のV字モデルは、左側で決めた要求や設計が、右側でそれぞれの試験によって確かめられる関係を表しています。要求が検証できる形で書かれていなければ、右側の試験は成り立ちません。
      - type: figure
        name: v-model
      - type: p
        text: |-
          大規模な開発の失敗の原因として、要求の問題は繰り返し挙げられてきました。トップページの設計論で紹介したNASAの見積もりのように、要求の誤りは後になるほど直すのが高くつきます。要求定義は、設計全体の土台を固める作業なのです。
  - kind: method
    heading: 願いを聞き、約束に書き直す
    blocks:
      - type: p
        text: |-
          要求定義に唯一の正しい手順はありませんが、多くの方法に共通する流れがあります。設計会のプロジェクトでも、おおむね次の順で進めます。
      - type: steps
        items:
          - title: 関係者を洗い出す
            body: 使う人、お金を出す人、運用する人、影響を受ける人。要求を持っているのは、依頼者だけではありません。
          - title: 声を集める
            body: インタビュー、観察、アンケート、似た製品の調査。言葉にされない不満は、使っている様子を観察してはじめて見えることもあります。
          - title: 目的にさかのぼる
            body: 「なぜそれがほしいのか」を繰り返し尋ね、手段として語られた要求の奥にある、本当の目的を確かめます。
          - title: 分類し、順位をつける
            body: 機能要求・非機能要求・制約に分け、なくてはならないものと、あればうれしいものを区別します。
          - title: 検証できる形に書く
            body: 「速い」ではなく「3秒以内」。数値や条件だけでなく、どうやって確かめるかまで決めます。
          - title: 合意し、記録する
            body: 関係者と内容を確認し、仕様書として残します。変更が起きたら、理由とともに更新します。
      - type: p
        text: |-
          要求の性格を見極める道具として、日本で生まれた**狩野モデル**がよく使われます。1984年に狩野紀昭らが発表したこのモデルは、満たされて当然で、欠けると強い不満を生む「当たり前品質」、満たされるほど満足が増す「一元的品質」、なくても不満はないが、あると大きな喜びを生む「魅力的品質」を区別します。
        note: |-
          狩野紀昭・瀬楽信彦・高橋文夫・辻新一「魅力的品質と当り前品質」『品質』14巻2号, 1984年。
      - type: figure
        name: kano-model
      - type: p
        text: |-
          魅力的品質は、時間がたつと当たり前品質へと移っていきます。かつて驚きをもって迎えられた携帯電話のカメラは、いまでは付いていて当然の機能です。要求は固定されたものではなく、時代とともに動くことも覚えておく必要があります。
      - type: p
        text: |-
          要求を設計に結びつける手法としては、**品質機能展開（QFD）**もあります。使い手の声を表の行に、製品の技術的な特性を列に並べ、どの特性がどの要求に効くのかを一覧にする方法で、1960年代後半から1970年代にかけて、赤尾洋二や水野滋らによって日本で体系化されました。
        note: |-
          赤尾洋二が1966年に品質保証の考え方として提唱し、1972年に三菱重工業神戸造船所で「品質表」がつくられたことが知られる。水野滋・赤尾洋二編『品質機能展開』日科技連出版社, 1978年。
      - type: illustration
        id: E1-02
        ratio: "16:9"
        caption: 当たり前品質・一元的品質・魅力的品質。同じ製品の中にも、性格の違う要求が同居している。
        alt: 一台の自転車を中心に、「ブレーキが効く」（当たり前）、「軽い」（一元的）、「ライトが自動で点く」（魅力的）という三つの要求が、色分けされた吹き出しで示されている絵
  - kind: history
    heading: 要求を「書く」ことの歴史
    blocks:
      - type: p
        text: |-
          要求をはっきり書き残す営みは、工学が大規模になり、多くの人が一つのものをつくるようになるにつれて発展してきました。
      - type: timeline
        items:
          - year: 1960年代
            title: システム工学の確立
            body: アポロ計画のような巨大な開発で、要求を文書にし、階層的に分解して管理する方法が整えられていく。
          - year: "1966"
            title: 品質機能展開の源流
            body: 赤尾洋二が、使い手の求める品質を設計に展開する考え方を提唱する。
          - year: "1975"
            title: 『人月の神話』
            body: フレデリック・ブルックスが大規模ソフトウェア開発の困難を論じ、設計の「概念の一貫性」の大切さを説く。
          - year: "1984"
            title: 狩野モデル
            body: 狩野紀昭らが「魅力的品質と当り前品質」を発表する。
          - year: "1984"
            title: 検証と妥当性確認
            body: バリー・ベームが、正しくつくることと、正しいものをつくることを区別して論じる。
          - year: "1998"
            title: IEEE 830 の改訂
            body: ソフトウェア要求仕様書の書き方を定めた規格が改訂され、広く参照されるようになる。
          - year: "2001"
            title: アジャイルソフトウェア開発宣言
            body: 変化する要求に応えることを重んじる考え方が広まり、ユーザーストーリーなどの軽い書き方が普及する。
          - year: "2011"
            title: ISO/IEC/IEEE 29148
            body: 要求エンジニアリングの国際規格が制定される（2018年に改訂）。
  - kind: now
    heading: 学びながら、要求を更新する
    blocks:
      - type: p
        text: |-
          ソフトウェアの世界では、すべての要求を最初に決めきるのではなく、小さくつくって使ってもらい、要求そのものを学びながら更新していく進め方が主流になりました。「利用者として○○したい。なぜなら△△だから」という形のユーザーストーリーは、要求と目的を一緒に書き留めるための工夫です。
      - type: p
        text: |-
          一方で、自動車や医療機器、航空宇宙のように安全が重要な分野では、要求から設計、試験までのつながりを漏れなくたどれること（トレーサビリティ）が規格で求められています。近年は、要求を文書だけでなくモデルとして管理する、モデルベースシステムズエンジニアリング（MBSE）も広がっています。詳しくは[[modeling]]のページを参照してください。
      - type: p
        text: |-
          生成AIの普及によって、インタビューの記録を整理させたり、要求の抜け漏れや矛盾を指摘させたりすることも身近になりました。ただし、何が本当に求められているのかを確かめ、その要求に責任を持つのは、いまも人間の仕事です。
  - kind: activity
    heading: 小プレゼンで、要求を磨く
    blocks:
      - type: p
        text: |-
          設計会のプロジェクトは、発案者が「実現したいこと」を持ち込むところから始まります。第2段階の小プレゼンでは、発案者が簡易な仕様書をもとに発表し、聞き手からの質問を受けます。「それは誰のためのもの？」「なぜそれが必要？」という問いに答えるうちに、要求が磨かれていきます。
      - type: p
        text: |-
          第3段階の設計では、チームで要求を機能要求・非機能要求・制約に整理し、狩野モデルや品質機能展開を使って、どの要求に力を注ぐべきかを議論します。完成した仕様書は、大プレゼンで設計解を評価するときの物差しにもなります。
references:
  - text: ISO/IEC/IEEE 29148:2018 Systems and software engineering — Life cycle processes — Requirements engineering.
  - text: B. W. Boehm, "Verifying and Validating Software Requirements and Design Specifications", IEEE Software, 1(1), pp.75–88, 1984.
    url: https://doi.org/10.1109/MS.1984.233702
  - text: 狩野紀昭・瀬楽信彦・高橋文夫・辻新一「魅力的品質と当り前品質」『品質』14巻2号, pp.147–156, 1984年.
  - text: 水野滋・赤尾洋二編『品質機能展開 ― 全社的品質管理へのアプローチ』日科技連出版社, 1978年.
  - text: Frederick P. Brooks Jr., The Mythical Man-Month, Addison-Wesley, 1975（邦訳『人月の神話』）.
  - text: J. M. Stecklein ほか, "Error Cost Escalation Through the Project Life Cycle", NASA Johnson Space Center, 2004.
    url: https://ntrs.nasa.gov/citations/20100036670
  - text: Manifesto for Agile Software Development, 2001.
    url: https://agilemanifesto.org/
