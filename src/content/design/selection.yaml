title: 比べて選ぶ
en: Evaluation & Selection
layer: step
order: 4
stepName: 評価・選定
mode: converge
tools: ピューの概念選定法・AHP
short: 比べて選ぶ
question: どの案を、なぜ選ぶか
summary: 目的どうしがぶつかる中で、案を比べて一つを選ぶ。基準は案を見る前に決め、選んだ理由と選ばなかった理由を残す。
lead: たくさんの案から一つを選びます。軽さと値段のように、設計の目的はたいていぶつかり合います。この工程では、何をどれだけ大切にするかを、話し合える形にして選びます。
chapters:
  - id: tradeoff
    heading: どの案にも、長所と短所がある
    blocks:
      - type: point
        text: 設計の目的はぶつかり合うので、どの案にも長所と短所があります。どれを選ぶかは、何をどれだけ大切にするかという判断で決まります。
      - type: question
        text: 自転車を選ぶとき、軽くて、丈夫で、安いものを探したことはありませんか？ 3つともいちばんのものは、見つかったでしょうか。
        answer: 軽くて丈夫な素材は高く、安くて丈夫なものは重くなりがちです。たいていは、どれかを少し譲って、ほかを取ることになります。
      - type: p
        text: 設計の目的はたいてい複数あり、ぶつかり合います。どの目的をよくしようとしても、ほかのどれかが悪くなる案を「**パレート最適**」と呼びます。パレート最適な案はたいてい複数あり、その中からどれを選ぶかには、価値の判断が要ります。
      - type: figure
        name: pareto-front

  - id: must
    heading: まず、必須の要件でふるいにかける
    blocks:
      - type: point
        text: 必須の要件や制約を一つでも満たさない案は、ほかの点が高くても外します。先に要件でふるいにかけ、残った案だけを比べます。
      - type: question
        text: 費用は0円と決めたのに、月500円の予約サービスが使いやすさで満点だったら、選んでよいでしょうか？
        answer: 外します。点数を足し合わせると、使いやすさの高い点が、費用の欠点を埋めてしまいます。必須の要件は点数にせず、満たすかどうかだけを先に確かめます。
      - type: p
        text: 基準ごとの点を足し合わせる比べ方では、ある基準の大きな欠点が、ほかの基準の長所で埋め合わされてしまいます。そこで、必須の要件と制約は「満たすか、満たさないか」だけで見て、満たさない案を先に外します。点数を付けて比べるのは、ふるいを通った案だけです。
        note: パールとバイツは、要求リストを「必ず満たす要求」と「望ましい要求」に分け、必ず満たす要求に合わない案を、点数で比べる前に外す「選定リスト」を示した（[G. Pahl & W. Beitz, Engineering Design, 1984](https://ci.nii.ac.jp/ncid/BA07271699)）。
      - type: figure
        name: must-filter-funnel
      - type: p
        text: ふるいで外した案も、理由と一緒に記録に残します。要件が変わったときに、見直せるからです。外した案のよいところを、残った案に取り入れられないかも考えます。紙の予約表なら、部室の前で一目で空きがわかることです。

  - id: criteria
    heading: 基準は、案を見る前に決める
    blocks:
      - type: point
        text: 評価の基準は、案を見る前に要件から決めます。案を見てから決めると、好きな案に有利な基準を選びがちだからです。
      - type: p
        text: 人の直感的な判断には、最初に見た数字に引きずられる（アンカリング）といった偏りがあることが、心理学の研究で知られています。そこで、基準を先に決めてから、数値で比べます。その目的は、どこで意見が分かれているのかを見えるようにして、話し合いを具体的にすることです。最後に判断するのは人です。
        note: '[T. L. Saaty, The Analytic Hierarchy Process, McGraw-Hill, 1980](https://ci.nii.ac.jp/ncid/BA00342336)。[S. Pugh, Total Design, Addison-Wesley, 1991](https://ci.nii.ac.jp/ncid/BA18272194)。[A. Tversky & D. Kahneman, Science, 185(4157), 1974](https://doi.org/10.1126/science.185.4157.1124)。'
      - type: steps
        ordered: false
        items:
          - title: ピューの概念選定法
            body: 比べる元にする案（基準案）を一つ決め、ほかの案を評価の基準ごとに「よい（＋）」「同じ（S）」「悪い（－）」で比べます。長所と短所を一覧でき、よいところを組み合わせた新しい案のきっかけにもなります。
          - title: 階層分析法（AHP）
            body: 基準どうしを2つずつ比べて「どちらがどれくらい大事か」を1〜9の数で答え、その表（一対比較行列）から各基準の重みを計算します。答えどうしの矛盾の度合いも整合比（CR）で確かめられ、0.1未満がめやすです。
          - title: 重み付きの評価
            body: 各案を基準ごとに採点し、重みを掛けて合計します。点差が小さいときは、重みを少し変えたときに順位が入れ替わるか（感度分析）を確かめます。
          - title: 選んだ理由を残す
            body: 選んだ案と一緒に、選ばなかった案とその理由も記録します。条件が変わったときに、判断を見直せるからです。
        # AHPの計算の例
      - type: figure
        name: ahp-example
      - type: example
        kind: real
        title: 新国立競技場の選び直し
        text: 2015年7月、新国立競技場は総工費の見込みが約2,520億円に膨らみ、それまでの計画（ザハ・ハディド氏の案）が白紙に戻されました。8月には、工事費の上限（1,550億円）と完成の時期を先に決めた新しい整備計画がつくられ、設計と施工をまとめて案が募られました。12月、審査委員会は集まった2つの案を同じ基準で採点し、610点のA案を、602点のB案より上として選びました。
        source: "[関係閣僚会議「新国立競技場整備計画」2015年8月](https://www.jpnsport.go.jp/newstadium/Portals/0/kinennhinnhozonn/1_12seibikeikaku.pdf)と[日本スポーツ振興センターの審査結果 2015年12月](https://www.jpnsport.go.jp/newstadium/Portals/0/NNSJ/teiannshoshinnsakekka.pdf)による"
      - type: p
        text: 条件と基準を案より先に決めていたので、選んだ理由は「どの基準で何点違ったか」という形で公表されました。A案の工事費は約1,490億円で、先に決めた上限の中に収まりました。

  - id: example
    heading: 今あるものを使う案が、いちばんになることもある
    blocks:
      - type: point
        text: 要件を満たす案の中では、いちばん手間のかからない案が最良のこともあります。選ぶ目的は、つくることより、要件を満たすことです。
      - type: table
        caption: 部室の予約の案を、ピューの概念選定法で比べる（基準案は「紙の予約表」）
        head:
          - 評価の基準
          - 専用の予約アプリ
          - 曜日で使う人を決める
          - 無料の共有カレンダー
        rows:
          - - スマートフォンから3操作以内
            - ＋
            - S
            - ＋
          - - 費用（無料の範囲で続けられるか）
            - －
            - S
            - S
          - - 準備の手間
            - －
            - ＋
            - S
          - - 重なりの防ぎやすさ
            - ＋
            - ＋
            - ＋
          - - 外から空きを確かめられる
            - ＋
            - －
            - ＋
          - - 合計（＋の数 − －の数）
            - "+1"
            - "+1"
            - "+3"
      - type: example
        title: 部室の予約なら（架空の例）
        text: 専用アプリは重なりを防げても、費用と準備の手間がかかりすぎます。今は無料で動かせても、部員が入れ替わるたびに直し続ける人と、利用が増えたときの費用が要ります。だから、無料の共有カレンダーを予約表として使う案を選びます。選ばなかった案も、その理由と一緒に記録に残します。
      - type: example
        kind: real
        title: 枯れた技術の水平思考
        text: 任天堂の横井軍平は、「枯れた技術の水平思考」という考え方で知られます。使い古されて安く確かになった技術を、新しい使い道に回すという意味です。1980年のゲーム&ウオッチは、電卓で広く使われていた液晶でつくられました。
        source: "[横井軍平・牧野武文『横井軍平ゲーム館』アスキー, 1997年](https://ndlsearch.ndl.go.jp/books/R100000002-I000002652768)（[ちくま文庫, 2015年](https://ndlsearch.ndl.go.jp/books/R100000002-I026613290)）。"
      - type: p
        text: 最新の技術は、性能では勝っても、値段や確かさ、手に入りやすさで負けることがあります。比べる基準を要件から決めておけば、「新しいから」ではなく「要件をよく満たすから」という理由で選べます。

