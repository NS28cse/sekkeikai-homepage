title: 形を詰める
en: Detail Design
layer: step
order: 5
stepName: 詳細設計
mode: converge
tools: CAD・試作・仕様書
short: 形を詰める
question: どうすれば、そのとおりにつくれるか
summary: 選んだ案を、実際につくれる形にする。寸法・材料・画面の細部を決め、図面と仕様書と判断の根拠を一式にまとめる。
lead: 選んだ案を、つくる人が迷わずにつくれる形にします。小さな数字一つが、全体の安全や使いやすさを左右するのがこの工程です。
chapters:
  - id: why
    heading: 細部の数字一つが、全体を左右する
    blocks:
      - type: point
        text: 寸法、材料、部品、画面の一つ一つの動きを決めます。ここで決めた数字は、そのまま製品の安全や使いやすさになります。
      - type: example
        title: 実際にあった例：電池の「すき間」の設計
        text: 2016年に発売されたスマートフォンGalaxy Note7は、電池が発火する事故が相次ぎ、発売から約2か月で生産と販売を打ち切りました。メーカーの調査では、最初の電池は角の部分の設計に問題があってショートしやすかったとされます。約306万台が回収され、その後の機種では電池のまわりのすき間を広げ、電池の検査を増やしました。
      - type: p
        text: 細部の決め方が、製品全体の運命を決めることがあります。この工程では、ものの性能を予測し、つくるときのばらつきに強くし、使う人が迷わないように、一つ一つを決めていきます。
        note: 'Samsung Newsroom, "Galaxy Note7: What We Discovered", 2017年1月23日。回収の費用は少なくとも53億ドルと報じられた。'

  - id: steps
    heading: 詳細設計の進め方
    blocks:
      - type: point
        text: 寸法と公差を決め、材料を選び、試作して確かめ、図面と仕様書にまとめます。確かめて要件を満たさなければ、前の工程に戻ります。
      - type: steps
        items:
          - title: 寸法と公差を決める
            body: 大きさや厚さだけでなく、つくるときにどこまでずれてよいか（公差）も決めます。ずれを見込まないと、部品どうしが組み合わさりません。
          - title: 材料と部品を選ぶ
            body: 強さ、重さ、価格、手に入りやすさを比べて選びます。ソフトウェアなら、使う技術やライブラリーを選ぶのがこれに当たります。
          - title: 試作して確かめる
            body: 部分的な試作やシミュレーションで、性能と使いやすさが要件を満たすかを確かめます。満たさなければ、前の工程に戻ります。
          - title: 図面と仕様書にまとめる
            body: つくる人が迷わないよう、図面・仕様書・判断の根拠を一式にまとめます。
      - type: p
        text: 形と性能を確かめるには、CADや、構造・流れ・熱をコンピューターで解析するCAEといった[[modeling|モデル]]が欠かせません。条件の組み合わせを効率よく試すには、実験計画法などの[[data-analysis|データ分析]]の手法が使えます。画面や操作の細部は、[[human-interface|ヒューマンインターフェース]]の原則に照らして詰めます。

  - id: output
    heading: 「なぜこの形か」まで残す
    blocks:
      - type: point
        text: この工程の成果が、設計の答え（設計解）です。図面や仕様書だけでなく、判断の根拠まで一式にまとめると、あとから改良する人にも設計の意図が伝わります。
      - type: p
        text: 設計会が扱うのは、この工程の終わり、仕様書ができるところまでです。実際につくる段階に入っても、「なぜこの数字なのか」が書いてあれば、つくる人は迷わず、条件が変わったときにも正しく直せます。
      - type: example
        title: 部室の予約なら（架空の例）
        text: 共有カレンダーへの予約の書き方（名前・用件・時間）、予約の締め切り、重なったときの決め方を一枚の仕様書にまとめました。何人かに試してもらって書き方を直してから、部全体で使い始めました。

references:
  - text: 'Samsung Newsroom, "Galaxy Note7: What We Discovered", 2017.'
    url: https://news.samsung.com/global/infographic-galaxy-note7-what-we-discovered
