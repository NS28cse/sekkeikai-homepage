title: 形を詰める
en: Detail Design
layer: step
order: 5
stepName: 詳細設計
mode: converge
tools: CAD・試作・仕様書
short: 形を詰める
question: どうすれば、そのとおりにつくれるか
summary: 選んだ案を、実際につくれる形にする。寸法・材料・画面の細部を決め、図面と仕様書と判断の根拠を一式にまとめる。
lead: 選んだ案を、つくる人や運営する人が迷わない形にします。小さな数字一つが、全体の安全や使いやすさを左右するのがこの工程です。
chapters:
  - id: why
    heading: 細部の数字一つが、全体を左右する
    blocks:
      - type: point
        text: 寸法、材料、部品、画面の一つ一つの動きを決めます。ここで決めた数字は、そのまま製品の安全や使いやすさになります。
      - type: example
        title: 実際にあった例：ハッブル宇宙望遠鏡の鏡
        text: 1990年に打ち上げられたハッブル宇宙望遠鏡は、最初に届いた画像がぼやけていました。直径2.4mの主鏡が、縁のあたりで設計より約2.2µm平らに磨かれていたのです。髪の毛の太さの数十分の一のずれでした。原因は、鏡の形を測る検査の道具の中で、レンズの位置が1.3mmずれていたことでした。
        source: 'L. Allen ほか, "The Hubble Space Telescope Optical Systems Failure Report" (Allen Report), NASA, 1990。'
      - type: p
        text: 別の検査の道具は、この誤りを示していました。けれど、その結果は「そちらの道具のほうが不正確なのだろう」と見過ごされました。1993年、宇宙飛行士が補正の光学装置を取り付けて、ようやく設計どおりの像が得られました。細部の数字は、決めるだけでなく、**確かめ方まで設計しておく**必要があります。
        note: 補正は1993年12月の最初の修理ミッション（スペースシャトルSTS-61）で行われた。調査報告は、検査の結果を独立した立場で確かめる仕組みが弱かったことも指摘した。
      - type: example
        title: 実際にあった例：カップヌードルの「中間保持」
        text: 1971年に発売された日清食品のカップヌードルでは、麺のかたまりをカップの底に置かず、中ほどで止めています。麺のかたまりの大きさと形をカップに合わせて決め、内側に引っかかるようにしたのです。底とのすき間があるので、運ぶあいだに麺が割れにくく、お湯も下まで回ります。麺がカップを内側から支えるので、容器も強くなります。
        source: 日清食品グループ「カップヌードル」の開発の歴史（公式サイト）による。
      - type: p
        text: 寸法一つの決め方で、割れにくさ、お湯の回り方、容器の強さが同時に解けました。この工程では、ものの性能を予測し、つくるときのばらつきに強くし、使う人が迷わないように、一つ一つを決めていきます。

  - id: steps
    heading: 詳細設計の進め方
    blocks:
      - type: point
        text: 寸法と公差を決め、材料を選び、試作して確かめ、図面と仕様書にまとめます。確かめて要件を満たさなければ、前の工程に戻ります。
      - type: steps
        items:
          - title: 寸法と公差を決める
            body: 大きさや厚さだけでなく、つくるときにどこまでずれてよいか（公差）も決めます。ずれを見込まないと、部品どうしが組み合わさりません。
          - title: 材料と部品を選ぶ
            body: 強さ、重さ、価格、手に入りやすさを比べて選びます。ソフトウェアなら、使う技術やライブラリーを選ぶのがこれに当たります。
          - title: 試作して確かめる
            body: 部分的な試作やシミュレーションで、性能と使いやすさが要件を満たすかを確かめます。満たさなければ、前の工程に戻ります。
          - title: 図面と仕様書にまとめる
            body: つくる人が迷わないよう、図面・仕様書・判断の根拠を一式にまとめます。
      - type: figure
        name: tolerance-fit
      - type: p
        text: 形と性能を確かめるには、CADや、構造・流れ・熱をコンピューターで解析するCAEといった[[modeling|モデル]]が欠かせません。条件の組み合わせを効率よく試すには、実験計画法などの[[data-analysis|データ分析]]の手法が使えます。画面や操作の細部は、[[human-interface|ヒューマンインターフェース]]の原則に照らして詰めます。

  - id: review
    heading: 仕様書を固める前に、違う目で確かめる
    blocks:
      - type: point
        text: 細部を決めたら、仕様書を固める前に確かめます。違う立場の人に見てもらい、壊れ方を先に考え、試作は粗いものから順に細かくしていきます。
      - type: steps
        ordered: false
        items:
          - title: デザインレビュー
            body: 設計の途中で、違う立場の人（使う人、つくる人、運営する人）に見てもらう会です。設計した本人は、自分の前提に気づきにくいからです。要件と照らし合わせながら、気になる点を一つずつ挙げてもらいます。
          - title: 故障モード影響解析（FMEA）
            body: どこが、どう壊れたら、何が起きるかを表にします。起きやすさと影響の大きさを見て、先に手を打つところを決めます。表にすると、思いつきの心配ではなく、抜けのない確認になります。
          - title: 試作の粗さを上げていく
            body: 紙 → 段ボール → 3Dプリントのように、安く早い試作から始めます。粗い試作で大きな問題を見つけてから、細部を細かい試作で確かめます。画面なら、紙に描いた画面 → 動く見本の順です。
      - type: table
        caption: 部室の予約の簡単なFMEA（架空の例）
        head:
          - どこが
          - どう壊れる
          - 何が起きる
          - 手の打ち方
        rows:
          - - 予約の書き込み
            - 時間を間違えて書く
            - ほかの人の予約と重なる
            - 書き方の例をカレンダーの説明に載せる
          - - カレンダーの共有
            - 新入部員が見られない
            - 空きがわからず、部室まで行く
            - 入部の手続きに、共有の設定を入れる
          - - 予約の締め切り
            - 前日20時を過ぎて書き込む
            - 当日の朝に重なりが見つかる
            - 重なったら、先に書いた人を優先と決める
      - type: p
        text: FMEAは、1949年にアメリカ軍の手順書として始まり、宇宙開発や自動車の開発に広がりました。大きな表をつくらなくても、「どこが・どう壊れる・何が起きる・どう防ぐ」の四つの列を埋めるだけで、見落としがぐっと減ります。
        note: 'MIL-P-1629, "Procedures for Performing a Failure Mode, Effects and Criticality Analysis", U.S. Department of Defense, 1949。'
      - type: p
        text: 粗い試作には、見た人が遠慮なく意見を言いやすいという利点もあります。きれいにつくり込んだ見本ほど、「もう決まったもの」に見えて、直す意見が出にくくなります。
        note: 'M. Rettig, "Prototyping for Tiny Fingers", Communications of the ACM, 37(4), 1994。'

  - id: output
    heading: 「なぜこの形か」まで残す
    blocks:
      - type: point
        text: この工程の成果が、設計の答え（設計解）です。図面や仕様書だけでなく、判断の根拠まで一式にまとめると、あとから改良する人にも設計の意図が伝わります。
      - type: p
        text: まとめるものは分野で違います。機械なら図面、ソフトウェアなら画面や機能の仕様書、建築なら設計図書、イベントなら運営の計画と時間割、ポスターなら印刷所に渡すデータです。どれも、つくる人や運営する人が、それだけを見て迷わずに進められることを目指します。
      - type: p
        text: 設計会が扱うのは、この工程の終わり、仕様書ができるところまでです。実際につくる段階に入っても、「なぜこの数字なのか」が書いてあれば、つくる人は迷わず、条件が変わったときにも正しく直せます。
      - type: example
        title: 部室の予約なら（架空の例）
        text: 共有カレンダーへの予約の書き方（名前・用件・時間）、予約の締め切り、重なったときの決め方を一枚の仕様書にまとめました。何人かに試してもらって書き方を直してから、部全体で使い始めました。

  - id: spec
    heading: 仕様書には、前の工程の答えが全部入る
    blocks:
      - type: point
        text: 仕様書は、五つの工程の答えを一つにまとめたものです。目的、要件と確かめ方、仕組みや流れ、寸法とその理由、確かめる計画、判断の記録を書きます。
      - type: table
        caption: 仕様書に書くことと、そのもとになる工程
        head:
          - 項目
          - 書くこと
          - もとになる工程
        rows:
          - - 目的
            - 誰の、どんな問題を解くのか
            - 工程1（問題の一文）
          - - 要件と確かめ方
            - 満たすべき条件と、それをどう確かめるか
            - 工程2（要件の表）
          - - 構造や画面の流れ
            - 部品の組み合わせ、画面や手順の流れ
            - 工程3・4（選んだ案）
          - - 寸法と理由
            - 数字や決まりと、なぜその値にしたか
            - 工程5
          - - 確かめる計画
            - いつ、誰が、何を試して確かめるか
            - 工程2・5
          - - 判断の記録
            - 選んだ案、見送った案とその理由
            - 工程4（比較の表）
      - type: figure
        name: spec-anatomy
      - type: p
        text: 前の工程で書いたものが、ここで一つにつながります。逆に言えば、仕様書を書こうとして手が止まるところは、前の工程で決めきれていないところです。そのときは、その工程に戻って決め直します。

references:
