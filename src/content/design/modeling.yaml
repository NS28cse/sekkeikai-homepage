title: モデル化
en: Modeling
layer: lens
order: 1
short: モデルで考える
question: 現実を、考えられる大きさにする
summary: まだ存在しないものを、図・模型・数式・シミュレーションで表し、つくる前に確かめる。何を残し、何を捨てるかを決める設計行為。
lead: 設計の対象は、設計しているあいだ、まだ存在しません。存在しないものについて考え、議論し、確かめるために、私たちはモデルをつくります。モデル化とは、現実の複雑さの中から、いま考えるべきことだけを取り出す技術です。
hero:
  id: MD-01
  caption: 同じ椅子も、目的によって違うモデルで表す。
  alt: 一脚の椅子が、手描きのスケッチ、寸法の入った三面図、立体のワイヤーフレーム、力の矢印を書き込んだ図の四通りで横に並べて描かれた絵
chapters:
  - kind: concept
    heading: モデルとは、目的のために捨てたもの
    blocks:
      - type: p
        text: |-
          モデルとは、ある目的のために、対象の性質の一部を取り出して表したものです。地図は土地のモデルですが、地下鉄の路線図は駅の順番と乗り換えだけを残し、実際の距離や方角を大胆に捨てています。その捨て方のおかげで、「どう乗り換えるか」を考えるという目的には、正確な地図よりもずっと役に立ちます。
      - type: p
        text: |-
          設計で使うモデルには、いくつもの種類があります。スケッチや三面図のような**図のモデル**、縮尺模型や試作品のような**物理モデル**、方程式で表す**数理モデル**、コンピュータの中で動かす**シミュレーション**、そして要素どうしの関係を表す**概念モデル**や**データモデル**です。どれを使うかは、何を確かめたいかによって決まります。
      - type: p
        text: |-
          統計学者ジョージ・ボックスは「すべてのモデルは間違っている」と書きました。モデルは必ず何かを捨てているので、現実と完全に一致することはありません。問うべきなのは、モデルが正しいかどうかではなく、目的に対して十分に役に立つかどうかです。
        note: |-
          G. E. P. Box, "Science and Statistics", Journal of the American Statistical Association, 71(356), 1976。のちに「しかし、役に立つものもある」と続けた形で広く引用される。
      - type: figure
        name: abstraction-ladder
  - kind: relation
    heading: つくる前に、何度でも壊せる
    blocks:
      - type: p
        text: |-
          モデルがあれば、つくる前に試すことができます。本物の橋で強さを試すことはできませんが、計算や模型なら何度でも壊せます。案を比べる、弱点を見つける、性能を予測する。設計の判断の多くは、モデルを使った「思考実験」の上に成り立っています。
      - type: p
        text: |-
          下の計算は、本棚の棚板がどれだけたわむかを、両端を支えた梁という単純なモデルで見積もるものです。板の厚さを18mmから12mmにすると、たわみは約3.4倍になります。たわみが厚さの3乗に反比例するという関係は、モデルを使わずに直感だけで見抜くのは難しいでしょう。つまみを動かして確かめてみてください。
      - type: figure
        name: beam-calculator
      - type: p
        text: |-
          モデルは、人と人が設計について話すための共通の言葉でもあります。同じ図面を見ていれば、言葉だけでは伝わらない形や寸法を、誤解なく共有できます。逆に、関係者がそれぞれ違うモデルを頭に描いていると、議論はかみ合いません。1999年に失われた火星探査機マーズ・クライメイト・オービターの事故は、二つのソフトウェアのあいだで、数値の単位についての取り決めが守られていなかったことが原因でした。
        note: |-
          NASA, Mars Climate Orbiter Mishap Investigation Board Phase I Report, 1999。地上のソフトウェアが、インターフェース仕様で定められたニュートン秒ではなく、ポンド重秒で値を出力していた。
  - kind: method
    heading: モデルをつくり、使い、直す
    blocks:
      - type: p
        text: |-
          モデル化は、次のような手順で進めると見通しがよくなります。
      - type: steps
        items:
          - title: 目的を決める
            body: そのモデルで何を確かめたいのかを、最初に一文で書きます。目的が決まらなければ、何を残し何を捨てるかも決まりません。
          - title: 境界を決める
            body: どこまでを対象に含め、何を外から与えられる条件として扱うかを決めます。
          - title: 仮定を書き出す
            body: 「材料はどこも同じ」「荷重は均等」など、単純にするための仮定をはっきり書きます。仮定の一覧は、モデルの弱点の一覧でもあります。
          - title: 表し方を選ぶ
            body: 図、数式、表計算、シミュレーション、物理的な試作。目的と手間に見合う表し方を選びます。
          - title: 確かめる
            body: わかっている結果や実際に測った値と比べ、モデルが目的に足りる精度を持っているかを確かめます。
          - title: 使って、直す
            body: モデルの結果を設計の判断に使い、新しくわかったことに合わせてモデルを直します。
      - type: p
        text: |-
          情報系の設計でよく使われるのは、構造や振る舞いを図で表すモデルです。データの関係を表す実体関連図（ER図）、システムの部品とその関係を表すクラス図、状態の移り変わりを表す状態遷移図などは、統一モデリング言語（UML）として標準化されています。機能のつながりを箱と矢印で表すIDEF0は、設計会の「問題解決」の手法のひとつとしても使っています。
        note: |-
          UML は1997年にオブジェクト・マネジメント・グループ（OMG）が標準として採択した。IDEF0 は米空軍のICAM計画の中で開発され、1993年に米国の連邦情報処理規格（FIPS PUB 183）となった。
      - type: p
        text: |-
          [[process|設計の5つの工程]]のそれぞれで、モデルは次のように使えます。工程が進むほど、モデルは粗いものから精密なものへと変わっていきます。
      - type: steps
        items:
          - title: 問題を見つける
            body: いまの仕組みや生活の流れを図にして、どこで問題が起きているのかを見える形にします。
          - title: 要件を定める
            body: IDEF0やユースケース図で、果たすべき機能とその入出力、機能どうしのつながりを整理します。
          - title: 案を広げる
            body: 精度より速さ。スケッチや紙・段ボールの模型で、形や大きさの感覚をつかみます。
          - title: 比べて選ぶ
            body: 上の棚板の例のような簡単な数理モデルで、案ごとの性能を見積もって比べます。
          - title: 形を詰める
            body: 3次元CADで形を決め、構造や流れのシミュレーション（CAE）で性能を確かめます。
  - kind: history
    heading: 模型と図面から、デジタルツインまで
    blocks:
      - type: timeline
        items:
          - year: 紀元前1世紀
            title: 平面図・立面図・透視図
            body: ウィトルウィウスが『建築について』で、建築家が描くべき図として平面図、立面図、透視図を挙げる。
          - year: "1638"
            title: ガリレオ『新科学対話』
            body: 梁の強さや、形が相似でも大きさが変わると強さの割合が変わることを論じる。
          - year: 1790年代
            title: 画法幾何学
            body: ガスパール・モンジュが、立体を平面に正確に描き表す方法を体系化する。のちの製図法の基礎になる。
          - year: 1870年代
            title: 船の模型実験
            body: ウィリアム・フルードが水槽で船の模型を引き、実物の抵抗を予測する相似則を確立する。
          - year: "1901"
            title: ライト兄弟の風洞
            body: 自作の風洞で200種類ほどの翼の模型を試験し、2年後の初飛行につなげる。
          - year: "1956"
            title: 有限要素法
            body: ボーイング社のターナーやクラフらが航空機の構造を解析する方法を発表。1960年にクラフが「有限要素」と名付ける。
          - year: "1963"
            title: Sketchpad
            body: アイバン・サザランドがコンピュータの画面上で図形を直接描いて操作するシステムをつくる。CADの原点とされる。
          - year: "1976"
            title: 実体関連モデル
            body: ピーター・チェンがデータどうしの関係を表すERモデルを発表する。
          - year: "1997"
            title: UML
            body: ソフトウェアの設計を描く共通の言語が標準になる。
          - year: 2002ごろ
            title: デジタルツインの構想
            body: マイケル・グリーブスが、実物と対になる仮想のモデルを製品の一生を通じて使う考え方を示す。
  - kind: now
    heading: コンピュータの中で、先に完成させる
    blocks:
      - type: p
        text: |-
          いまの設計では、コンピュータの中のモデルが中心的な役割を担っています。3次元CADで形をつくり、そのまま構造や流れ、熱のシミュレーション（CAE）にかけて、試作の前に性能を確かめるのが当たり前になりました。自動車の衝突試験も、実車で行う前に、コンピュータの上で何度も繰り返されています。
      - type: p
        text: |-
          宇宙機や自動車のような複雑なシステムの開発では、要求、構造、振る舞いをひとつのモデルにまとめて管理するモデルベースシステムズエンジニアリング（MBSE）が広がっています。そのための言語 SysML は2007年に最初の版が標準化され、大きく作り直された第2版（SysML v2）も2025年に正式な標準として採択されました。
      - type: p
        text: |-
          実物の製品や工場から集めたデータでモデルを更新し続け、現実と並んで動かすデジタルツインも、製造業や都市計画で使われ始めています。モデルが[[data-analysis]]と結びつくことで、設計は「つくって終わり」ではなく、使われながら改善され続けるものになりつつあります。
      - type: illustration
        id: MD-02
        ratio: "16:9"
        caption: 1901年、ライト兄弟は小さな風洞の中で、翼の形を一つずつ試した。
        alt: 木の箱の形をした細長い風洞と、その中に並べられた小さな金属の翼の模型、手前に記録をつける人の手を描いた絵
  - kind: activity
    heading: モデルは、議論の共通言語
    blocks:
      - type: p
        text: |-
          設計会では、テーマの性質に合わせてモデルを使い分けます。アプリやサービスの設計ではIDEF0やER図で機能やデータの関係を整理し、ものの設計では、スケッチや三面図から始めて、必要に応じてCADやCAEで性能を確かめます。
      - type: p
        text: |-
          考えたことを発表するときも、モデルが議論の共通言語になります。言葉だけでは「なんとなく良さそう」で終わってしまう案も、図や数値で示せば、具体的な質問や反論が返ってきます。そのやりとりが、モデルをさらに磨いていくのです。
references:
  - text: G. E. P. Box, "Science and Statistics", Journal of the American Statistical Association, 71(356), pp.791–799, 1976.
    url: https://doi.org/10.1080/01621459.1976.10480949
  - text: NASA, Mars Climate Orbiter Mishap Investigation Board Phase I Report, 1999.
  - text: M. J. Turner, R. W. Clough, H. C. Martin, L. J. Topp, "Stiffness and Deflection Analysis of Complex Structures", Journal of the Aeronautical Sciences, 23(9), 1956.
  - text: 'I. E. Sutherland, "Sketchpad: A Man-Machine Graphical Communication System", MIT, 1963.'
  - text: P. P. Chen, "The Entity-Relationship Model — Toward a Unified View of Data", ACM Transactions on Database Systems, 1(1), 1976.
    url: https://doi.org/10.1145/320434.320440
  - text: Object Management Group, Unified Modeling Language (UML) / Systems Modeling Language (SysML).
    url: https://www.omg.org/
  - text: FIPS PUB 183, Integration Definition for Function Modeling (IDEF0), 1993.
