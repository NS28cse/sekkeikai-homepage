title: 問題を見つける
en: Problem Finding
layer: step
order: 1
stepName: 問題発見
mode: diverge
tools: 観察・インタビュー・KJ法
short: 問題を見つける
question: 本当に解くべき問題は何か
summary: 解決策から始めず、誰が、どんな場面で、何に困っているのかを集めて、解くべき問題を一文にまとめる。
lead: 設計は、解決策からではなく問題から始まります。最初の工程では、使う人を観察し、話を聞き、集めた事実から「誰の、どんな困りごとを解くのか」を見つけます。
chapters:
  - id: why
    heading: 解決策から始めると、解く問題を間違える
    blocks:
      - type: point
        text: 「何をつくるか」の前に、「誰が、どんな場面で、何に困っているか」を確かめます。問題を取り違えると、その後の工程をどれだけ丁寧に進めても役に立ちません。
      - type: question
        text: 部室の予約が取り合いになっている。すぐに「予約アプリをつくろう」と決めてよいでしょうか？
        answer: まだ早いかもしれません。取り合いの本当の理由が「誰がいつ使うのかわからないこと」や「使い方の決まりがないこと」なら、アプリをつくっても解決しません。
      - type: p
        text: いきなり「こんなものをつくろう」と考え始めると、そもそも解くべきでない問題を、見事に解いてしまうことがあります。最初の工程では、誰が、どんな場面で、何に困っているのかを、先入観をできるだけ持たずに集めます。
      - type: example
        title: 実際にあった例：握りやすい台所道具
        text: 1990年に発売されたOXOの台所道具「Good Grips」は、関節炎で手が痛む人が、金属の細い柄のピーラーを使いにくそうにしている姿から生まれました。開発チームは関節炎の人や料理人に話を聞き、太くて滑りにくい柄を設計しました。問題を「ピーラーの性能」ではなく「握る手」に見つけたことが、誰にとっても使いやすい道具につながりました。
      - type: p
        text: 手がかりは現場にあります。使っている人を観察し、話を聞き、今ある記録や数字を眺める。言葉にされない不満は、行動を見てはじめてわかることも多いのです。観察と聞き取りの方法は[[human-interface]]、記録の読み方は[[data-analysis]]のページで詳しく紹介しています。
        note: OXO の開発の経緯は、Cooper Hewitt（スミソニアン・デザイン博物館）の解説による。創業者の妻が関節炎だったことがきっかけとされる。

  - id: kj
    heading: 集めた事実は、分類の枠を決めずに並べる
    blocks:
      - type: point
        text: 集めた事実はカードに書き、似たものどうしを集めて名前を付けます。最初から枠を決めないので、予想していなかった問題の形が見えてきます。
      - type: p
        text: 集めた事実を整理するには、文化人類学者の川喜田二郎が考案した**KJ法**が役立ちます。一つの事実を一枚のカードに書き、似たものを集めて名前（表札）を付け、集まりどうしの関係を図にして、最後に文章にまとめます。
        note: 川喜田二郎『発想法 ― 創造性開発のために』中公新書, 1967年。
      - type: figure
        name: kj-method

  - id: statement
    heading: 問題を、一文にまとめる
    blocks:
      - type: point
        text: 見えてきた問題は「誰の、どんな困りごとを、なぜ解くのか」という一文にまとめます。この一文が、次の工程で迷ったときの拠りどころになります。
      - type: p
        text: 一文にまとめるときは、解決策を書かないのがこつです。「予約アプリがない」ではなく「部員が、部室が空いているかを前もって確かめられない」と書けば、アプリ以外の解き方も考えられます。
      - type: p
        text: 架空の、しかし具体的な一人の利用者像（**ペルソナ**）を立てておくのも有効です。「週に2回、授業の合間に部室で作業する2年生」のように決めておくと、「この人は困るだろうか」と具体的に考えられます。
      - type: example
        title: 部室の予約なら（架空の例）
        text: 部員に話を聞き、部室の前や連絡の様子を観察すると、問題は予約の手段より「空いているかどうか、行ってみるまでわからないこと」にありました。一文にまとめると「部員が、部室の空き状況を前もって確かめられない」。

references:
  - text: 川喜田二郎『発想法 ― 創造性開発のために』中公新書, 1967年.
  - text: Cooper Hewitt, Smithsonian Design Museum, "OXO Good Grips".
    url: https://www.cooperhewitt.org/?p=17575
related:
  - requirements
  - human-interface
  - data-analysis
