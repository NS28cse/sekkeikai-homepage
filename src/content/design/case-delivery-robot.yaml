title: 飲み物を運ぶロボット
en: "Case: Delivery Robot"
layer: case
order: 2
short: 例：ロボットの設計
question: ロボットに任せること、人に残すことは何か
summary: 介護施設で、お茶の時間に飲み物を運ぶロボットを設計する例。五つの工程を順にたどり、つくる前の仕様書をまとめるまで。
lead: 設計会の「設計の場」で、ものの設計がどう進むかを示すために、説明用につくった架空の例です（施設や人数、数字も架空のものです）。テーマは「介護施設のお茶の時間を楽にするロボット」。設計会が扱うのは、実際につくる手前、仕様書ができるところまでです。
chapters:
  - id: overview
    heading: この例の流れ
    blocks:
      - type: point
        text: 「ロボットをつくる」から始めず、お茶の時間に誰が何に困っているかから始めます。考えた結果、ロボットに任せることと、人に残すことを分けた設計になりました。
      - type: table
        caption: 工程ごとに、やったこととできたもの
        head:
          - 工程
          - やったこと
          - できたもの
        rows:
          - - ①問題を見つける
            - お茶の時間を観察し、職員に話を聞いた
            - 問題の一文
          - - ②要件を定める
            - 運ぶ量、速さ、安全を数で決めた
            - 要件の表、IDEF0の図
          - - ③案を広げる
            - ロボット以外の案も並べた
            - 六つの案
          - - ④比べて選ぶ
            - 安全と取り違えの防ぎやすさを重く見た
            - 比較の表、選んだ理由
          - - ⑤形を詰める
            - 段ボールで高さを試した
            - 仕様書、試験の計画

  - id: problem
    step: 1
    heading: 職員は、運ぶことに追われていた
    blocks:
      - type: point
        text: 困っていたのは「運ぶのが重い」ことではなく、運ぶ移動に追われて、利用者と話す時間が取れないことでした。
      - type: p
        text: 施設の協力を得て、午後のお茶の時間（30分）を2回観察し、職員3人に話を聞いた、という想定です。職員は台所と食堂を何度も往復していて、利用者に声をかけられても、立ち止まって話す余裕がありませんでした。
      - type: example
        title: 問題の一文
        text: 「職員が、お茶の時間に飲み物を運ぶ移動に追われて、利用者と話す時間を取れない」。ここで「重いものを運ぶのが大変」と書いていたら、力の強いロボットを考えることになり、話す時間は増えなかったかもしれません。

  - id: requirements
    step: 2
    heading: 運ぶ量、速さ、安全を数で決める
    blocks:
      - type: point
        text: 安全に関わる要件は「なくてはならない」に入れ、確かめ方まで決めます。図にしてみると、「誰に何を渡すか」という決まりの大切さが見えてきました。
      - type: idef0
        title: 「飲み物を届ける」をIDEF0で描く
        caption: 上から入る「利用者ごとの注意事項」（とろみが必要な人、温度に気をつける人など）が、最後の「受け取ってもらう」に効いてくる。ここを見落とすと、取り違えの事故につながる。
        function: 飲み物を利用者に届ける
        inputs:
          - 用意された飲み物
        controls:
          - 施設の安全の決まり
          - 利用者ごとの注意事項
        outputs:
          - 受け取られた飲み物
          - 届けた記録
        mechanisms:
          - 職員
          - 運ぶ道具（未定）
        steps:
          - name: 飲み物を載せる
            output: 載せた飲み物
          - name: 席まで運ぶ
            output: 席に着いた飲み物
          - name: 受け取ってもらう
            output: 受け取られた飲み物
      - type: table
        caption: 運ぶロボットの要件（架空の例）
        head:
          - 要件
          - 種類
          - 確かめ方
        rows:
          - - 一度に6杯を運べる
            - なくてはならない
            - 6杯を載せて10往復する
          - - 人の歩く速さより遅く動く
            - なくてはならない（安全）
            - 速さを測る
          - - 人や車いすの前で止まる
            - なくてはならない（安全）
            - 決めた距離で止まるかを試す
          - - 飲み物を取り違えない
            - なくてはならない（安全）
            - 渡す手順を見直す
          - - 車いすに座ったまま取れる高さ
            - なくてはならない
            - 車いすの利用者に試してもらう
          - - 職員が説明なしで使える
            - なくてはならない
            - 初めての職員3人に使ってもらう
          - - 近づくと音で知らせる
            - あればうれしい
            - 利用者に聞く
      - type: p
        text: 安全の要件を考えるときは、生活を支えるロボットの安全の国際規格も手がかりになります。
        note: 生活支援ロボットの安全の規格 [ISO 13482](https://www.iso.org/standard/53820.html)（日本ではJIS B 8445）。人のそばで動くロボットの危険の洗い出し方と、減らし方を定めている。

  - id: ideas
    step: 3
    heading: ロボット以外の案も並べる
    blocks:
      - type: point
        text: テーマが「ロボット」でも、要件を満たすならロボットでない案もありえます。比べる相手がいてはじめて、ロボットを選ぶ理由が言えます。
      - type: list
        items:
          - 決めた席まで、自分で走って届けるロボット
          - 職員の後ろを、ついて歩くロボット
          - 押すのが軽い、改良したワゴン
          - 各テーブルにポットを置き、利用者が自分で注ぐ
          - 台所を食堂の近くに移す（動線を変える）
          - 天井のレールで運ぶ仕組み

  - id: selection
    step: 4
    heading: 運ぶのはロボット、手渡すのは人
    blocks:
      - type: point
        text: 取り違えを防ぐには、最後に渡すところに人がいるほうが確かでした。そこで「ついて歩くロボット」を選び、運ぶ仕事だけを任せることにしました。職員はロボットの速さに合わせて歩き、両手が空くので、利用者の隣で話しながら手渡せます。
      - type: table
        caption: 案を、ピューの概念選定法で比べる（基準の案は「今のワゴン」）
        head:
          - 基準
          - 自分で走るロボット
          - ついて歩くロボット
          - テーブルにポット
        rows:
          - - 利用者と話す時間が取れる
            - ＋
            - ＋
            - ＋
          - - 人や車いすにぶつからない
            - －
            - S
            - S
          - - 飲み物を取り違えない
            - －
            - S
            - －
          - - 職員が説明なしで使える
            - －
            - S
            - ＋
          - - 費用
            - －
            - －
            - ＋
          - - 合計
            - "−3"
            - "0"
            - "+2"
      - type: p
        text: 合計の点だけなら「テーブルにポット」がいちばんでした。けれど、とろみが必要な人に普通のお茶が渡るおそれがあり、安全の要件を満たせません。なくてはならない要件を満たさない案は、点が高くても選べない。点数は判断を助ける道具で、判断そのものではないのです。

  - id: detail
    step: 5
    heading: 高さ、幅、速さを決め、段ボールで試す
    blocks:
      - type: point
        text: 寸法と数字を決め、段ボールの模型で試してから仕様書にします。試した結果、トレーの高さを5cm下げました。
      - type: table
        caption: 仕様書の主な数字（架空の例）
        head:
          - 項目
          - 決めた値
          - 理由
        rows:
          - - 幅
            - 50cm以下
            - 廊下で車いすとすれ違えるように
          - - トレーの高さ
            - 70cm（試作前は75cm）
            - 車いすに座ったまま取れるように
          - - 速さ
            - 秒速0.8m以下
            - 職員の歩く速さより遅くし、人の50cm手前で確実に止まれるように
          - - 止まる距離
            - 人の50cm手前
            - 近づかれた人が驚かないように
          - - 動ける時間
            - 4時間
            - 午前と午後のお茶の時間をまかなうため
          - - 非常停止
            - 上面に大きなボタン
            - 誰でもすぐ止められるように
      - type: figure
        name: robot-dimensions
      - type: p
        text: 段ボールでトレーの高さを再現し、車いすの利用者3人に飲み物を取ってもらうと、75cmでは腕を高く上げる人がいました。そこで70cmに下げました。図面の上の数字は、人に試してもらってはじめて確かになります。
      - type: p
        text: 仕様書には、数字だけでなく、どの要件をどの試験で確かめるかの計画も付けます。設計会の活動はここまでですが、実際につくる人がこの仕様書を受け取れば、なぜこの数字なのかを迷わずに読み取れます。

  - id: outputs
    heading: この例でできたもの
    blocks:
      - type: point
        text: 問題の一文、IDEF0の図、要件の表、案の比較の表、寸法と理由をまとめた仕様書、試験の計画。ロボットに任せることと、人に残すことを分けたのが、この設計のいちばんの判断です。
      - type: link
        label: 工程4「比べて選ぶ」を詳しく読む
        href: /design/selection/

