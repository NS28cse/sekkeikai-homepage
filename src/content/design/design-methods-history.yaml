title: 設計の方法の歴史
en: History of Design Methods
layer: topic
order: 1
short: 設計の方法の歴史
question: 設計の進め方は、いつ、誰が方法にしたのか
summary: 設計の進め方そのものを研究し、方法としてまとめる試みは、20世紀の半ばから大きく進んだ。工程のページで紹介した手法が生まれた順に並べる。
lead: 工程のページで紹介した手法には、それぞれ生まれた時代と、考えた人がいます。設計の進め方そのものを研究し、誰でも使える方法にまとめる試みは、20世紀の半ばから大きく進みました。
chapters:
  - id: why
    heading: 一人の勘では、設計しきれなくなった
    blocks:
      - type: question
        text: 設計の進め方には、昔から決まった手順があったのでしょうか？
        answer: いいえ。長いあいだ、設計は親方から弟子へ、やりながら身につけるものでした。進め方を書き出し、誰でも使える方法にしようとする動きが大きく進んだのは、1960年代のことです。
      - type: point
        text: ものやシステムが大きく複雑になり、一人の勘と経験では設計しきれなくなりました。そこで、設計の進め方を書き出し、教えられる「方法」にしようとする動きが生まれました。
      - type: p
        text: |-
          戦後、航空機や宇宙開発のような巨大なシステムを、何千人もの技術者で設計するようになりました。設計も、勘と経験だけでなく、手順として書き出せるのではないか。そう考える人たちが現れました。
      - type: p
        text: |-
          1962年9月、ロンドンのインペリアル・カレッジで「設計方法会議（Conference on Design Methods）」が開かれました。建築、機械、工業デザインなど、分野の違う人たちが集まり、設計の進め方そのものを研究の対象として論じました。設計の方法を一つの分野として扱った、最初の会議とされています。この会議の委員会が中心となって、1966年に英国のデザイン・リサーチ・ソサエティが生まれました。
        note: |-
          J. C. Jones & D. G. Thornley (eds.), Conference on Design Methods, Pergamon Press, 1963。会議は1962年9月19〜21日に開かれた。
      - type: p
        text: |-
          一方で、方法への期待が大きすぎたことへの反省も、早くから出ました。この流れの中心にいた建築家クリストファー・アレグザンダーは、1971年に、設計の方法を設計の実践から切り離して研究することを強く批判し、距離を置きました。そこから、手順で設計を置き換えるのではなく、設計する人が考えるのを助ける道具として方法を使う、という見方が広がっていきます。
        note: |-
          C. Alexander, Notes on the Synthesis of Form, ペーパーバック版の序文, 1971。同じ年の雑誌のインタビューでも、設計の方法の研究を「忘れてしまえ」と語った。N. Cross, "Designerly Ways of Knowing", Design Studies, 3(4), 1982 も参照。
      - type: p
        text: |-
          設計会が工程ごとに手法を学ぶのも、手法に設計を任せるためではありません。手法は、考え落としを防ぎ、考えたことをほかの人に見せて話し合うための道具です。

  - id: timeline
    heading: 設計を「方法」にした人たち
    blocks:
      - type: point
        text: 設計の手法の多くは、1950年代から1990年代にかけて生まれました。日本で生まれた手法（KJ法、品質機能展開、狩野モデル、一般設計学）も少なくありません。
      - type: figure
        name: methods-timeline
      - type: heading
        text: 1970年代まで：手法が次々に生まれる
      - type: timeline
        items:
          - year: 紀元前1世紀
            title: 強・用・美
            body: ウィトルウィウスが、建築が備えるべき条件として丈夫さ、使いやすさ、美しさを挙げる。
          - year: "1953"
            title: ブレインストーミング
            body: アレックス・オズボーンが著書『Applied Imagination』で、批判をしない発想会議の方法を広める。
          - year: "1962"
            title: 設計方法会議
            body: ロンドンで、設計の進め方そのものを論じる会議が開かれる。設計の方法の研究の始まりとされる。
          - year: "1964"
            title: 『形の合成に関するノート』
            body: 建築家クリストファー・アレグザンダーが、設計の問題を要素に分けて形を導く方法を論じる。
          - year: "1966"
            title: 品質機能展開の源流
            body: 赤尾洋二が、使う人の求める品質を設計に展開する考え方を提唱する。
          - year: "1966"
            title: 形態分析
            body: 天文学者フリッツ・ツビッキーが、要素ごとの選択肢を表に並べ、その組み合わせで案を広げる方法を著書にまとめる。ジェット推進の研究などで使っていた方法。
          - year: "1967"
            title: KJ法
            body: 川喜田二郎が『発想法』で、集めた事実から構造を見つける方法を紹介する。
          - year: "1969"
            title: 『システムの科学』
            body: ハーバート・サイモンが、設計を「どうあるべきか」を扱う独自の知として論じる（原題The Sciences of the Artificial）。
          - year: "1970"
            title: 『Design Methods』
            body: ジョン・クリストファー・ジョーンズが、設計の手法を集めて、使う場面ごとに整理する。
          - year: "1971"
            title: SCAMPER
            body: ボブ・エバールが、オズボーンの発想のチェックリストをもとに、「置き換える」「組み合わせる」など七つの問いかけにまとめる。もとは子どもの想像力を育てる本。
          - year: "1973"
            title: 厄介な問題
            body: リッテルとウェバーが、設計や計画が扱う問題の特殊な性質を指摘する。
          - year: "1977"
            title: 工学設計の体系化
            body: パールとバイツが、設計を段階に分けて進める手順をまとめる。
          - year: 1977〜1980
            title: 階層分析法（AHP）
            body: トーマス・サーティが、一対比較から重みを求める方法を発表する。
          - year: "1979"
            title: 一般設計学
            body: 吉川弘之が、設計を「機能の空間から属性の空間への写像」として数学の言葉で捉える理論を発表する。
      - type: heading
        text: 1980年代から：つなぐ、そろえる、人に合わせる
      - type: timeline
        items:
          - year: "1981"
            title: IDEF0
            body: 米空軍のICAM計画で、機能を箱と矢印で描く方法の手引きがまとめられる。1993年には米国の連邦の標準になる。
          - year: "1981"
            title: ピューの概念選定法
            body: スチュアート・ピューが、案を基準ごとに比べて選ぶ方法を発表する。
          - year: "1983"
            title: 省察的実践
            body: ドナルド・ショーンが、設計する人が状況と対話しながら考える姿を描く。
          - year: "1984"
            title: 狩野モデル
            body: 狩野紀昭らが、要求の性格を見分けるモデルを発表する。
          - year: "1990"
            title: 公理的設計
            body: ナム・P・スーが、「要求機能どうしの独立を保つ」などの公理で設計のよしあしを判断する方法をまとめる。
          - year: "1995"
            title: セットベース設計
            body: トヨタの開発の研究から、いくつかの案を並べて絞り込む進め方が注目される。
          - year: "1999"
            title: ISO 13407
            body: 使う人を中心に置いた設計（人間中心設計）の進め方が、国際規格になる。2010年からはISO 9241-210に引き継がれる。
          - year: 2005ごろ
            title: ダブルダイヤモンド
            body: 英国デザイン・カウンシルが、広げると絞るを二度繰り返す進め方を図で示す。

