title: 設計のプロセス
en: Design Process
layer: process
order: 1
short: 工程で進める
question: 問いから設計解まで、どう進むか
summary: 問題を見つけ、要件を定め、案を広げ、比べて選び、形を詰める。設計は5つの工程で進み、行き来しながら確かになっていく。
lead: 設計は、ひらめきを一度で形にする作業ではありません。解くべき問題を見つけ、満たすべき条件を言葉にし、たくさんの案から根拠をもって選び、細部を詰めていく。このページでは、その5つの工程と、工程ごとに使う手法を紹介します。
hero:
  id: PR-01
  ratio: "21:9"
  caption: 問いから設計解へ。道は一本ではなく、ときに引き返す。
  alt: 左端の「？」から右端の設計図まで、5つの地点を通る道が描かれ、ところどころに前の地点へ戻る小道がある地図風の絵
chapters:
  - id: basics
    heading: 設計は、5つの工程で進む
    blocks:
      - type: point
        text: 設計は「問題を見つける→要件を定める→案を広げる→比べて選ぶ→形を詰める」の5つの工程で進みます。広げる工程と絞る工程を交互にくり返し、ときには前の工程に戻ります。
      - type: p
        text: |-
          経済学者であり認知科学の開拓者でもあったハーバート・サイモンは、いまの状態をより好ましい状態に変えようとして行為の道筋を考える人は、だれもが設計をしているのだと述べました。設計とは、まだ無いものについて「どうあるべきか」を考える営みです。
        note: |-
          Herbert A. Simon, The Sciences of the Artificial, MIT Press, 1969（第3版 1996）。邦訳『システムの科学』。
      - type: p
        text: |-
          その営みは、おおまかに次の5つの工程で進みます。ドイツのパールとバイツが体系化した工学設計の手順や、英国デザイン・カウンシルのダブルダイヤモンドなど、設計の進め方を示したモデルは数多くありますが、多くは同じ骨格を持っています。
        note: |-
          G. Pahl & W. Beitz, Konstruktionslehre, Springer, 1977（英語版 Engineering Design, 1984）。課題の明確化・概念設計・実体設計・詳細設計の段階を示した。
      - type: figure
        name: design-process
      - type: p
        text: |-
          工程には、考えを**広げる**ものと**絞る**ものがあります。問題を見つけるときと案を考えるときは、評価をあとまわしにして、できるだけ多くの可能性を出す。要件を定めるときと案を選ぶときは、根拠をもって絞り込む。この切り替えを意識することが、よい設計への近道です。
      - type: figure
        name: double-diamond
      - type: p
        text: |-
          ただし、工程は一方通行ではありません。1973年、リッテルとウェバーは、設計や計画が扱う問題の多くは、問題をどう定義するかに解き方が含まれてしまう「厄介な問題」だと指摘しました。案を考えてはじめて、要件の見落としに気づくことはよくあります。そのときは迷わず前の工程に戻ります。
        note: |-
          H. W. J. Rittel & M. M. Webber, "Dilemmas in a General Theory of Planning", Policy Sciences, 4(2), 1973。D. A. Schön, The Reflective Practitioner, 1983 も、設計者が状況と「対話」しながら問題の捉え方を組み替えていく姿を描いた。
      - type: p
        text: |-
          それでも、早い工程で考え抜く価値は大きいのです。NASAの見積もりでは、要求の段階で紛れ込んだ誤りを直すコストは、運用に入ってから気づいた場合、要求の段階で直す場合の29倍から1500倍以上になります。
        note: |-
          J. M. Stecklein ほか, "Error Cost Escalation Through the Project Life Cycle", NASA Johnson Space Center, 2004。
      - type: figure
        name: cost-escalation
      - type: p
        text: |-
          そして、どの工程でも「[[modeling|モデルで考える]]」「[[human-interface|人から考える]]」「[[data-analysis|データで考える]]」といった視点が必要になります。視点は、それぞれのページで詳しく解説しています。
      - type: example
        title: このページで追いかける例
        text: このページでは「部室の使い方がぶつかって困っている」という身近な問題を例に、5つの工程を順にたどります。各工程の最後に、例がどう進んだかを書いています。

  - heading: 問題を見つける
    step: 問題発見
    blocks:
      - type: point
        text: 解決策から始めない。誰が、どんな場面で、何に困っているのかを、先入観なく集めることから始めます。
      - type: question
        text: 部室の予約が取り合いになっている。すぐに「予約アプリをつくろう」と決めてよいでしょうか？
        answer: まだ早いかもしれません。取り合いの本当の理由が、予約の手段ではなく「誰がいつ使うのか分からないこと」や「使い方のルールが無いこと」なら、アプリをつくっても解決しません。
      - type: p
        text: |-
          設計は、解決策からではなく、問題から始まります。いきなり「こんなものをつくろう」と考え始めると、そもそも解くべきでない問題を、見事に解いてしまうことがあります。最初の工程では、誰が、どんな場面で、何に困っているのかを、できるだけ広く、先入観なく集めます。
      - type: p
        text: |-
          手がかりは現場にあります。使っている人を観察し、話を聞き、いまある記録や数字を眺める。言葉にされない不満は、行動を見てはじめてわかることも多いのです。詳しくは[[human-interface]]と[[data-analysis]]のページを見てください。
      - type: p
        text: |-
          集めた事実を整理するには、文化人類学者の川喜田二郎が考案した**KJ法**が役立ちます。一つの事実を一枚のカードに書き、似たものを集めて名前を付け、集まりどうしの関係を図にして、最後に文章にまとめる。最初から分類の枠を決めないことで、予想していなかった問題の構造が見えてきます。
        note: |-
          川喜田二郎『発想法 ― 創造性開発のために』中公新書, 1967年。
      - type: figure
        name: kj-method
      - type: illustration
        id: PR-04
        ratio: "16:9"
        caption: 壁一面のカードから、まだ名前のない構造を探す。
        alt: 壁に貼られたたくさんのカードを数人が囲み、似たカードを寄せて線で囲み、小さな札で名前を付けている様子の絵
      - type: p
        text: |-
          見えてきた問題は、「誰の、どんな困りごとを、なぜ解くのか」という一文にまとめます。架空の、しかし具体的な一人の利用者像（**ペルソナ**）を立てておくと、次の工程で迷ったときの拠りどころになります。
      - type: example
        title: 部室の予約なら
        text: 部員に話を聞き、部室の前や連絡の様子を観察すると、問題は「予約の手段」より「空いているかどうか、行ってみるまで分からないこと」にあるとわかりました。一文にまとめると「部員が、部室の空き状況を前もって確かめられない」。

  - heading: 要件を定める
    step: 要件定義
    blocks:
      - type: point
        text: 人の願い（要求）を、設計が満たすべき確かめられる条件（要件）に書き直します。要件は、完成したものを評価する物差しにもなります。
      - type: illustration
        id: PR-02
        ratio: "16:9"
        caption: 願いは、人から人へ伝わるうちに少しずつ形を変える。
        alt: 依頼者の吹き出しの中の「ほしいもの」が、聞き手、設計者、製作者へと伝わるたびに少しずつ違う形に変わっていく様子を一枚に描いた絵
      - type: p
        text: |-
          「使いやすいアプリがほしい」「丈夫な椅子がほしい」。人の願い（**要求**）は、たいてい曖昧です。「使いやすい」とは、誰にとって、どんな場面で、どの程度のことなのか。それが決まらない限り、設計者は何を目指せばよいかわからず、完成したものの良し悪しも判定できません。
      - type: p
        text: |-
          そこでこの工程では、要求を、設計が満たすべき確かめられる条件（**要件**）に書き直します。まず目的を確かめ、次に「何ができればよいか」（機能要求）と「どれくらいうまく」（非機能要求）を挙げ、守るべき制約を整理し、最後に数値や条件で表した仕様に落とし込みます。国際規格 ISO/IEC/IEEE 29148 は、よい要件の条件として、必要であること、曖昧でないこと、検証できること、実現できることなどを挙げています。
        note: |-
          ISO/IEC/IEEE 29148:2018, Systems and software engineering — Life cycle processes — Requirements engineering。
      - type: figure
        name: requirements-layers
      - type: p
        text: |-
          要件は、設計を評価する物差しそのものです。ソフトウェア工学のバリー・ベームは、「製品を正しくつくっているか」（検証）と「正しい製品をつくっているか」（妥当性確認）を区別しました。どれほど精密に設計しても、要件そのものが間違っていれば、できあがるのは「正しくつくられた、間違った製品」です。下のV字モデルは、左側で決めたことが、右側の試験でそれぞれ確かめられる関係を表しています。
        note: |-
          B. W. Boehm, "Verifying and Validating Software Requirements and Design Specifications", IEEE Software, 1(1), 1984。
      - type: figure
        name: v-model
      - type: p
        text: |-
          要求の性格を見極める道具として、日本で生まれた**狩野モデル**がよく使われます。満たされて当然で欠けると強い不満を生む「当たり前品質」、満たすほど満足が増す「一元的品質」、なくても不満はないがあると喜ばれる「魅力的品質」。どの要求に力を注ぐべきかを考える手がかりになります。
        note: |-
          狩野紀昭・瀬楽信彦・高橋文夫・辻新一「魅力的品質と当り前品質」『品質』14巻2号, 1984年。
      - type: figure
        name: kano-model
      - type: illustration
        id: PR-03
        ratio: "16:9"
        caption: 一つの製品の中に、性格の違う要求が同居している。
        alt: 一台の自転車を中心に、「ブレーキが効く」（当たり前）、「軽い」（一元的）、「ライトが自動で点く」（魅力的）という三つの要求が、色分けされた吹き出しで示されている絵
      - type: p
        text: |-
          要求を設計の特性に結びつける方法としては、**品質機能展開（QFD）**もあります。使い手の声を表の行に、製品の技術的な特性を列に並べ、どの特性がどの要求に効くのかを一覧にします。1960年代後半から1970年代にかけて、日本で赤尾洋二や水野滋らによって体系化されました。
        note: |-
          赤尾洋二が1966年に提唱し、1972年に三菱重工業神戸造船所で「品質表」がつくられたことが知られる。水野滋・赤尾洋二編『品質機能展開』日科技連出版社, 1978年。
      - type: example
        title: 部室の予約なら
        text: 「スマホから3操作以内で予約できる」「同じ時間帯の重複は0件」「費用は0円」のように、確かめられる形にしました。なくてはならない要件と、あればうれしい要件（予約の前日に通知が来る、など）も分けました。

  - heading: 案を広げる
    step: 構想設計
    blocks:
      - type: point
        text: 要件を満たす案を、できるだけ多く、違った方向に考えます。最初の思いつきで決めないことが、設計の天井を上げます。
      - type: p
        text: |-
          要件が定まったら、それを満たす案をできるだけ多く、できるだけ違った方向に考えます。最初に思いついた案の延長線上でしか考えないと、その後どれだけ丁寧に設計しても、改善の幅は限られます。案の幅が、設計の天井を決めるのです。
      - type: steps
        ordered: false
        items:
          - title: ブレインストーミング
            body: 批判しない、自由奔放を歓迎する、質より量、他人の案に便乗する。広告会社のアレックス・オズボーンが考案した四つの規則で、短い時間に多くの案を出します。
          - title: ブレインライティング
            body: まず各自が黙って案を書き出し、それから紙を回して書き足します。話し合うより先に一人ずつ書くので、声の大きい人に流されにくい進め方です。
          - title: SCAMPER
            body: 置き換える、組み合わせる、応用する、修正する、他の使い道を考える、取り除く、逆にする。七つの問いを当てて、いまある案を変形させます。
          - title: スケッチと簡単な模型
            body: 頭の中の案を、紙や段ボールで手早く形にします。形にすると、言葉だけでは気づかなかった問題や可能性が見えてきます。
      - type: p
        text: |-
          ただし、ブレインストーミングには限界も指摘されています。グループで同時に話すと、発言を待つあいだに案を忘れたり、評価を気にして控えたりするため、同じ人数が一人ずつ考えた案を合わせた方が数が多くなる、という実験結果があります。まず各自で書き出してから共有するのは、そのためです。
        note: |-
          M. Diehl & W. Stroebe, "Productivity Loss in Brainstorming Groups", Journal of Personality and Social Psychology, 53(3), 1987。
      - type: p
        text: |-
          それでも、専門や経験の違う人が案を持ち寄ることには大きな意味があります。問題の捉え方そのものが変わることがあるからです。トヨタの製品開発を調べた研究者たちは、一つの案に早く決めず、複数の案を並行して検討し、根拠をもって少しずつ絞り込む進め方が、結果として開発を速く、確かにしていると報告しました。
        note: |-
          A. Ward ほか, "The Second Toyota Paradox", Sloan Management Review, 36(3), 1995。
      - type: example
        title: 部室の予約なら
        text: 専用の予約アプリをつくる案のほかに、「部室の前に紙の予約表を貼る」「曜日ごとに使う人を固定する」「無料の共有カレンダーを予約表にする」など、アプリをつくらない案も並べました。

  - heading: 比べて選ぶ
    step: 評価・選定
    blocks:
      - type: point
        text: 目的どうしがぶつかる中で、案を比べて一つを選びます。基準は案を見る前に決め、選んだ理由と選ばなかった理由を残します。
      - type: illustration
        id: PR-05
        ratio: "16:9"
        caption: 案を、物差しで量る。
        alt: 大きな天秤の両側に、形の違う椅子の模型が載り、天秤の柱に「価格」「重さ」「美しさ」と書かれた目盛り板が掛かっている絵
      - type: p
        text: |-
          たくさんの案から、一つを選びます。設計の目的は一つではなく、たいていぶつかり合います。軽くすれば高くなり、安くすれば重くなる。ほかの目的を犠牲にせずには、どの目的ももう改善できない案を「**パレート最適**」と呼びます。パレート最適な案はたいてい複数あり、その中からどれを選ぶかには、何をどれだけ大切にするかという価値の判断が要ります。
      - type: figure
        name: pareto-front
      - type: p
        text: |-
          その判断を、隠れた好みのままにせず、議論できる形にするのが評価の技法です。評価基準は、案を見る前に要件から決めるのが原則です。案を見てから決めると、好きな案に有利な基準を選びがちだからです。
      - type: steps
        ordered: false
        items:
          - title: ピューの概念選定法
            body: 基準となる案を一つ決め、ほかの案を基準ごとに「良い（＋）」「同じ（S）」「悪い（－）」で比べます。長所と短所を一覧でき、良いところを組み合わせた新しい案のきっかけにもなります。
          - title: 階層分析法（AHP）
            body: 基準どうしを二つずつ比べて「どちらがどれくらい大事か」を答え、そこから各基準の重みを計算します。判断の食い違いの度合いも数値で確かめられます。
          - title: 重み付きの評価
            body: 各案を基準ごとに採点し、重みを掛けて合計します。点差が小さいときは、重みを少し変えても順位が入れ替わらないか（感度分析）を確かめます。
          - title: 選んだ理由を残す
            body: 選んだ案だけでなく、選ばなかった案とその理由も記録します。条件が変わったときに、判断を見直せるからです。
      - type: figure
        name: ahp-example
      - type: p
        text: |-
          人の直感的な判断には、最初に見た数字に引きずられるといった偏りがあることが、心理学の研究で知られています。数値で評価する目的は、計算に判断を任せることではなく、どこで意見が分かれているのかを見えるようにし、議論を具体的にすることです。
        note: |-
          T. L. Saaty, The Analytic Hierarchy Process, McGraw-Hill, 1980。S. Pugh, Total Design, Addison-Wesley, 1991。A. Tversky & D. Kahneman, "Judgment under Uncertainty: Heuristics and Biases", Science, 185(4157), 1974。
      - type: p
        text: |-
          案は、数値だけでなく**構造**で比べることもできます。吉川弘之の一般設計学は、設計を、求められる「はたらき」の世界から、ものの「性質」の世界への写像として定式化しました。同じころ、マサチューセッツ工科大学のナム・P・スーは独自に公理的設計を研究し、「機能要求は互いに独立に保て」という公理を置きました。下の図の二つの蛇口は、その考え方で比べたものです。
        note: |-
          吉川弘之「一般設計学序説」『精密機械』45巻536号, 1979年。N. P. Suh, The Principles of Design, Oxford University Press, 1990（研究は1970年代の終わりから）。
      - type: illustration
        id: PR-06
        ratio: "21:9"
        caption: 同じ要求に、二つの答え。
        alt: 左に湯と水の二つのハンドルが付いた蛇口、右に一本のレバーを上下左右に動かす蛇口を並べ、それぞれのハンドルの動きを矢印で示した線画
      - type: figure
        name: design-mapping
      - type: example
        title: 部室の予約なら
        text: 「費用」「準備の手間」「重複の防ぎやすさ」「使い始めやすさ」で比べました。紙の予約表は手軽でも重複を防げず、専用アプリは費用と手間がかかりすぎる。選んだのは、無料の共有カレンダーを予約表として使う案でした。いちばん良い設計が「何もつくらないこと」になる場合もあるのです。

  - heading: 形を詰める
    step: 詳細設計
    blocks:
      - type: point
        text: 選んだ案を、実際につくれる形にします。寸法・材料・画面の細部を決め、図面と仕様書と判断の根拠を一式にまとめます。
      - type: p
        text: |-
          選んだ案を、実際につくれる形にします。寸法、材料、部品、画面の一つひとつの動き。ここでは、ものの性能を予測し、ばらつきに強くし、使う人が迷わないように細部を決めていきます。
      - type: p
        text: |-
          詳細設計は、おおむね次の順で進みます。
      - type: steps
        items:
          - title: 寸法と許容差を決める
            body: 大きさや厚さだけでなく、つくるときにどこまでずれてよいか（許容差）も決めます。ずれを見込まないと、部品どうしが組み合わさりません。
          - title: 材料と部品を選ぶ
            body: 強さ、重さ、価格、手に入りやすさを比べて選びます。ソフトウェアなら、使う技術やライブラリを選ぶのがこれにあたります。
          - title: 試作して確かめる
            body: 部分的な試作やシミュレーションで、性能と使いやすさが要件を満たすかを確かめます。満たさなければ、前の工程に戻ります。
          - title: 図面と仕様書にまとめる
            body: つくる人が迷わないよう、図面・仕様書・判断の根拠を一式にまとめます。
      - type: p
        text: |-
          形と性能を確かめるには、CADや構造のシミュレーション（CAE）といった[[modeling|モデル]]が欠かせません。条件の組み合わせを効率よく試すには、実験計画法や品質工学といった[[data-analysis|データ分析]]の手法が使えます。画面や操作の細部は、[[human-interface|ヒューマンインターフェース]]の原則に照らして詰めます。
      - type: p
        text: |-
          この工程の成果が**設計解**です。図面や仕様書だけでなく、「なぜこの形なのか」という判断の根拠までを一式としてまとめておくと、つくる人にも、あとから改良する人にも、設計の意図が正しく伝わります。
      - type: example
        title: 部室の予約なら
        text: 共有カレンダーへの予約の書き方（名前・用件・時間）、予約の締め切り、重なったときの決め方を一枚の仕様書にまとめました。何人かに試してもらって書き方を直してから、部全体で使い始めました。

  - id: now
    heading: 速く回し、確かにつなぐ
    blocks:
      - type: point
        text: 工程を短い周期で何度も回す進め方と、工程どうしのつながりを厳密に管理する進め方。分野に合わせて、二つの方向に進んでいます。
      - type: p
        text: |-
          ソフトウェアの世界では、すべての要件を最初に決めきるのではなく、小さくつくって使ってもらい、要件そのものを学びながら更新していく進め方が主流になりました。工程を一度だけ通るのではなく、短い周期で何度も回すのです。
      - type: p
        text: |-
          一方で、自動車や医療機器、宇宙機のように安全が重要な分野では、要件から設計、試験までのつながりを漏れなくたどれることが求められます。要件や構造をひとつのモデルで管理する方法も広がっています（[[modeling]]のページを参照）。
      - type: p
        text: |-
          コンピュータが数千、数万の案を自動で生み出すジェネレーティブデザインや、生成AIによる発想の支援も身近になりました。案が増えるほど、何を目的とし、何を大切にするのかという判断が、設計者に重く問われるようになっています。

  - id: club
    heading: 工程を意識して、一緒に考える
    blocks:
      - type: point
        text: 部員がテーマを持ち寄り、いまどの工程にいるのかを意識しながら、チームで考えます。
      - type: p
        text: |-
          設計会では、部員が持ち寄ったテーマを、チームでこの工程に沿って考えます。いま自分たちはどの工程にいて、広げるときなのか絞るときなのか。それを意識するだけで、議論は驚くほど進めやすくなります。
      - type: p
        text: |-
          問題を見つける工程ではKJ法でカードを並べ、要件を定める工程では狩野モデルで要求の性格を話し合い、案を選ぶ工程ではAHPやピューの選定法で根拠を数字にする。アンケートなどのデータは Deepnote で一緒に分析します。考えたことは発表し、違う視点から意見をもらって、また前の工程に戻ります。

  - id: history
    label: 寄り道：歴史
    heading: 設計を「方法」にした人たち
    blocks:
      - type: point
        text: 設計の進め方そのものを研究し、方法としてまとめる試みは、20世紀の半ばから大きく進みました。読み飛ばしても、このページの内容はわかります。
      - type: p
        text: |-
          設計の進め方そのものを研究し、方法としてまとめる試みは、20世紀の半ばから大きく進みました。
      - type: timeline
        items:
          - year: 紀元前1世紀
            title: 強・用・美
            body: ウィトルウィウスが、建築が備えるべき条件として丈夫さ、使いやすさ、美しさを挙げる。
          - year: "1953"
            title: ブレインストーミング
            body: アレックス・オズボーンが著書『Applied Imagination』で、批判をしない発想会議の方法を広める。
          - year: "1964"
            title: 『形の合成に関するノート』
            body: 建築家クリストファー・アレグザンダーが、設計の問題を要素に分けて形を導く方法を論じる。
          - year: "1966"
            title: 品質機能展開の源流
            body: 赤尾洋二が、使い手の求める品質を設計に展開する考え方を提唱する。
          - year: "1967"
            title: KJ法
            body: 川喜田二郎が『発想法』で、集めた事実から構造を見つける方法を紹介する。
          - year: "1969"
            title: 人工物の科学
            body: ハーバート・サイモンが、設計を「どうあるべきか」を扱う独自の知として論じる。
          - year: "1973"
            title: 厄介な問題
            body: リッテルとウェバーが、設計や計画が扱う問題の特殊な性質を指摘する。
          - year: "1977"
            title: 工学設計の体系化
            body: パールとバイツが、設計を段階に分けて進める手順をまとめる。
          - year: 1977〜1980
            title: 階層分析法（AHP）
            body: トーマス・サーティが、一対比較から重みを求める方法を発表する。
          - year: "1979"
            title: 一般設計学
            body: 吉川弘之が、設計を数学の言葉で捉える理論を発表する。
          - year: "1981"
            title: ピューの概念選定法
            body: スチュアート・ピューが、案を基準ごとに比べて選ぶ方法を発表する。
          - year: "1983"
            title: 省察的実践
            body: ドナルド・ショーンが、設計者が状況と対話しながら考える姿を描く。
          - year: "1984"
            title: 狩野モデル
            body: 狩野紀昭らが、要求の性格を見分けるモデルを発表する。
          - year: "1990"
            title: 公理的設計
            body: ナム・P・スーが、設計の良し悪しを公理で判断する方法をまとめる。
          - year: "1995"
            title: セットベース設計
            body: トヨタの開発の研究から、複数の案を並行して絞り込む進め方が注目される。
          - year: 2005ごろ
            title: ダブルダイヤモンド
            body: 英国デザイン・カウンシルが、発散と収束を二度くり返す進め方を図で示す。

