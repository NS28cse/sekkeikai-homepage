title: 設計のプロセス
en: Design Process
layer: process
order: 1
short: 工程で進める
question: 問題から設計の答えまで、どう進むか
summary: 問題を見つけ、要件を定め、案を広げ、比べて選び、形を詰める。設計は五つの工程を行き来しながら確かになっていく。
lead: 設計は、いくつもの工程を踏んで、答えを少しずつ確かにしていく作業です。解くべき問題を見つけ、満たすべき条件を言葉にし、たくさんの案から根拠をもって選び、細部を詰めていきます。このページでは、五つの工程の全体と、そのつながり方を紹介します。各工程の中身は、それぞれのページで詳しく書いています。
chapters:
  - id: overview
    heading: 設計は、五つの工程で進む
    blocks:
      - type: point
        text: 設計は「問題を見つける → 要件を定める → 案を広げる → 比べて選ぶ → 形を詰める」の五つの工程で進みます。
      - type: figure
        name: design-process
      - type: p
        text: 経済学者であり認知科学の開拓者でもあったハーバート・サイモンは、今の状態をより好ましい状態に変えようとして行動の道筋を考える人は、誰もが設計をしているのだと述べました。設計とは、まだないものについて「どうあるべきか」を考えることです。五つの工程は、その答えを確かめながら決めていく段取りです。
        note: "[H. A. Simon, The Sciences of the Artificial, MIT Press, 1969（第3版 1996）](https://ndlsearch.ndl.go.jp/books/R100000002-I000006331276)。邦訳[『システムの科学』](https://ndlsearch.ndl.go.jp/books/R100000002-I000002864619)。"

  - id: fields
    heading: 分野が違っても、骨格は共通
    blocks:
      - type: point
        text: 機械、ソフトウェア、建築、サービスでは、進め方の呼び方も区切り方も違います。けれど「問題 → 要件 → 案 → 選ぶ → 細部」という骨格は共通です。五つの工程は、その骨格に付けた名前です。
      - type: table
        caption: 分野ごとの呼び方（目安。区切りは分野によって重なる）
        head:
          - 分野
          - 問題を見つける
          - 要件を定める
          - 案を広げる・比べて選ぶ
          - 形を詰める
        rows:
          - - 機械（パールとバイツ）
            - 課題の明確化
            - 課題の明確化（要求リスト）
            - 構想設計
            - 実体設計・詳細設計
          - - ソフトウェア（共通フレーム2013など）
            - 企画
            - 要件定義
            - 方式設計（基本設計）
            - 詳細設計
          - - 建築（国土交通省の告示）
            - 企画・基本計画
            - 設計条件の整理
            - 基本設計（いくつもの方針案を検討）
            - 基本設計図書・実施設計
          - - サービス・UX（ダブルダイヤモンド）
            - 発見
            - 定義
            - 展開
            - 提供（小さく試して改良）
      - type: p
        text: 同じ「基本設計」という言葉でも、建築では実施設計の前に行う設計を、ソフトウェアでは画面や外から見た動きを決める設計を指すことが多く、中身が違います。ほかの学部の人と話すときは、言葉より「今、何を決めているのか」をそろえるのが近道です。
        note: 機械は[Pahl & Beitz, Konstruktionslehre（1977）](https://ci.nii.ac.jp/ncid/BA62999351)、建築は[令和6年国土交通省告示第8号](https://www.mlit.go.jp/jutakukentiku/build/jutakukentiku_house_tk_000082.html)、ソフトウェアは[IPA「共通フレーム2013」](https://www.ipa.go.jp/publish/secbooks20130304.html)による。ソフトウェアの「基本設計」「詳細設計」は、日本の現場での慣用の呼び方。

  - id: modes
    heading: 広げる工程と、絞る工程が交互に来る
    blocks:
      - type: point
        text: 問題を見つけるときと案を考えるときは、評価をあとまわしにして広げる。要件を定めるときと案を選ぶときは、根拠をもって絞る。今どちらなのかを意識すると、話し合いが進めやすくなります。
      - type: p
        text: 工程には、考えを**広げる**ものと**絞る**ものがあります。広げている最中によしあしを言い始めると、案の出る勢いが落ちます。絞る番になってまた広げ始めると、決めるのがいつまでも先送りになります。英国デザイン・カウンシルは、この切り替えを二つのひし形（ダブルダイヤモンド）で表しました。五つの工程を重ねると、工程1と2が左のひし形に、工程3から5が右のひし形に入ります。
      - type: figure
        name: steps-on-double-diamond
      - type: p
        text: どの工程も、終わりに形のあるものを一つ残し、それが次の工程の出発点になります。問題の一文、要件の表、案の一覧、選んだ案とその理由、仕様書です。要件の表は、左のひし形の答えであり、右のひし形で案を比べるときの物差しにもなります。

  - id: loop
    heading: 工程は、行き来しながら確かになる
    blocks:
      - type: point
        text: 案を考えてはじめて、要件の見落としに気づくことはよくあります。そのときは前の工程に戻ります。見落としは、早く見つけるほど小さな手間で直せます。
      - type: p
        text: 1973年、リッテルとウェバーは、設計や計画が扱う問題の多くは、問題をどう定義するかに解き方が含まれてしまう「厄介な問題（wicked problem）」だと指摘しました。問題と答えは、行き来しながら一緒に確かになっていくのです。
        note: '[H. W. J. Rittel & M. M. Webber, "Dilemmas in a General Theory of Planning", Policy Sciences, 4(2), 1973](https://doi.org/10.1007/BF01405730)。[D. A. Schön, The Reflective Practitioner, 1983](https://ndlsearch.ndl.go.jp/books/R100000136-I1970304959840662912) も、設計する人が状況と「対話」しながら問題の捉え方を組み替えていく姿を描いた。'
      - type: p
        text: ソフトウェアの世界では、小さくつくって使ってもらい、要件そのものを学びながら更新していく進め方が広く使われています。五つの工程を、短い周期で何度も回すのです。一方、自動車や医療機器のように安全が重要な分野では、要件から設計、試験までのつながりを漏れなくたどれること（トレーサビリティ）が求められます。
        note: 見落としを見つけるのが後の工程になるほど、直す手間は大きくなる。NASAの見積もりでは、要件の段階の誤りを運用の段階で直すと、数十倍から千倍以上の手間がかかる（[J. M. Stecklein ほか, "Error Cost Escalation Through the Project Life Cycle", NASA, 2004](https://ntrs.nasa.gov/citations/20100036670)）。
      - type: p
        text: 五つの工程の外にも、仕事があります。できたものが要件を満たすかを確かめる検証、建築や福祉用具での法令や安全規格の確認、イベントの当日の運営とふり返りです。分野によっては、これらも設計と同じくらい大切です。設計会では、仕様書の中に「どう確かめるか」まで書くことで、次につなげます。
        note: ドイツ技術者協会の指針 [VDI 2221](https://www.vdi.de/mitgliedschaft/vdi-richtlinien/details/vdi-2221-blatt-1-entwicklung-technischer-produkte-und-systeme-modell-der-produktentwicklung) は2019年の改訂で、決まった順番を示すのをやめ、どの製品開発にも通じる「活動」を定めて、並べ方は状況に応じて決める形にした。

  - id: examples
    heading: 例で、五つの工程をたどる
    blocks:
      - type: point
        text: 工程のページでは、架空の例として「部室の予約が取り合いになっている」という一つの問題を、五つの工程で順にたどります。もっと大きな例は、イベントとロボットの設計の流れのページにあります。
      - type: example
        title: 部室の予約が、五つの工程でどう進んだか
        text: 話を聞くと、問題は「空いているかが前もってわからないこと」だった（問題発見）。「スマートフォンから3操作以内」「重なりは0件」「費用は0円」と決めた（要件定義）。アプリ、紙の予約表、共有カレンダーなど九つの案を出し（発想）、比べて共有カレンダーを選んだ（評価・選定）。最後に、予約の書き方と決まりを仕様書にまとめた（詳細設計）。
      - type: link
        label: 工程1「問題を見つける」から読む
        href: /design/problem-finding/

  - id: club
    heading: 設計会では、今どの工程かを意識して話す
    blocks:
      - type: point
        text: 部員がテーマを持ち寄り、今どの工程にいるのかを確かめながら、チームで考えます。
      - type: p
        text: 問題を見つける工程ではKJ法でカードを並べ、要件を定める工程ではIDEF0で機能を図にし、案を選ぶ工程ではピューの概念選定法やAHPで判断の根拠を見えるようにします。アンケートなどのデータはDeepnoteで一緒に分析します。考えたことは発表し、違う視点から意見をもらい、必要なら前の工程に戻ります。

