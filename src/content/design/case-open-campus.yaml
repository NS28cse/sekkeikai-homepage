title: オープンキャンパスの体験コーナー
en: "Case: Open Campus"
layer: case
order: 1
short: 例：イベントの設計
question: 高校生が「来てよかった」と思える体験とは
summary: 情報工学部のオープンキャンパスで、高校生向けの体験コーナーを設計する例。五つの工程を順にたどり、運営の仕様書をつくるまで。
lead: 設計会の「設計の場」で、一つのテーマがどう進むかを示すために、説明用につくった架空の例です（去年の様子や人数、数字も架空のものです）。テーマは「オープンキャンパスで、高校生向けの体験コーナーを設計する」。五つの工程で、何を考え、何ができあがるのかをたどります。
chapters:
  - id: overview
    heading: この例の流れ
    blocks:
      - type: point
        text: 「体験コーナーで何をやるか」から考え始めず、去年の来場者が何に困っていたかから始めます。最後にできあがるのは、当日の運営の仕様書です。
      - type: table
        caption: 工程ごとに、やったこととできたもの
        head:
          - 工程
          - やったこと
          - できたもの
        rows:
          - - ①問題を見つける
            - 去年の様子を観察し、アンケートを読み直した
            - 問題の一文、ペルソナ
          - - ②要件を定める
            - 「楽しい」を数で確かめられる形にした
            - 要件の表、IDEF0の図
          - - ③案を広げる
            - 一人ずつ書き出してから持ち寄った
            - 九つの案
          - - ④比べて選ぶ
            - 要件から決めた基準で比べた
            - 比較の表、選んだ理由
          - - ⑤形を詰める
            - 15分の流れを決め、試しにやってみた
            - 運営の仕様書

  - id: problem
    step: 1
    heading: 高校生は、体験の前に帰っていた
    blocks:
      - type: point
        text: 問題は「体験の中身」ではなく、「順番を待つあいだに、何が起きるのかわからないこと」にありました。
      - type: p
        text: 去年の体験コーナーの写真と、来場者アンケート（42件）を読み直し、手伝った部員4人に話を聞きました。カードに書き出した事実をKJ法でまとめると、「中身がつまらない」という声より、「並んでいる人が多くて、何をするのかわからないまま帰った」という声が目立ちました。
      - type: example
        title: 問題の一文とペルソナ
        text: 問題「高校生が、体験の中身と待ち時間がわからないまま、体験せずに帰ってしまう」。ペルソナ「情報系に少し興味がある高校2年生。保護者と一緒に来て、ほかの学部も回りたいので、一つの場所に長くはいられない」。
      - type: p
        text: もし最初に「もっと面白い体験をつくろう」と決めていたら、待ち時間の問題には手が付かなかったはずです。

  - id: requirements
    step: 2
    heading: 「楽しい」を、確かめられる条件にする
    blocks:
      - type: point
        text: 待ち時間、一回の長さ、回せる人数、予算、安全。当日あとから確かめられる形で書きます。
      - type: table
        caption: 体験コーナーの要件（架空の例）
        head:
          - 要件
          - 種類
          - 確かめ方
        rows:
          - - 待ち時間は10分以内
            - なくてはならない
            - 受付で、並び始めと開始の時刻を記録する
          - - 一回の体験は15分以内
            - なくてはならない
            - 各回の開始と終了の時刻を記録する
          - - 1時間に24人以上が体験できる
            - なくてはならない
            - 受付の記録を数える
          - - 体験した人の8割が「内容がわかった」と答える
            - なくてはならない
            - 終わったあとの3問のアンケート
          - - 刃物や熱を使わない
            - 制約（安全）
            - 使う道具の一覧を見直す
          - - 費用は1万円以内、部員4人で回せる
            - 制約
            - 見積もりと当番表を確かめる
          - - 持ち帰れるものがある
            - あればうれしい
            - アンケートの自由記述を見る
      - type: idef0
        title: 「高校生に体験してもらう」をIDEF0で描く
        caption: 図にすると、受付から感想を聞くまでが一つの流れだとわかる。待ち時間の問題は、最初の箱「受付して待ってもらう」の中にある。
        function: 高校生に体験してもらう
        inputs:
          - 来場した高校生
        controls:
          - 大学の安全の決まり
          - 開催の時間
        outputs:
          - 体験を終えた高校生
          - アンケートの回答
        mechanisms:
          - 部員4人
          - 教材と機材
        steps:
          - name: 受付して待ってもらう
            output: 順番を待つ高校生
          - name: 体験してもらう
            output: 体験を終えた高校生
          - name: 感想を聞く
            output: アンケートの回答

  - id: ideas
    step: 3
    heading: 九つの案を出した
    blocks:
      - type: point
        text: 体験の中身の案だけでなく、待ち時間そのものを変える案も並べました。
      - type: list
        items:
          - "**体験の中身**：紙と輪ゴムで動くロボットアームをつくる／LEDを光らせるプログラムを書く／「迷わない案内表示」を考える設計ゲーム／部員の作品の展示"
          - "**待ち時間を変える**：時間を指定した整理券を配る／待つ列で遊べるクイズのカード／体験の流れを1枚の掲示にする"
          - "**場所を変える**：教室を二つに分け、説明と体験を別の場所にする／ほかの学部の企画と回り方を組む"
      - type: p
        text: 案は、部員が5分ずつ黙って書き出してから持ち寄りました。「整理券」は、保護者と回る高校生の様子を思い浮かべた部員から出た案です。

  - id: selection
    step: 4
    heading: 時間・人数・予算で比べ、二つの案を組み合わせた
    blocks:
      - type: point
        text: 基準は要件から先に決めました。一つの案では要件を満たせなかったので、よいところを組み合わせました。
      - type: table
        caption: 体験の中身の案を比べる（基準の案は「作品の展示」）
        head:
          - 基準
          - ロボットアーム工作
          - LEDのプログラム
          - 設計ゲーム
        rows:
          - - 15分で終わる
            - －
            - S
            - ＋
          - - 1時間に24人
            - －
            - －
            - ＋
          - - 「わかった」と思える
            - ＋
            - ＋
            - ＋
          - - 費用1万円以内
            - －
            - －
            - S
          - - 持ち帰れるもの
            - ＋
            - S
            - ＋
          - - 合計
            - "−1"
            - "−1"
            - "+4"
      - type: p
        text: 中身の案でいちばんよかったのは「設計ゲーム」です。けれど、中身を変えるだけでは、並ぶ人の待ち時間は10分以内になりません。そこで、待ち時間を変える案から「整理券」を組み合わせました。ロボットアーム工作は人気が出そうでしたが、15分では終わらず、材料費もかかります。選ばなかった理由も記録し、来年に条件が変わったら見直せるようにしました。

  - id: detail
    step: 5
    heading: 当日の15分を、分単位で決める
    blocks:
      - type: point
        text: 誰が、いつ、何を言い、何を配るのかまで決めます。試しにやってみて、決めたことを直してから仕様書にします。
      - type: table
        caption: 一回の体験の流れ（運営の仕様書から）
        head:
          - 時間
          - やること
          - 担当
        rows:
          - - 0〜2分
            - 説明のカードを渡し、お題「迷わない案内表示」を伝える
            - 説明係
          - - 2〜10分
            - 3人一組で、校内図に案内表示を描き込む
            - 見守り係（2人）
          - - 10〜13分
            - 各組が30秒で説明し、部員が一言ずつ返す
            - 説明係
          - - 13〜15分
            - アンケート（3問）に答え、描いた図を持ち帰る
            - 受付係
      - type: figure
        name: session-timeline
      - type: p
        text: 部員の友人5人に試してもらうと、説明に5分かかり、時間が足りませんでした。そこで説明を、図の入ったカード1枚にまとめ直しました。要件を満たせないとわかったら前に戻る。小さな試しでも、工程を行き来することになります。
      - type: example
        title: できた仕様書に書いたこと
        text: 一回の流れと時間、係の人数と役目、整理券の配り方（15分ごとに9枚）、使う物の一覧と費用、雨の日の場所、気分が悪くなった人がいたときの連絡先。そして、どの要件を、当日どうやって確かめるか。

  - id: outputs
    heading: この例でできたもの
    blocks:
      - type: point
        text: 問題の一文、要件の表、IDEF0の図、案の一覧と比較の表、運営の仕様書。設計会では、こうした成果物を発表して、ほかの学部の部員から意見をもらいます。
      - type: link
        label: 工程1「問題を見つける」を詳しく読む
        href: /design/problem-finding/

