title: オープンキャンパスの体験コーナー
en: "Case: Open Campus"
layer: case
order: 1
short: 例：イベントの設計
question: 高校生が「来てよかった」と思える体験とは
summary: 情報工学部のオープンキャンパスで、高校生向けの体験コーナーを設計する例。五つの工程を順にたどり、運営の仕様書をつくるまで。
lead: 設計会の「設計の場」で、一つのテーマがどう進むかを示すために、説明用につくった架空の例です（去年の様子や人数、数字も架空のものです）。テーマは「オープンキャンパスで、高校生向けの体験コーナーを設計する」。五つの工程で、何を考え、何ができあがるのかをたどります。
chapters:
  - id: overview
    heading: この例の流れ
    blocks:
      - type: point
        text: 去年の来場者が何に困っていたかから考え始めます。「体験コーナーで何をやるか」を決めるのは、その後です。最後にできあがるのは、当日の運営の仕様書です。
      - type: table
        caption: 工程ごとに、やったこととできたもの
        head:
          - 工程
          - やったこと
          - できたもの
        rows:
          - - ①問題を見つける
            - 去年の様子を観察し、アンケートを読み直した
            - 問題の一文、ペルソナ
          - - ②要件を定める
            - 「楽しい」を数で確かめられる形にした
            - 要件の表、IDEF0の図
          - - ③案を広げる
            - 一人ずつ書き出してから持ち寄った
            - 九つの案
          - - ④比べて選ぶ
            - 要件から決めた基準で比べた
            - 比較の表、選んだ理由
          - - ⑤形を詰める
            - 15分の流れを決め、試しにやってみた
            - 運営の仕様書

  - id: problem
    step: 1
    heading: 高校生は、体験の前に帰っていた
    blocks:
      - type: point
        text: 問題は体験の中身より手前、「順番を待つあいだに、何が起きるのかわからないこと」にありました。
      - type: p
        text: 去年の体験コーナーの写真と、来場者アンケート（42件）を読み直し、手伝った部員4人に話を聞きました。事実をカードに書き出し、[[problem-finding#kj|KJ法]]（似たカードを集めて、まとまりから問題を見つける方法）で整理すると、「中身がつまらない」という声より、「並んでいる人が多くて、何をするのかわからないまま帰った」という声が目立ちました。
      - type: p
        text: そこで、問題を一文にまとめ、想定する来場者を一人の人物像（ペルソナ）として描きました。
      - type: example
        title: 問題の一文とペルソナ
        text: 問題「高校生が、体験の中身と待ち時間がわからないまま、体験せずに帰ってしまう」。ペルソナ「情報系に少し興味がある高校2年生。保護者と一緒に来て、ほかの学部も回りたいので、一つの場所に長くはいられない」。
      - type: p
        text: 問題をこの一文にしたことで、体験の中身を面白くすることに加えて、待ち時間そのものを変えるという方向が見えてきました。

  - id: requirements
    step: 2
    heading: 「楽しい」を、確かめられる条件にする
    blocks:
      - type: point
        text: 工程1の問題「中身と待ち時間がわからないまま帰ってしまう」を、待ち時間・一回の長さ・回せる人数・予算・安全の条件に書き直します。どれも当日に測って確かめられる形にします。
      - type: p
        text: 要件とは、設計が満たすべき条件を、満たしたかどうか確かめられる形で書いたものです。「楽しい」も、「体験した人の8割が『内容がわかった』と答える」と書けば、当日のアンケートで確かめられます。要件は、必須の要件、守るべき制約、あればうれしい要件の三つに分けました。
      - type: table
        caption: 体験コーナーの要件（架空の例）
        head:
          - 要件
          - 種類
          - 確かめ方
        rows:
          - - 待ち時間は10分以内
            - 必須
            - 受付で、並び始めと開始の時刻を記録する
          - - 一回の体験は15分以内
            - 必須
            - 各回の開始と終了の時刻を記録する
          - - 1時間に24人以上が体験できる
            - 必須
            - 受付の記録を数える
          - - 体験した人の8割が「内容がわかった」と答える
            - 必須
            - 終わったあとの3問のアンケート
          - - 刃物や熱を使わない
            - 制約（安全）
            - 使う道具の一覧を見直す
          - - 費用は1万円以内、部員4人で回せる
            - 制約
            - 見積もりと当番表を確かめる
          - - 持ち帰れるものがある
            - あればうれしい
            - アンケートの自由記述を見る
      - type: p
        text: 次に、体験コーナーの仕事をIDEF0で図にしました。IDEF0は、機能を箱で表し、左から入る入力、右へ出る出力、上から入る制御（決まりや条件）、下から入る機構（人や道具）を矢印で描く図です。
      - type: idef0
        title: 「高校生に体験してもらう」をIDEF0で描く
        caption: 図にすると、受付から感想を聞くまでが一つの流れだとわかる。待ち時間の問題は、最初の箱「受付して待ってもらう」の中にある。
        function: 高校生に体験してもらう
        inputs:
          - 来場した高校生
        controls:
          - 大学の安全の決まり
          - 開催の時間
        outputs:
          - 体験を終えた高校生
          - アンケートの回答
        mechanisms:
          - 部員4人
          - 教材と機材
        steps:
          - name: 受付して待ってもらう
            output: 順番を待つ高校生
          - name: 体験してもらう
            output: 体験を終えた高校生
          - name: 感想を聞く
            output: アンケートの回答

  - id: ideas
    step: 3
    heading: 九つの案を出した
    blocks:
      - type: point
        text: 要件の表で、待ち時間は「必須」の条件になりました。そこで、体験の中身の案に加えて、待ち時間そのものを変える案も並べました。
      - type: list
        items:
          - "**体験の中身**：紙と輪ゴムで動くロボットアームをつくる／LEDを光らせるプログラムを書く／「一目でわかる案内表示」を考える設計ゲーム／部員の作品の展示"
          - "**待ち時間を変える**：時間を指定した整理券を配る／待つ列で遊べるクイズのカード／体験の流れを1枚の掲示にする"
          - "**場所を変える**：教室を二つに分け、説明と体験を別の場所にする／ほかの学部の企画と回り方を組む"
      - type: p
        text: 案は、部員が5分ずつ黙って書き出してから持ち寄りました。一人ずつ書けば、全員が同時に案を出せるからです。「整理券」は、保護者と回る高校生の様子を思い浮かべた部員から出た案です。

  - id: selection
    step: 4
    heading: 時間・人数・予算で比べ、二つの案を組み合わせた
    blocks:
      - type: point
        text: 九つの案を比べる前に、要件から比べる基準を決めました。一つの案では要件を満たせなかったので、二つの案のよいところを組み合わせました。
      - type: p
        text: 体験の中身の案は、ピューの概念選定法で比べました。基準案を一つ決め、ほかの案が基準ごとに基準案よりよければ＋、悪ければ－、同じならSを付けて、数を合計する方法です。
      - type: table
        caption: 体験の中身の案を、ピューの概念選定法で比べる（基準案は「作品の展示」）
        head:
          - 評価の基準
          - ロボットアーム工作
          - LEDのプログラム
          - 設計ゲーム
        rows:
          - - 15分で終わる
            - －
            - S
            - ＋
          - - 1時間に24人
            - －
            - －
            - ＋
          - - 「わかった」と思える
            - ＋
            - ＋
            - ＋
          - - 費用1万円以内
            - －
            - －
            - S
          - - 持ち帰れるもの
            - ＋
            - S
            - ＋
          - - 合計
            - "－1"
            - "－1"
            - "+4"
      - type: p
        text: 中身の案でいちばんよかったのは「設計ゲーム」です。けれど、並ぶ人の待ち時間を10分以内に収めるには、中身とは別の手が必要です。そこで、待ち時間を変える案から「整理券」を組み合わせました。ロボットアーム工作は人気が出そうでしたが、15分では終わらず、材料費もかかります。選ばなかった理由も記録し、来年に条件が変わったら見直せるようにしました。

  - id: detail
    step: 5
    heading: 当日の15分を、分単位で決める
    blocks:
      - type: point
        text: 選んだ「設計ゲーム＋整理券」を、当日の動きに落とし込みます。誰が、いつ、何を言い、何を配るのかまで決め、試しにやってみて直してから仕様書にします。
      - type: table
        caption: 一回の体験の流れ（運営の仕様書から）
        head:
          - 時間
          - やること
          - 担当
        rows:
          - - 0〜2分
            - 説明のカードを渡し、お題「一目でわかる案内表示」を伝える
            - 説明係
          - - 2〜10分
            - 3人一組で、校内図に案内表示を描き込む
            - 見守り係（2人）
          - - 10〜13分
            - 各組が30秒で説明し、部員が一言ずつ返す
            - 説明係
          - - 13〜15分
            - アンケート（3問）に答え、描いた図を持ち帰る
            - 受付係
      - type: figure
        name: session-timeline
      - type: p
        text: 部員の友人5人に試してもらうと、説明に5分かかり、時間が足りませんでした。そこで説明を、図の入ったカード1枚にまとめ直しました。試して要件とのずれが見つかったら、前に決めたことに戻って直す。小さな試しでも、工程を行き来することになります。
      - type: example
        title: できた仕様書に書いたこと
        text: 当日の係が、読めばそのとおりに動けるように書きます。一回の流れと時間、係の人数と役目、整理券の配り方（15分ごとに9枚）、使う物の一覧と費用、雨の日の場所、気分が悪くなった人がいたときの連絡先。そして、どの要件を、当日どうやって確かめるか。

  - id: outputs
    heading: この例でできたもの
    blocks:
      - type: point
        text: 問題の一文、要件の表、IDEF0の図、案の一覧と比較の表、運営の仕様書。設計会では、こうした成果物を発表して、ほかの学部の部員から意見をもらいます。
      - type: link
        label: 工程1「問題を見つける」を詳しく読む
        href: /design/problem-finding/

