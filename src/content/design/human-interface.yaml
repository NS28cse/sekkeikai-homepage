title: ヒューマンインターフェース
en: Human Interface
layer: lens
order: 2
short: 人から考える
question: 人と人工物の境界を、どう設計するか
summary: 人がどう見て、考え、手を動かすかを理解し、使う人にとって自然で誤りにくい「境界面」を設計する。
lead: 人が使うものを設計するなら、人もまた設計の一部です。ヒューマンインターフェースとは、人と機械や情報、サービスが出会う境界面のこと。ボタンの形や画面の配置から、手順の流れや言葉づかいまで、人が迷うか、誤るかは、その境界の設計で決まります。
chapters:
  - id: basics
    heading: 人を知ることから始まる
    blocks:
      - type: question
        text: 押しにくいボタン、迷う画面、間違えやすいスイッチ。それは、使う人の不注意のせいでしょうか？
        answer: 多くの場合、設計の問題です。人の目や手や記憶には、調べればわかる特性と限界があります。それに合わせて設計すれば、迷いや誤りは減らせます。
      - type: point
        text: 人と人工物が出会う「境界面」を、人の特性に合わせて設計する。それがヒューマンインターフェースです。
      - type: p
        text: |-
          人の知覚や記憶、手の動きには、科学的に調べられた特性と限界があります。たとえば、手を動かして目標を指し示すのにかかる時間は、目標までの距離が遠いほど、目標が小さいほど長くなります。心理学者ポール・フィッツが1954年に定式化したこの関係は「フィッツの法則」と呼ばれ、のちにマウスなどで画面上の目標を指す操作にも当てはまることが確かめられて、ボタンの大きさや配置を決める根拠として使われています。
        note: |-
          P. M. Fitts, "The information capacity of the human motor system in controlling the amplitude of movement", Journal of Experimental Psychology, 47(6), 1954。
      - type: p
        text: |-
          下のデモで、実際に試してみてください。表示される丸を次々にクリック（タップ）すると、丸の大きさと距離から計算した「難しさ」と、かかった時間の関係がグラフに描かれていきます。
      - type: figure
        name: fitts-demo
      - type: p
        text: |-
          認知科学者ドナルド・ノーマンらは、人がものを使うときに越えなければならない二つの「淵」を示しました。何をすればよいかわからない「実行の淵」と、結果がどうなったのかわからない「評価の淵」です。よいインターフェースは、操作の手がかり（シグニファイア）を示し、結果をすぐに返すことで、この二つの淵に橋を架けます。
        note: |-
          E. L. Hutchins, J. D. Hollan, D. A. Norman, "Direct Manipulation Interfaces", Human-Computer Interaction, 1(4), 1985。D. A. Norman, The Design of Everyday Things, 2013。
      - type: figure
        name: gulfs
      - type: example
        title: 実際にあった例：Suicaの改札
        text: |-
          朝の駅で、改札の前で立ち止まる人が一人いると、後ろの列が止まります。JR東日本のSuicaの改札は、カードと機械の1人分のやりとりを約0.2秒で終えるようにつくられました。読み取る面も少し傾けて、歩きながら軽く触れやすくしています。触れる場所の形で「どこにかざすか」を伝え、すぐに音と表示で結果を返す。二つの淵に橋を架ける設計が、駅の人の流れを支えています。
        source: JR東日本の資料や報道による。処理時間の数字は、資料によって幅がある。
      - type: p
        text: |-
          操作の手がかりがずれると、人は迷います。押して開けるドアに、つかむ棒が付いていると、形が「引いて」と伝えてしまい、「押」の表示を貼っても間違える人が出ます。押せない、つかめない平らな板なら、表示がなくても押すとわかります。押すのか引くのかわからないドアは「ノーマンドア」と呼ばれることもあります。
      - type: figure
        name: door-signifier

  - id: why
    heading: 誤りの多くは、設計から生まれる
    blocks:
      - type: point
        text: 使う人の誤りの多くは、設計から生まれます。人がどう使うかは、最後の仕上げではなく、要件の段階から考えることです。
      - type: p
        text: |-
          使う人が操作を誤ったとき、それは使う人の責任でしょうか。第二次世界大戦中のB-17爆撃機などでは、フラップと着陸装置の操作レバーがよく似た形で並んでいたために、着陸したあと車輪を格納してしまう事故が繰り返されました。心理学者たちがそれぞれのつまみに違う形を付けると、取り違えは大きく減ったと伝えられています。「操縦士の不注意」とされていた事故の多くは、設計の問題でもあったのです。
        note: |-
          P. M. Fitts & R. E. Jones による操縦ミスの分析（1947年）と、A. Chapanis の回想による。逸話の細部（レバーかスイッチか、改良の効果など）は資料によって異なる。
      - type: figure
        name: shape-coding
      - type: p
        text: |-
          「形で区別する」考え方は、今も使われています。気をつけるよう呼びかけるより、取り違えが**起こりえない形**にするほうが確実だからです。
      - type: example
        title: 実際にあった例：シャンプーのきざみ
        text: |-
          髪を洗っているとき、人は目を閉じています。シャンプーとリンスの容器がそっくりだと、触っても区別できません。花王は「取り違えた」「目が不自由なので容器を工夫してほしい」という声を受けて、1991年にシャンプーの容器の横にきざみを付けました。ほかの会社にも呼びかけて業界でそろえた結果、今ではほとんどのシャンプーにきざみがあります。高齢者や障害のある人に配慮した包装の規格JIS S 0021でも、例として挙げられています。
        source: 花王の発表と取材記事、JIS S 0021（包装―アクセシブルデザイン―一般要求事項）による。
      - type: example
        title: 実際にあった例：つなぎ口の形を変える
        text: |-
          病院では、鼻から胃に通す栄養のチューブと、血管に入れる点滴の管の両方を使います。管どうしがつながってしまうと、栄養剤が血管に入る取り違えが起こりえます。国際規格ISO 80369-3は、栄養のチューブのつなぎ口を、ほかの用途の管とはつながらない形に定めました。日本では厚生労働省が2018年3月16日の通知でこの規格の製品への切り替えを示し、古い規格の製品の出荷は2021年11月までとしました（2022年に、一部の扱いを見直しています）。
        source: 厚生労働省ほか、経腸栄養分野の小口径コネクタ製品の切替えについての通知（2018年3月16日）。ISO 80369-3:2016。
      - type: example
        title: 実際にあった例：薬の名前を変える
        text: |-
          高血圧などの薬「アルマール」と、糖尿病の薬「アマリール」。名前がよく似ているため、処方や調剤での取り違えが繰り返し報告されました。2004年に包装を見分けやすくしましたが、それでも防ぎきれず、2012年に「アルマール」の名前そのものが「アロチノロール塩酸塩錠『DSP』」に変わりました。薬の中身はそのままで、名前という境界面を設計し直したのです。
        source: 厚生労働省の資料、日本医療機能評価機構の医療安全情報、製薬会社の販売名変更の案内（2012年）による。
      - type: p
        text: |-
          1979年に米国スリーマイル島の原子力発電所で起きた事故でも、制御室の計器や警報の設計が、運転員の状況の判断を難しくしたことが、事故調査で指摘されました。たくさんの警報が一度に鳴り、本当に大事な情報が埋もれてしまったのです。この事故の後、原子力発電所の制御室の設計では、人間工学の検討が重視されるようになりました。
        note: |-
          Report of the President's Commission on the Accident at Three Mile Island（ケメニー委員会報告）, 1979。
      - type: p
        text: |-
          ヒューマンインターフェースは、見た目を整える最後の仕上げではありません。人がどう使うかを考えずに決めた機能や構造は、あとから画面を整えても直せないことが多いのです。だから人の特性は、[[requirements|要件を定める工程]]から設計に組み込む必要があります。

  - id: how
    heading: 人間中心設計の進め方
    blocks:
      - type: point
        text: 利用状況を理解し、要求を明らかにし、案をつくり、利用者に試してもらう。この繰り返しが人間中心設計です。
      - type: p
        text: |-
          国際規格ISO 9241-210は、人間中心設計を次の活動の繰り返しとして定めています。この流れは、設計会で使う五つの工程とも重なります。
        note: |-
          ISO 9241-210:2019。使いやすさ（ユーザビリティ）は ISO 9241-11:2018 で、特定の利用者が特定の利用状況で特定の目標を達成するときの、有効さ、効率、満足度の度合いとして定義されている。
      - type: figure
        name: hcd-cycle
      - type: steps
        items:
          - title: 利用状況を理解する
            body: 誰が、どこで、何のために、どんな道具を持って使うのか。観察やインタビューで明らかにします。
          - title: 利用者の要求を明らかにする
            body: 理解した利用状況から、満たすべき要求を書き出します。使いやすさも「3回以内の操作で予約が完了する」のように、確かめられる形にします。
          - title: 解決案をつくる
            body: スケッチや紙の試作から始め、少しずつ本物に近づけます。
          - title: 評価する
            body: 実際の利用者に試してもらい、どこでつまずくかを観察します。ヤコブ・ニールセンは、5人ほどの利用者で試すだけでも主な問題の多くが見つかると述べました（ただし製品や利用者の多様さによって必要な人数は変わる、という反論もあります）。
      - type: heading
        text: 話を聞くときは、したことを聞く
      - type: p
        text: |-
          利用状況を理解する話の聞き方と、試作を試してもらうときの見方には、こつがあります。人は、これからの自分がどうするかを、あまり正確には言えません。だから「使いますか？」と聞くより、実際にしたことを聞き、している様子を見ます。
      - type: steps
        ordered: false
        items:
          - title: したことを聞く
            body: 「予約アプリがあったら使いますか？」ではなく、「この前、部室を使ったのはいつ？ そのとき、どうやって空いているか確かめた？」と、実際にあった場面を聞きます。
          - title: 答えを誘わない
            body: 「不便ですよね？」のような聞き方は、相手を「はい」に誘います。「どんなふうに」「そのときどうした」のように、相手の言葉で答えが広がる聞き方にします。
          - title: 事実と解釈を分けて書く
            body: 「予約表の前で30秒止まった」は事実、「迷っていた」は解釈です。メモでは分けて書き、解釈はあとでチームで確かめます。
          - title: 声に出して使ってもらう
            body: 試作を使いながら、考えていることを声に出してもらいます（思考発話法）。どこで、なぜつまずくのかが聞こえます。つまずいても、口を挟まずに待ちます。
          - title: 言うこととすることを比べる
            body: 人が言うことと、実際にすることは、ずれることがあります。できれば、ふだん使う場所で、使う様子を見せてもらいます。
      - type: p
        text: |-
          声に出しながら使ってもらう方法は、1980年代に、コンピューターの画面の評価に取り入れられました。少人数でも、つまずく理由まで聞き取れるのが強みです。
        note: |-
          C. Lewis, "Using the 'thinking-aloud' method in cognitive interface design", IBM Research Report RC 9265, 1982。もとになったのは、心理学で考える過程を調べる方法（K. A. Ericsson & H. A. Simon, Protocol Analysis, 1984）。
      - type: p
        text: |-
          専門家が設計を点検するための指針としては、ニールセンの「10のユーザビリティ・ヒューリスティクス」がよく知られています。システムの状態を見えるようにする、現実の世界の言葉に合わせる、誤りを防ぐ、覚えさせるより見てわかるようにする、などの原則です。
        note: |-
          J. Nielsen, "Enhancing the explanatory power of usability heuristics", CHI '94, 1994。最初の版は J. Nielsen & R. Molich, 1990。
      - type: p
        text: |-
          色の違いだけで情報を伝えない、文字を十分な大きさと濃さで表示する、キーボードだけでも操作できるようにする。こうしたアクセシビリティへの配慮は、障害のある人のためだけでなく、明るい屋外でスマートフォンを見る人や、片手がふさがっている人にとっての使いやすさにもつながります。
      - type: heading
        text: 目で見なくても、わかるようにする
      - type: image
        src: /uploads/design/tactile-paving.jpg
        alt: 歩道に敷かれた黄色い点字ブロック。細長い突起が並んだ線状のブロックの列と、丸い突起が並んだ点状のブロックが交わっている。まわりは赤と灰色の舗装。
        caption: 線状のブロックは進む方向を、点状のブロックは止まる・注意する場所を、足の裏や白い杖に伝える。
        credit: Midnightcomm, Tactile pavers Japan yellow（Wikimedia Commons、縮小して使用）
        license: CC BY 4.0
        licenseUrl: https://creativecommons.org/licenses/by/4.0/
        sourceUrl: https://commons.wikimedia.org/wiki/File:Tactile_pavers_Japan_yellow.jpg
      - type: example
        title: 実際にあった例：岡山で生まれた点字ブロック
        text: |-
          点字ブロックは岡山で生まれました。1967年3月18日、三宅精一が私費で230枚のブロックを、岡山盲学校に近い岡山市の原尾島交差点に敷いたのが始まりです。その後、形が日本産業規格（2001年）に、さらに国際規格ISO 23599（2012年）になり、世界で使われています。目で見る表示が使えない人に、足元の形で情報を伝える設計です。
        source: 岡山市の資料、JIS T 9251:2001、ISO 23599:2012 による。
      - type: example
        title: 実際にあった例：信号の音をそろえる
        text: |-
          目の不自由な人のための音の出る信号には、かつて「通りゃんせ」などのメロディーも使われていました。2003年10月22日の警察庁の通達で、道路のこちら側と向こう側から交互に鳴らす方式にそろえました。南北の向きは「ピヨ」と「ピヨピヨ」、東西の向きは「カッコー」と「カカッコー」です。交互に鳴る音で、渡る先の方向を確かめられます。2025年3月末には、全国の音の出る信号の約99%が、こうした鳥の声をまねた音になっています。
        source: 警察庁「音響式信号機」についての説明（2025年3月末の数）による。
      - type: per-step

  - id: now
    heading: 画面の外へ広がる境界
    blocks:
      - type: point
        text: 人と人工物の境界は画面の外へ広がり、アクセシビリティは法律でも求められるようになってきました。
      - type: p
        text: |-
          スマートフォン、音声アシスタント、車の運転支援、そして対話型のAI。人と人工物の境界は、画面やボタンだけではなくなりました。音声や身ぶり、さらには人の意図を推し量って先回りするシステムが増えるほど、「今システムが何をしようとしているのか」を人が理解できるように設計することが重要になっています。
      - type: p
        text: |-
          アクセシビリティは、法律でも求められるようになってきました。日本では2024年4月に改正障害者差別解消法が施行され、障害のある人から求められたときの「合理的配慮の提供」が、事業者の義務になりました。ウェブサイトのように、前もって誰でも使えるように整えておくこと（環境の整備）は、努力義務として求められています。ウェブについては、W3CのWCAG 2.2（2023年）や日本産業規格JIS X 8341-3が、設計の基準として参照されています。
        note: |-
          障害を理由とする差別の解消の推進に関する法律（2021年改正、2024年4月1日施行）。WCAG 2.2 は2023年10月に W3C 勧告となった。
      - type: p
        text: |-
          このサイト自体も、見出しの階層を守り、画像に代わりの文章を付け、端末で「視差効果を減らす」設定をしている人にはアニメーションを止めるようにつくっています。

  - id: club
    heading: 部員どうしで、試して、観察する
    blocks:
      - type: point
        text: 紙の試作を部員どうしで試し、迷うところを観察して直します。
      - type: p
        text: |-
          設計会で扱うテーマの多くは、最終的に人が使うものです。ペルソナを立てて利用状況を想定し、紙の試作品を部員どうしで試して、どこで迷うかを観察します。説明しないと使えない部分は、設計を見直す候補です。
      - type: p
        text: |-
          大学には、デザインを専門に学ぶ学生もいます。設計会では、見た目の美しさと使いやすさ、技術的に実現できるかどうかを一緒に考えられるよう、分野の違う学生が意見を交わすことを大切にしています。
  - id: history
    label: 寄り道：歴史
    heading: 機械を人に合わせる、という発想
    blocks:
      - type: point
        text: 「機械に人を合わせる」から「機械を人に合わせる」へ。始まりは、戦時中の操縦席でした。
      - type: timeline
        items:
          - year: 1940年代
            title: 人間工学の誕生
            body: 戦時中の航空機の操縦ミスの研究から、機械を人に合わせて設計するという考え方が生まれる。
          - year: "1954"
            title: フィッツの法則
            body: 指し示す動作の速さと正確さの関係が定式化される。
          - year: "1956"
            title: マジカルナンバー7±2
            body: ジョージ・ミラーが、人が一度に覚えておける量の限界を論じる（現在は、より少ない四つ前後とする研究が有力）。
          - year: "1963"
            title: Sketchpad
            body: ペンで画面上の図形を直接操作できるシステムが登場する。
          - year: "1967"
            title: 点字ブロック
            body: 三宅精一が考えたブロックが、岡山市の原尾島交差点に初めて敷かれる。
          - year: "1968"
            title: すべてのデモの母
            body: ダグラス・エンゲルバートが、マウス、ウィンドウ、ハイパーテキスト、離れた場所との共同編集を一度に実演する。
          - year: "1973"
            title: Xerox Alto
            body: ゼロックスのパロアルト研究所で、画面上の絵やウィンドウを操作するコンピューターがつくられる。
          - year: "1984"
            title: Macintosh
            body: グラフィカルなユーザーインターフェースを備えたパソコンが一般向けに発売される。
          - year: "1988"
            title: 『誰のためのデザイン？』の原著
            body: ノーマンがThe Psychology of Everyday Things（のちにThe Design of Everyday Thingsと改題。邦訳は1990年）で、日用品の使いにくさを通して人間中心の設計を説く。
          - year: "1991"
            title: シャンプーのきざみ
            body: 目を閉じていても触って区別できるよう、シャンプーの容器にきざみが付く。のちに業界でそろえられる。
          - year: "1997"
            title: ユニバーサルデザインの7原則
            body: ロナルド・メイスらが、できるだけ多くの人が使える設計の原則をまとめる。
          - year: "2007"
            title: マルチタッチの普及
            body: 指で画面を直接操作するスマートフォンが登場し、インターフェースの前提が大きく変わる。

perStep:
  - cell: 使う人を観察し、話を聞く
    body: 使う人の行動を観察し、話を聞いて、言葉にならない困りごとを見つけます。
  - cell: ペルソナと利用状況を定める
    body: ペルソナと利用状況を定め、使いやすさも「3回以内の操作で完了する」のような確かめられる要件にします。
  - cell: 紙の試作で操作を試す
    body: 画面や操作を紙に描き、指で動かしながら流れを試します（ペーパープロトタイピング）。
  - cell: 利用者に試してもらい比べる
    body: 案ごとに利用者に試してもらい、つまずいた回数やかかった時間で比べます。
  - cell: 画面と操作の細部を詰める
    body: ボタンの大きさや配置、言葉づかい、色のコントラストを、フィッツの法則や設計の原則に照らして詰めます。
