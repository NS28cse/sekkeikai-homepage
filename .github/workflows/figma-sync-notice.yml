# tokens/tokens.json（デザインの正本）が main で変わったら、
# 「Figma に Pull してね」という Issue を自動で立てる。
# Figma 側は Tokens Studio プラグインで Pull → Variables に反映（docs/figma.md 参照）。
name: Figma sync notice

on:
  push:
    branches: [main]
    paths:
      - tokens/tokens.json

permissions:
  contents: read
  issues: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Figma 同期待ちの Issue を作る
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          short="${SHA:0:7}"
          gh label create figma-sync --repo "$REPO" --color E8772E --description "Figma への反映待ち" 2>/dev/null || true
          gh issue create --repo "$REPO" \
            --title "Figma 同期待ち: デザイントークンが更新されました（${short}）" \
            --label figma-sync \
            --body "tokens/tokens.json が更新されました。

          - 差分: https://github.com/${REPO}/compare/${BEFORE}...${SHA}
          - やること: Figma の「設計会」チームでトークン用ファイルを開き、Tokens Studio で **Pull** → **Export to Variables**
          - 終わったらこの Issue を閉じてください

          手順の詳細: docs/figma.md"
